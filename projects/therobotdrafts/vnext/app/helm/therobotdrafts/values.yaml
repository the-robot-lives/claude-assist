replicas: 1
# Rides the existing therobotplans.com zone as the `draft` subdomain. The apex
# and api.therobotplans.com belong to tobornalp — never widen scope to those.
domain: draft.therobotplans.com
# Single host, path-routed (foryou pattern): the ingress serves API and app off
# one origin, so there is no separate app.* host.
appDomain: ""
# Host-only cookie, deliberately NOT ".therobotplans.com" — a dot-prefixed apex
# would scope TRD's auth cookies across tobornalp's apex and api. hosts.
cookieDomain: "draft.therobotplans.com"

backend:
  image: ops.noizu.com/draft.therobotplans.com/backend:v1.0.0
  port: 4000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  image: ops.noizu.com/draft.therobotplans.com/frontend:v1.0.0
  port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

migrate:
  # Schema is applied via Liquibase (liquibase-shell therobotdrafts); the
  # release-eval hook only runs Ecto.Migrator against an empty priv dir.
  enabled: false
  command: ["bin/holo_graph", "eval", "HoloGraph.Release.migrate()"]
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

database:
  host: app-timescaledb.apps.svc.cluster.local
  port: 5432
  name: therobotdrafts

redis:
  host: app-valkey.apps.svc.cluster.local
  port: 6379
  # db 11 on the shared app-valkey. Verified 2026-07-27 against the
  # *_REDIS_URL templates in .infisical-secrets.yaml (the authoritative map):
  # 1-10 and 12-15 are claimed by other apps, 0 is the only other free index.
  # The effective index comes from THEROBOTDRAFTS_REDIS_URL; keep the two in sync.
  db: 11

secrets:
  name: therobotdrafts-secrets
  infisical:
    enabled: true
    resyncInterval: 120
    hostAPI: "https://infisical.noizu.com/api"
    credentialsSecret: universal-auth-credentials
    credentialsNamespace: infra
    projectSlug: k8-infra
    envSlug: prod
    secretsPath: "/apps/therobotdrafts"
  keys:
    dbUser: THEROBOTDRAFTS_DB_USER
    dbPassword: THEROBOTDRAFTS_DB_PASSWORD
    databaseUrl: THEROBOTDRAFTS_DATABASE_URL
    secretKeyBase: THEROBOTDRAFTS_SECRET_KEY_BASE
    guardianSecretKey: THEROBOTDRAFTS_GUARDIAN_SECRET_KEY
    redisUrl: THEROBOTDRAFTS_REDIS_URL
    sendgridApiKey: ""
    oidcClientId: THEROBOTDRAFTS_OIDC_CLIENT_ID
    oidcClientSecret: THEROBOTDRAFTS_OIDC_CLIENT_SECRET
    googleClientId: ""
    googleClientSecret: ""
    facebookClientId: ""
    facebookClientSecret: ""
    githubClientId: ""
    githubClientSecret: ""
    linkedinClientId: ""
    linkedinClientSecret: ""
    samlSpCert: ""
    samlSpKey: ""

mail:
  fromName: ""
  fromAddress: ""

sso:
  requireInvite: false
  # SSO availability by email domain — fail-closed: domains absent here cannot
  # sign in via SSO at all. Operator-approved set (2026-07-27).
  domains: "greatnonprofits.org=oidc;communityconnectlabs.com=oidc;noizu.com=oidc;therobotlives.com=oidc"
  autoApproveDomains: "greatnonprofits.org;communityconnectlabs.com;noizu.com;therobotlives.com"
  oidc:
    # Authentik application (provider pk=20, created 2026-07-27); client
    # id/secret come from Infisical via THEROBOTDRAFTS_OIDC_CLIENT_ID / _SECRET.
    issuer: "https://auth.derobot.is/application/o/therobotdrafts"
  saml:
    idpMetadata: ""
    idpMetadataFile: ""
    idpMetadataUrl: ""
    spEntityId: ""

extraEnv: []

configMap:
  enabled: false
  data: {}

imagePullSecrets:
  - name: ops-registry-secret

analytics:
  ga:
    measurementId: ""
  posthog:
    key: ""
    host: "https://us.i.posthog.com"

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  cloudflareOnly: true

tls:
  enabled: true
  secretName: therobotdrafts-tls
  infisical:
    enabled: true
    resyncInterval: 120
    hostAPI: "https://infisical.noizu.com/api"
    credentialsSecret: universal-auth-credentials
    credentialsNamespace: infra
    projectSlug: k8-infra
    envSlug: prod
    # Cert covers draft.therobotplans.com only. tobornalp's apex cert
    # (therobotplans-com-tls, /apps/tls/therobotplans) is apex-only, not a
    # wildcard, so TRD cannot share it and carries its own.
    # Folder name must match the .infisical-secrets.yaml section path exactly
    # (no hyphen) — a mismatch here is what produced gotta.cc's 526.
    secretsPath: "/apps/tls/therobotdrafts"
    crtKey: THEROBOTDRAFTS_TLS_CRT
    keyKey: THEROBOTDRAFTS_TLS_KEY

otel:
  enabled: false
  collectorEndpoint: "otel-collector.observability-ns.svc.cluster.local:4317"
  collectorHttpEndpoint: "http://otel-collector.observability-ns.svc.cluster.local:4318"
  serviceName: "therobotdrafts"

storage:
  enabled: false
  bucket: ""
  region: "us-east-1"
  endpoint: ""
  scheme: "https://"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

sandbox:
  enabled: false
  image: ops.noizu.com/draft.therobotplans.com/sandbox:latest
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    enabled: false
    size: 5Gi
    storageClass: ""
  service:
    type: ClusterIP
