replicas: 1
domain: therobotdrafts.com
appDomain: app.therobotdrafts.com
# Dot-prefixed apex so auth cookies span therobotdrafts.com and
# app.therobotdrafts.com.
cookieDomain: ".therobotdrafts.com"

backend:
  image: ops.noizu.com/therobotdrafts.com/backend:v1.0.0
  port: 4000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  image: ops.noizu.com/therobotdrafts.com/frontend:v1.0.0
  port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

migrate:
  # Schema is applied via Liquibase (liquibase-shell therobotdrafts); the
  # release-eval hook only runs Ecto.Migrator against an empty priv dir.
  enabled: false
  command: ["bin/holo_graph", "eval", "HoloGraph.Release.migrate()"]
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

database:
  host: app-timescaledb.apps.svc.cluster.local
  port: 5432
  name: therobotdrafts

redis:
  host: app-valkey.apps.svc.cluster.local
  port: 6379
  # db 11 — only free index on app-valkey (0-10 and 12-15 are claimed).
  db: 11

secrets:
  name: therobotdrafts-secrets
  infisical:
    enabled: true
    resyncInterval: 120
    hostAPI: "https://infisical.noizu.com/api"
    credentialsSecret: universal-auth-credentials
    credentialsNamespace: infra
    projectSlug: k8-infra
    envSlug: prod
    secretsPath: "/apps/therobotdrafts"
  keys:
    dbUser: THEROBOTDRAFTS_DB_USER
    dbPassword: THEROBOTDRAFTS_DB_PASSWORD
    databaseUrl: THEROBOTDRAFTS_DATABASE_URL
    secretKeyBase: THEROBOTDRAFTS_SECRET_KEY_BASE
    guardianSecretKey: THEROBOTDRAFTS_GUARDIAN_SECRET_KEY
    redisUrl: THEROBOTDRAFTS_REDIS_URL
    sendgridApiKey: ""
    oidcClientId: THEROBOTDRAFTS_OIDC_CLIENT_ID
    oidcClientSecret: THEROBOTDRAFTS_OIDC_CLIENT_SECRET
    googleClientId: ""
    googleClientSecret: ""
    facebookClientId: ""
    facebookClientSecret: ""
    githubClientId: ""
    githubClientSecret: ""
    linkedinClientId: ""
    linkedinClientSecret: ""
    samlSpCert: ""
    samlSpKey: ""

mail:
  fromName: ""
  fromAddress: ""

sso:
  requireInvite: false
  # SSO availability by email domain ("example.com=oidc;corp.example=google,oidc").
  # Left empty until an Authentik provider is registered for therobotdrafts —
  # the backend defaults closed, so SSO is simply unavailable meanwhile.
  domains: ""
  autoApproveDomains: ""
  oidc:
    # Set to the Authentik application issuer once the provider exists, e.g.
    # https://auth.derobot.is/application/o/therobotdrafts — leave empty to
    # keep the OIDC strategy disabled.
    issuer: ""
  saml:
    idpMetadata: ""
    idpMetadataFile: ""
    idpMetadataUrl: ""
    spEntityId: ""

extraEnv: []

configMap:
  enabled: false
  data: {}

imagePullSecrets:
  - name: ops-registry-secret

analytics:
  ga:
    measurementId: ""
  posthog:
    key: ""
    host: "https://us.i.posthog.com"

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  cloudflareOnly: true

tls:
  enabled: true
  secretName: therobotdrafts-tls
  infisical:
    enabled: true
    resyncInterval: 120
    hostAPI: "https://infisical.noizu.com/api"
    credentialsSecret: universal-auth-credentials
    credentialsNamespace: infra
    projectSlug: k8-infra
    envSlug: prod
    # Folder name must match the .infisical-secrets.yaml section path exactly
    # (no hyphen) — a mismatch here is what produced gotta.cc's 526.
    secretsPath: "/apps/tls/therobotdrafts"
    crtKey: THEROBOTDRAFTS_TLS_CRT
    keyKey: THEROBOTDRAFTS_TLS_KEY

otel:
  enabled: false
  collectorEndpoint: "otel-collector.observability-ns.svc.cluster.local:4317"
  collectorHttpEndpoint: "http://otel-collector.observability-ns.svc.cluster.local:4318"
  serviceName: "therobotdrafts"

storage:
  enabled: false
  bucket: ""
  region: "us-east-1"
  endpoint: ""
  scheme: "https://"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

sandbox:
  enabled: false
  image: ops.noizu.com/therobotdrafts.com/sandbox:latest
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    enabled: false
    size: 5Gi
    storageClass: ""
  service:
    type: ClusterIP
