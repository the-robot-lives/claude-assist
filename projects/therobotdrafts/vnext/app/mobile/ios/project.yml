# XcodeGen spec for The Robot Draft iPhone/iPad app.
#
# Generate locally with:
#   make generate

name: RobotDrafts

options:
  bundleIdPrefix: com.noizu
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  RobotDrafts:
    type: application
    platform: iOS
    sources:
      - path: RobotDrafts
    settings:
      base:
        PRODUCT_NAME: RobotDrafts
        PRODUCT_MODULE_NAME: RobotDrafts
        PRODUCT_BUNDLE_IDENTIFIER: com.noizu.therobotdrafts
        INFOPLIST_FILE: RobotDrafts/App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO

  RobotDraftsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: RobotDrafts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noizu.therobotdrafts.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RobotDrafts:
    build:
      targets:
        RobotDrafts: all
        RobotDraftsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RobotDraftsTests
