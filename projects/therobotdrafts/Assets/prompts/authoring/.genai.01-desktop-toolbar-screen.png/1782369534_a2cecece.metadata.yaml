eval_notes: "The generated artifact mostly meets the requirements. The mood is calm and premium, with a 3D depth effect. The layout is mostly faithful, with a clear left vertical rail, creation-palette flyout, and breadcrumb HUD on top. The palette is largely faithful, with bubbles using the exact Okabe-Ito kind hues and distinct silhouettes. The reserved channel is mostly respected, with UI chrome in achromatic graphite/white and selection indicated by a white→cyan rim. However, some minor issues: the lab"
