replicas: 1
domain: therobotknows.com
backend:
  image: ops.noizu.com/therobotknows.com/backend:v1.0.5
  port: 4000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
frontend:
  image: ops.noizu.com/therobotknows.com/frontend:v1.0.4
  port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
migrate:
  enabled: true
  command: ["bin/therobotknows", "eval", "Therobotknows.Release.migrate()"]
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
database:
  host: shared-postgres.data-ns.svc.cluster.local
  port: 5432
  name: therobotknows
redis:
  host: shared-redis.data-ns.svc.cluster.local
  port: 6379
  db: 9
secrets:
  name: therobotknows-secrets
  keys:
    dbUser: THEROBOTKNOWS_DB_USER
    dbPassword: THEROBOTKNOWS_DB_PASSWORD
    secretKeyBase: THEROBOTKNOWS_SECRET_KEY_BASE
    guardianSecretKey: THEROBOTKNOWS_GUARDIAN_SECRET_KEY
    redisUrl: THEROBOTKNOWS_REDIS_URL
    databaseUrl: THEROBOTKNOWS_DATABASE_URL
    sendgridApiKey: ""
    oidcClientId: ""
    oidcClientSecret: ""
    googleClientId: ""
    googleClientSecret: ""
    facebookClientId: ""
    facebookClientSecret: ""
    githubClientId: ""
    githubClientSecret: ""
    linkedinClientId: ""
    linkedinClientSecret: ""
    samlSpCert: ""
    samlSpKey: ""
  infisical:
    enabled: true
    hostAPI: https://infisical.noizu.com/api
    resyncInterval: 120
    credentialsSecret: universal-auth-credentials
    credentialsNamespace: infra
    projectSlug: k8-infra
    envSlug: prod
    secretsPath: "/apps/therobotknows"
mail:
  fromName: ""
  fromAddress: "noreply@therobotknows.com"
sso:
  requireInvite: false
  oidc:
    issuer: ""
  saml:
    idpMetadataUrl: ""
    spEntityId: ""
extraEnv: []
configMap:
  enabled: false
  data: {}
imagePullSecrets:
  - name: ops-registry-secret
analytics:
  ga:
    measurementId: ""
  posthog:
    key: ""
    host: "https://us.i.posthog.com"
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  cloudflareOnly: true
tls:
  enabled: true
  secretName: therobotknows-com-tls
  infisical:
    enabled: true
    resyncInterval: 300
    hostAPI: https://infisical.noizu.com/api
    credentialsSecret: universal-auth-credentials
    credentialsNamespace: infra
    projectSlug: k8-infra
    envSlug: prod
    secretsPath: "/apps/tls/therobotknows"
    crtKey: THEROBOTKNOWS_TLS_CRT
    keyKey: THEROBOTKNOWS_TLS_KEY
otel:
  enabled: false
  collectorEndpoint: "otel-collector.observability-ns.svc.cluster.local:4317"
  collectorHttpEndpoint: "http://otel-collector.observability-ns.svc.cluster.local:4318"
  serviceName: "therobotknows"
storage:
  enabled: false
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
podDisruptionBudget:
  enabled: false
  minAvailable: 1
sandbox:
  enabled: false
