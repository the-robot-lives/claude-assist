databaseChangeLog:
  - changeSet:
      id: 030-create-table-entries
      author: therobotknows
      changes:
        - sql:
            sql: |
              CREATE TABLE entries (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                universe_id uuid NOT NULL REFERENCES universes(id) ON DELETE CASCADE,
                type varchar(32) NOT NULL
                  CHECK (type IN ('character', 'location', 'event', 'faction', 'object', 'concept', 'rule')),
                status varchar(20) NOT NULL DEFAULT 'draft'
                  CHECK (status IN ('canon', 'draft', 'generated')),
                title varchar(500) NOT NULL,
                slug citext,
                excerpt text,
                body jsonb NOT NULL DEFAULT '{}',
                era varchar(255),
                region varchar(255),
                metadata jsonb NOT NULL DEFAULT '{}',
                word_count integer NOT NULL DEFAULT 0,
                version integer NOT NULL DEFAULT 1,
                created_by uuid REFERENCES users(id) ON DELETE SET NULL,
                deleted_at timestamptz,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );

              CREATE INDEX idx_entries_universe_active
                ON entries (universe_id, updated_at DESC)
                WHERE deleted_at IS NULL;

              CREATE INDEX idx_entries_universe_type
                ON entries (universe_id, type)
                WHERE deleted_at IS NULL;

              CREATE INDEX idx_entries_universe_status
                ON entries (universe_id, status)
                WHERE deleted_at IS NULL;

              CREATE UNIQUE INDEX uq_entries_universe_slug
                ON entries (universe_id, slug)
                WHERE slug IS NOT NULL AND deleted_at IS NULL;
      rollback:
        - dropTable:
            tableName: entries
