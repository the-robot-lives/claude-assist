databaseChangeLog:
  - changeSet:
      id: 060-entries-tsvector
      author: therobotknows
      changes:
        - sql:
            sql: |
              ALTER TABLE entries
                ADD COLUMN IF NOT EXISTS search_vector tsvector;

              CREATE INDEX IF NOT EXISTS idx_entries_search_vector
                ON entries USING GIN (search_vector);

              CREATE OR REPLACE FUNCTION entries_search_vector_update() RETURNS trigger AS $$
              BEGIN
                NEW.search_vector :=
                  setweight(to_tsvector('english', coalesce(NEW.title, '')), 'A') ||
                  setweight(to_tsvector('english', coalesce(NEW.excerpt, '')), 'B') ||
                  setweight(to_tsvector('english', coalesce(NEW.body::text, '')), 'C');
                RETURN NEW;
              END
              $$ LANGUAGE plpgsql;

              DROP TRIGGER IF EXISTS trg_entries_search_vector ON entries;
              CREATE TRIGGER trg_entries_search_vector
                BEFORE INSERT OR UPDATE OF title, excerpt, body ON entries
                FOR EACH ROW EXECUTE FUNCTION entries_search_vector_update();

              UPDATE entries SET search_vector =
                setweight(to_tsvector('english', coalesce(title, '')), 'A') ||
                setweight(to_tsvector('english', coalesce(excerpt, '')), 'B') ||
                setweight(to_tsvector('english', coalesce(body::text, '')), 'C')
              WHERE search_vector IS NULL;
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_entries_search_vector ON entries;
              DROP FUNCTION IF EXISTS entries_search_vector_update();
              DROP INDEX IF EXISTS idx_entries_search_vector;
              ALTER TABLE entries DROP COLUMN IF EXISTS search_vector;
