databaseChangeLog:
  - changeSet:
      id: 085-universe-invites
      author: therobotknows
      changes:
        - sql:
            sql: |
              CREATE TABLE universe_invites (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                universe_id uuid NOT NULL REFERENCES universes(id) ON DELETE CASCADE,
                email citext NOT NULL,
                role varchar(20) NOT NULL DEFAULT 'editor'
                  CHECK (role IN ('owner', 'editor', 'viewer')),
                token varchar(64) NOT NULL,
                invited_by uuid REFERENCES users(id) ON DELETE SET NULL,
                accepted_at timestamptz,
                revoked_at timestamptz,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT uq_universe_invites_token UNIQUE (token)
              );

              CREATE INDEX idx_universe_invites_universe ON universe_invites (universe_id);

              ALTER TABLE universes
                ADD COLUMN IF NOT EXISTS public_read boolean NOT NULL DEFAULT false;
      rollback:
        - sql:
            sql: |
              ALTER TABLE universes DROP COLUMN IF EXISTS public_read;
              DROP TABLE IF EXISTS universe_invites;
