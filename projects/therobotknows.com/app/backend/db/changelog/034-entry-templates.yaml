databaseChangeLog:
  - changeSet:
      id: 034-create-table-entry-templates
      author: therobotknows
      changes:
        - sql:
            sql: |
              CREATE TABLE entry_templates (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                type varchar(32) NOT NULL
                  CHECK (type IN ('character', 'location', 'event', 'faction', 'object', 'concept', 'rule')),
                name varchar(100) NOT NULL,
                fields jsonb NOT NULL DEFAULT '[]',
                body_skeleton text NOT NULL DEFAULT '',
                inserted_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT uq_entry_templates_type UNIQUE (type)
              );
      rollback:
        - dropTable:
            tableName: entry_templates
