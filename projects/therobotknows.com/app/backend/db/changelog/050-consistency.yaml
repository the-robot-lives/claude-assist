databaseChangeLog:
  - changeSet:
      id: 050-create-consistency-issues
      author: therobotknows
      changes:
        - sql:
            sql: |
              CREATE TABLE consistency_issues (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                universe_id uuid NOT NULL REFERENCES universes(id) ON DELETE CASCADE,
                severity varchar(20) NOT NULL
                  CHECK (severity IN ('error', 'warning', 'suggestion')),
                kind varchar(64) NOT NULL,
                title varchar(500) NOT NULL,
                detail text NOT NULL DEFAULT '',
                entry_ids uuid[] NOT NULL DEFAULT '{}',
                status varchar(20) NOT NULL DEFAULT 'open'
                  CHECK (status IN ('open', 'resolved', 'dismissed')),
                resolution jsonb,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );

              CREATE INDEX idx_consistency_issues_universe
                ON consistency_issues (universe_id, status, severity);

              CREATE TABLE consistency_check_runs (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                universe_id uuid NOT NULL REFERENCES universes(id) ON DELETE CASCADE,
                status varchar(20) NOT NULL DEFAULT 'complete',
                issues_found integer NOT NULL DEFAULT 0,
                triggered_by uuid REFERENCES users(id) ON DELETE SET NULL,
                inserted_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - sql:
            sql: |
              DROP TABLE IF EXISTS consistency_check_runs;
              DROP TABLE IF EXISTS consistency_issues;
