databaseChangeLog:
  - changeSet:
      id: 040-create-generations
      author: therobotknows
      changes:
        - sql:
            sql: |
              CREATE TABLE generations (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                universe_id uuid NOT NULL REFERENCES universes(id) ON DELETE CASCADE,
                prompt text NOT NULL,
                entry_type varchar(32) NOT NULL
                  CHECK (entry_type IN ('character', 'location', 'event', 'faction', 'object', 'concept', 'rule')),
                status varchar(20) NOT NULL DEFAULT 'pending'
                  CHECK (status IN ('pending', 'running', 'complete', 'failed', 'promoted', 'discarded')),
                params jsonb NOT NULL DEFAULT '{}',
                output_title varchar(500),
                output_body jsonb,
                output_entry_id uuid REFERENCES entries(id) ON DELETE SET NULL,
                source_entry_ids uuid[] NOT NULL DEFAULT '{}',
                citations jsonb NOT NULL DEFAULT '[]',
                error_message text,
                token_usage jsonb NOT NULL DEFAULT '{}',
                cost_cents integer,
                created_by uuid REFERENCES users(id) ON DELETE SET NULL,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );

              CREATE INDEX idx_generations_universe ON generations (universe_id, inserted_at DESC);
              CREATE INDEX idx_generations_status ON generations (universe_id, status);
      rollback:
        - dropTable:
            tableName: generations
