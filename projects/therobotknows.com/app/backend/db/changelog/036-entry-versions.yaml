databaseChangeLog:
  - changeSet:
      id: 036-create-table-entry-versions
      author: therobotknows
      changes:
        - sql:
            sql: |
              CREATE TABLE entry_versions (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                entry_id uuid NOT NULL REFERENCES entries(id) ON DELETE CASCADE,
                version integer NOT NULL,
                snapshot jsonb NOT NULL DEFAULT '{}',
                created_by uuid REFERENCES users(id) ON DELETE SET NULL,
                reason varchar(64) NOT NULL DEFAULT 'update',
                inserted_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT uq_entry_versions_entry_version UNIQUE (entry_id, version)
              );

              CREATE INDEX idx_entry_versions_entry
                ON entry_versions (entry_id, version DESC);
      rollback:
        - dropTable:
            tableName: entry_versions
