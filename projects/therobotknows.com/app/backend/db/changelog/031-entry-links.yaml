databaseChangeLog:
  - changeSet:
      id: 031-create-table-entry-links
      author: therobotknows
      changes:
        - sql:
            sql: |
              CREATE TABLE entry_links (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                universe_id uuid NOT NULL REFERENCES universes(id) ON DELETE CASCADE,
                source_entry_id uuid NOT NULL REFERENCES entries(id) ON DELETE CASCADE,
                target_entry_id uuid NOT NULL REFERENCES entries(id) ON DELETE CASCADE,
                relationship varchar(255) NOT NULL,
                excerpt text,
                created_by uuid REFERENCES users(id) ON DELETE SET NULL,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT chk_entry_links_not_self CHECK (source_entry_id <> target_entry_id)
              );

              CREATE INDEX idx_entry_links_universe
                ON entry_links (universe_id);

              CREATE INDEX idx_entry_links_source
                ON entry_links (source_entry_id);

              CREATE INDEX idx_entry_links_target
                ON entry_links (target_entry_id);

              CREATE UNIQUE INDEX uq_entry_links_triple
                ON entry_links (source_entry_id, target_entry_id, relationship);
      rollback:
        - dropTable:
            tableName: entry_links
