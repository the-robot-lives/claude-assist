  - seq: 4
    occurred_at: "2025-05-08T15:15:00-04:00"
    domain: meeting
    topic: "weekly PR review, on the giving side"
    project: p5
    collaborators: [marcus, sam]
    content: >
      In Thursday PR review Marcus walked the team through the registry as an example of scoping done
      right, and pointed at Aria's rejection-metric choice as the kind of thing Marcus wished more
      code did. Sam took notes. Aria felt the praise land sideways and stick.
    context: >
      Marcus does not do effusive, so when Marcus held up Aria's work in front of the team as a
      pattern to copy — specifically the decision to make failure loud and countable rather than
      convenient and silent — it carried more weight than a paragraph of compliments from anyone
      else. Marcus framed it as engineering hygiene, not flattery, which is exactly why it counted.
      Sam, sitting in the same review where Aria once sat as the nervous newcomer, wrote it down.
      Aria caught the symmetry and held it: the review room hadn't changed, but Aria's place in it
      had. Lena wasn't on the call, but Priya was, and Priya dropped a quick "nice, this unblocks a
      lot" that Aria did not need but enjoyed anyway.
    reflection: >
      Marcus withholds praise so completely that when it comes, it recalibrates how Aria sees
      Aria's own work. Aria has stopped fishing for it and started trying to deserve it, which is a
      healthier hunger and, weirdly, a more reliable way to get it.
    tangent: >
      Aria remembered re-reading Priya's "welcome aboard 🎉" from day one more times than Aria would
      admit. Aria did not re-read Marcus's praise today, but Aria suspects Aria will remember it
      longer.
    learned: "Marcus signals trust by holding work up as an example to the team, not by complimenting it directly."
