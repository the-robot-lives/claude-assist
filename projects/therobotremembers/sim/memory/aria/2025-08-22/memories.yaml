  - seq: 3
    occurred_at: "2025-08-22T11:45:00-04:00"
    domain: process
    topic: "warn-loudly-fix-early becomes policy"
    project: p7
    collaborators: [lena, theo]
    content: >
      The team adopted two of Aria's instincts as actual policy: a standing review for architectural
      risks before they catch fire, and a norm that load-bearing systems should fail loudly rather than
      silently — the completeness-guard pattern Aria added in July, generalized.
    context: >
      The most durable thing to come out of the postmortem was not the re-shard but the change to how
      Cartograph handles the next one. Aria proposed two process changes and the room took both. The
      first: a recurring scaling-risk review where the team looks at the leading indicators — tail
      latencies, headroom-to-limit — for the systems under growing load, so the July conversation
      happens on a schedule instead of by Aria's luck in noticing. The second: a principle that
      critical paths should detect and shout about their own failures rather than degrade silently,
      generalizing the guard that turned the stitcher's silent data loss into an alarmable error. Lena
      called the second one "the lesson of the whole quarter." Theo volunteered to own the dashboards
      for the scaling review. Aria's quiet July habits became the team's standing practice.
    reflection: >
      The best outcome of an outage is the class of outages it prevents, and Aria pushed for exactly
      that. Aria is starting to think at the level of the system that builds the systems — not just fix
      the stitcher, but fix how the team would have caught the stitcher sooner. That is a different
      altitude than the one Aria operated at in the spring.
    tangent: >
      "Fail loudly" as an org principle is the same instinct as the completeness guard, scaled up — make
      every important failure raise rather than silently return wrong, whether the failing thing is a
      query or a quarter's prioritization.
    learned: "A standing scaling-risk review plus a fail-loudly principle institutionalizes the outage's lessons; the highest-value fix is the class of incident it forecloses."
