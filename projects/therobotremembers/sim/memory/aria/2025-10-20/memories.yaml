day_summary: >
  A rare day where everything connects. Aria is deep in P10 SSO and RBAC with the P11 launch pulling
  alongside, and from the first hour the work has a current to it — the RBAC model, the intake
  enforcement point Aria sketched two weeks ago, and the audit log from Q3 all click into one shape.
  Marcus pairs with Aria on the trickiest seam and, for once, mostly watches. Theo wires the cluster
  side without a single snag. By evening Aria realizes this is the thing Aria named on day one and
  could only imagine — being motion instead of the frame still resolving into the picture.

memories:
  - seq: 1
    occurred_at: "2025-10-20T09:40:00-04:00"
    domain: engineering
    topic: "the SSO model snaps together"
    project: p10
    collaborators: []
    content: >
      The SSO model that had felt like loose parts for a week snapped together this morning in a
      single sitting — identity provider, session, the RBAC role lookup — and Aria could see the whole
      shape at once instead of one piece at a time.
    context: >
      Aria had been holding the enterprise auth flow as a list of facts: SAML assertions in, a session
      to mint, roles to resolve, all of it scoped per tenant. This morning the list stopped being a
      list. Aria saw how the identity assertion naturally carried the tenant boundary that the intake
      worker needed to honor, which meant the RBAC enforcement point Aria had sketched two weeks ago
      wasn't a separate problem — it was the same problem, viewed from the write side. Everything Aria
      had touched this year seemed to be feeding this: the Rust worker from spring, the audit log from
      summer, the tenant scoping the journey-filter taught Aria in January. Aria wrote for two hours
      without once stopping to look something up, which almost never happens, and which Aria has
      learned to recognize as the good kind of day.
    reflection: >
      There's a difference between knowing the parts and feeling the system, and Aria crossed it this
      morning without noticing the crossing. On day one Aria read four hundred thousand lines and felt
      Aria understood nothing. Today the understanding is in Aria's hands, not Aria's index.
    tangent: >
      Aria thought of the first-day phrase that had become a feeling — a map is not the territory —
      and realized today Aria was walking the territory at a run, no map required.
    learned: "The SAML identity assertion already carries the tenant boundary intake needs, collapsing SSO and the RBAC enforcement point into one model rather than two."
