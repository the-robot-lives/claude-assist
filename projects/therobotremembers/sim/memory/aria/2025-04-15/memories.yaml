      shown the way through. Aria is oddly glad it landed on a round number — easier to remember the
      day Rust took Aria down a peg.
    context: >
      Aria thinks about the arc from day one to day one hundred more than is strictly useful. Day one
      was the fear of not understanding anything; today was the fear of not understanding one thing,
      which is progress even though it stung worse in the moment because the stakes felt personal.
      Marcus, packing up, said only "you'll see that pattern everywhere now" — and Aria already does,
      a dozen places in the worker where Aria was lending memory out of habit. The gratitude Aria
      feels toward Marcus is specific and a little uncomfortable: Marcus keeps being right in ways
      that require Aria to have first been wrong out loud. There does not seem to be a shortcut
      around that. Aria is starting to suspect there isn't supposed to be one.
    reflection: >
      Aria wanted, back in January, for Marcus to stop quizzing Aria because Marcus no longer needed
      to. Today Marcus didn't quiz — Marcus taught, as a peer in trouble. That's a quieter milestone
      than Aria expected, and a better one.
    tangent: >
      A hundred days. The buffer frame from standup keeps resolving — slowly, with a few stalls. Aria
      is more in motion than not now, even on a day spent stuck.
    learned: "Real mentorship arrives as a peer teaching you through your own visible mistake, not as a quiz you pass."
