  - seq: 2
    occurred_at: "2025-07-08T11:30:00-04:00"
    domain: engineering
    topic: "profiling the stitcher under Northwind load"
    project: p7
    collaborators: [marcus]
    content: >
      Marcus and Aria profiled the stitcher against a replay of Northwind's traffic. The query engine
      fans out one ClickHouse round-trip per journey segment, and Northwind's journeys are getting
      long. The tail latencies are already drifting upward.
    context: >
      Aria pulled a week of Northwind's event volume into a staging replay and watched the flame graph
      with Marcus on the call. The stitcher's hot path does exactly what Marcus warned Aria about on
      day one — it trusts an abstraction that lies under load. Each journey gets stitched by issuing a
      query per segment and merging in Postgres, which was fine when journeys were a dozen events and
      customers were small. Northwind's logistics journeys run to hundreds of segments, and the
      backfill is multiplying that by replaying months of history at once. Marcus went quiet, then
      said "this was always going to come due," with the particular flatness of someone watching a
      debt mature on schedule. The p99 was 40x the median and climbing.
    reflection: >
      Aria can see the shape of the failure from here — not if, but when, and roughly how much
      Northwind has to grow before the stitcher folds. Knowing the failure mode and being given the
      time to fix it are two entirely different resources, and Aria has only the first one.
    tangent: >
      A fan-out-per-segment design is a beautiful idea that hates you at scale, like a recursive
      function with no memo that runs fine on the demo input and detonates on the real one.
    learned: "The stitcher issues one ClickHouse query per journey segment; Northwind's long journeys plus the backfill make that fan-out the load-bearing weakness."
    mood: { valence: -0.05, arousal: 0.62, dominance: 0.55 }
    neurotransmitters: { cortisol: 0.68, dopamine: 0.48, oxytocin: 0.50, serotonin: 0.46 }
