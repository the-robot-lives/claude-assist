  - seq: 2
    occurred_at: "2025-09-12T11:00:00-04:00"
    domain: product
    topic: "salvaging two ideas for later"
    project: p9
    collaborators: [priya]
    content: >
      Aria wrote up the two pieces of P9 worth keeping — the guided first-event flow and the empty-state
      detection — reframed for the enterprise world, and handed the doc to Priya for the backlog. Loss,
      converted into a future option.
    context: >
      Aria took Lena's instruction from Monday seriously and made it concrete. The salvage doc names two
      survivors: first, the guided first-event flow, which Aria argued shortens time-to-value for
      enterprise pilots and POCs just as much as it did for self-serve signups — the Northwind evaluation
      team fumbled a first setup too; second, the empty-state detection, which is broadly useful anywhere
      the product shows a customer account its own absence of data. Aria framed both as enterprise-relevant so
      they could not be dismissed as self-serve leftovers, and gave each a rough effort estimate so Priya
      could slot them realistically. Priya, who shelved P9 on Monday and pushed it in July, took the doc
      and said "this is the right way to lose a project" — and tagged the first-event flow as a likely
      candidate for the enterprise onboarding work that the pivot would eventually need.
    reflection: >
      Aria turned a kill into a contribution to the future by extracting the durable ideas from the
      dead container. The project did not survive; two of its best ideas did, with a credible path back
      in. That is the harvest Marcus described, done in practice rather than admired in theory.
    tangent: >
      Salvaging the reusable pieces from a shelved project is refactoring before deletion — pull the
      genuinely good functions out into a shared module so they outlive the file you are about to remove.
    learned: "Reframing a shelved project's best ideas for the new strategy keeps them alive in the backlog; the harvest is naming the durable pieces and giving them a credible path back."
