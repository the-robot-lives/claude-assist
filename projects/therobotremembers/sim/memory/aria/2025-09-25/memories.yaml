  - seq: 2
    occurred_at: "2025-09-25T11:15:00-04:00"
    domain: engineering
    topic: "scoping SSO with clear sight"
    project: p10
    collaborators: [marcus]
    content: >
      Aria scoped the SSO half with Marcus and barely needed Marcus to amend it. Aria laid out SAML and
      OIDC support, just-in-time provisioning, and the migration path for existing accounts, and flagged
      the genuinely hard part unprompted: reconciling federated identities with Cartograph's current
      user model without breaking anyone.
    context: >
      Aria had done the reading and it showed. The plan Aria put up handled the obvious axes — support
      both SAML for the legacy enterprise buyers and OIDC for the modern ones, provision users
      just-in-time on first login, give admins a way to map identity-provider groups to Cartograph
      roles. But the part Aria led with was the part that bites: Cartograph's existing accounts were
      created before any of this existed, so the hard problem is the migration — linking a federated
      identity to an account that already has data and history without duplicating users or orphaning
      anyone. Marcus listened to the whole thing, found exactly one gap Aria had missed (session
      invalidation when a provider revokes access mid-session — the kind of edge case Marcus always
      sees), and otherwise said "yeah, that's the plan." A year ago Marcus would have rewritten Aria's
      scope. Today Marcus added a footnote.
    reflection: >
      Aria flagged the hard part of SSO before Marcus had to point at it — the account migration, not
      the protocol support — which is exactly the kind of seeing-around-corners Aria could not do in the
      spring. The protocols are the easy part; the migration is where the bodies are buried, and Aria
      knew to look there first.
    tangent: >
      Everyone scopes SSO as "add SAML and OIDC" and gets ambushed by the account-linking migration —
      the integration is the demo, the migration is the project, the same way the rewrite is the demo
      and the cutover is the danger.
    learned: "The hard part of enterprise SSO is migrating existing accounts to federated identity without duplication, not the protocol support; Marcus's catch was mid-session provider-revocation invalidation."
    mood: { valence: 0.45, arousal: 0.55, dominance: 0.66 }
