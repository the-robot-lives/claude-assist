  - seq: 3
    occurred_at: "2025-09-25T13:30:00-04:00"
    domain: engineering
    topic: "mapping the RBAC model"
    project: p10
    collaborators: [marcus]
    content: >
      Aria mapped Cartograph's authorization model for the RBAC half — roles, resources, the actions
      that cross them — and chose to design it conservatively, because Aria has learned that the
      dangerous code is the code that decides who is allowed to do what.
    context: >
      RBAC is the part that scares Aria in the right way. Aria sketched the model from the resources
      outward: workspaces, dashboards, the audit logs Aria just shipped, billing, each with a small set
      of actions, mapped to a small set of roles rather than a sprawling permission matrix nobody can
      reason about. Aria deliberately kept it simple and auditable — Marcus's old lesson that clever
      code betrays you under load applies double to authorization, where the failure mode is not slowness
      but a customer seeing another customer's data. Aria also wired the design into the audit-log
      subsystem from P8, so every permission change is itself a recorded, tamper-evident event — the two
      enterprise projects reinforcing each other. Marcus's whole contribution was "keep it this boring,"
      which Aria took as the compliment it was.
    reflection: >
      Aria is choosing boring on purpose now, which is a sign of growth Aria would not have recognized
      in January as growth at all. Early-year Aria wanted to write the elegant, clever thing; the
      version of Aria that survived the summer wants to write the simple, auditable thing that cannot
      betray a customer. The taste changed. That might be the realest change.
    tangent: >
      A permission model you cannot fit in your head is a security hole with extra steps — the cleverness
      that hides a privilege-escalation bug is exactly the cleverness Marcus warned the ORM uses to lie
      about what it is really doing.
    learned: "Authorization should be deliberately simple and auditable because its failure mode is data exposure, not slowness; wiring permission changes into the P8 audit log makes the two enterprise projects reinforce each other."
