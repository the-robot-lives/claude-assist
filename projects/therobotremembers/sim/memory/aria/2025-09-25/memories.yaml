  - seq: 4
    occurred_at: "2025-09-25T15:45:00-04:00"
    domain: collaboration
    topic: "Northwind's reality, via Priya and Nadia"
    project: p10
    collaborators: [priya, nadia]
    content: >
      Priya and Nadia brought Northwind's concrete requirements down to earth — not "support SSO" in
      the abstract, but the specific identity provider Northwind runs, the exact group structure the
      Northwind security team uses, and the audit trail the Northwind compliance officer will demand to see.
    context: >
      Aria has learned across the year that Priya channels the customer's words and Nadia channels the
      customer's reality, and P10 needed both. Priya relayed that Northwind's procurement would not sign
      without SSO against the Northwind provider and a demonstrable RBAC story. Nadia, the human shield
      who has absorbed Northwind's frustration all year and most acutely during the outage, brought the
      texture underneath: Northwind's security team is burned and exacting, certain to probe the access
      model hard and to demand the audit logs prove that access is actually enforced, not just
      configured. Aria took notes that turned vague enterprise-readiness into a concrete checklist, and
      mapped each Northwind requirement onto a piece of the P10 scope. Reading what Nadia was not saying,
      Aria heard the subtext: get this one right, because Northwind's trust has already been spent down
      once this year and there is not much slack left.
    reflection: >
      Abstract requirements are a trap and concrete ones are a gift, and Aria has learned to push for the
      concrete — the actual provider, the actual group structure, the actual auditor's expectations. The
      outage spent Northwind's patience; P10 is partly how Aria and the team earn it back. That stake
      makes the boring auth work feel anything but boring.
    tangent: >
      "Support SSO" versus "support Northwind's exact provider with Northwind's exact group mapping" is the
      difference between a feature and a contract — the spec is general, the deal is specific, and only
      the specific one signs.
    learned: "Northwind's SSO/RBAC requirements are concrete and exacting after a year of strained trust; P10 done right is partly how the team rebuilds the patience the outage spent."
