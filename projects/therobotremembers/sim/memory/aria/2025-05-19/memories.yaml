  - seq: 2
    occurred_at: "2025-05-19T10:30:00-04:00"
    domain: incident
    topic: "stop the bleeding, find the floor"
    project: p4
    collaborators: [theo, marcus]
    content: >
      First hour of the war room: stop the loss, then find out how far down it went. Theo killed the
      blind retries that were starving Postgres; Marcus joined the bridge and forced the question
      nobody wanted to ask out loud — how many events, exactly, are gone.
    context: >
      Aria and Theo worked the live worker in tandem, Theo on the cluster and connection pool, Aria
      tracing the code path to the precise spot where malformed-under-load events were being logged
      and discarded. The trigger turned out to be a burst from one customer's overnight backfill that
      tipped the worker into the starvation state, after which it shed load by silently dropping
      anything it couldn't immediately parse. Marcus came onto the bridge calm and merciless about
      scope: not "whose fault," but "what is the blast radius, in events and in hours." Aria found
      the bottom of the drop window — a little over five hours, one customer hit hardest, the
      throughput line a flat dead floor across the worst of the night. Naming the number made the
      panic worse and the work clearer at the same time.
    reflection: >
      Marcus's refusal to ask "whose fault" in the moment was a gift Aria didn't expect — it kept
      the room pointed at the events instead of at Aria. Aria noticed Aria bracing for blame and
      being handed a job instead. That is a kind of leadership Aria wants to be able to do someday.
    tangent: >
      The starvation-then-shed pattern was the exact thing Theo walked Aria through on April 2nd from
      six months of pager history. The folklore was not folklore. It was a forecast.
    learned: "In the first hour, stop the bleeding and quantify the blast radius in concrete units before touching root cause or blame."
    mood: { valence: -0.50, arousal: 0.92, dominance: 0.38 }
    neurotransmitters: { cortisol: 0.90, dopamine: 0.34, oxytocin: 0.55, serotonin: 0.28 }
