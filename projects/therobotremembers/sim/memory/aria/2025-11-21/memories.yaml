  - seq: 2
    occurred_at: "2025-11-21T11:30:00-05:00"
    domain: engineering
    topic: "inheriting the design system"
    project: p11
    collaborators: [dana, sam]
    content: >
      Dana walked Aria and Sam through the design system one last time — the component library, the
      rationale behind the patterns, the small decisions that aren't written down anywhere — and Aria
      understood that what Dana was really handing over was a way of thinking, not a set of files.
    context: >
      The files were always there; the reasons were in Dana's head, the way the migrations' reasons
      had been in Marcus's on Aria's first day. Dana spent the hour making the tacit explicit: why the
      empty states matter more than the populated ones, why the error copy is written for a frustrated
      person and not a calm one, why a confusing button is a bug even when the code is perfect. Dana
      aimed most of it at Sam, who will carry the dashboard now, but Aria caught all of it, because
      Aria has learned that this is exactly the knowledge that vanishes when a person leaves. Aria
      asked Dana the questions Aria would not be able to ask next week — the ones that only Dana could
      answer — and wrote the answers into the component docs so the next newcomer would not have to
      reconstruct Dana from git blame.
    reflection: >
      The hardest part of someone leaving is that the undocumented reasons walk out the door too, and Aria
      spent the year learning how much of any system lives only in people. Capturing Dana's reasoning
      before it walked out the door was the most useful grief Aria could perform. Aria preserved what
      Aria could.
    tangent: >
      Aria thought of the first day's lesson — that the repo's real knowledge is tacit, held by the
      team rather than the code — and felt it from the painful side now, watching a head full of
      reasons prepare to leave the building.
    learned: "Dana's design knowledge — empty states, error tone, the button-as-bug principle — lived mostly tacitly; capturing it into the docs before departure is how a team keeps what a person knew."
    mood: { valence: -0.05, arousal: 0.44, dominance: 0.60 }
