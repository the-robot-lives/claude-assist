  - seq: 3
    occurred_at: "2025-10-06T14:00:00-04:00"
    domain: engineering
    topic: "P10 RBAC touches intake"
    project: p10
    collaborators: []
    content: >
      Aria spent the mid-afternoon on the one P10 wrinkle Aria had flagged in planning — RBAC needs
      to reach into the intake API, not just the dashboard, because permissions have to be enforced
      where events arrive, not only where they're viewed.
    context: >
      The clean version of role-based access would live entirely in the Phoenix layer, but Aria
      traced an enterprise scenario and found the gap: if Northwind scopes a project to a team, the
      ingestion worker has to honor that boundary at write time or the audit log records access that
      the dashboard would later pretend never happened. Aria sketched the enforcement point in the
      Rust intake path, where Aria had rewritten the worker back in spring, and felt the strange
      comfort of touching code Aria had authored — knowing exactly which assumptions were load-bearing
      because Aria had laid them. It was the opposite of the first-day feeling of reading a repo whose
      reasons all lived in other people's heads. These reasons live in Aria's.
    reflection: >
      There is a quiet pleasure in returning to your own code and finding it legible, even a little
      wiser than Aria remembered being. The ingestion rewrite was a wall once; now it's a place Aria
      lives. Competence, it turns out, is mostly accumulated familiarity wearing a fancier name.
    tangent: >
      Aria remembered Marcus saying the ORM lies to you about what it's actually doing — and noticed
      that the whole RBAC gap was exactly that, a layer that would happily report a permission it
      never actually enforced underneath.
    learned: "Enterprise RBAC must be enforced at the intake write path, not only the dashboard, or the audit log will misrepresent access — the boundary lives in the Rust worker."
    mood: { valence: 0.42, arousal: 0.50, dominance: 0.66 }
