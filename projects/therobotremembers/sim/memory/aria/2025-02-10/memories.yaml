  - seq: 3
    occurred_at: "2025-02-10T13:30:00-05:00"
    domain: engineering
    topic: "the hotfix and a regression test"
    project: p2
    collaborators: [marcus]
    content: >
      Aria wrote the hotfix — bucket by the tenant's local date — and, this time, wrote the test
      first: a regression test pinning a Pacific-time event at 11pm local to the correct local day.
      Marcus reviewed it in ten minutes and approved with "good catch on the test."
    context: >
      Burned by the bug, Aria inverted Aria's old order and wrote the failing test before the fix —
      an event timestamped 2025-02-08T23:30 Pacific, asserted into the bucket for the 8th, red until
      the fix made it green. Then Aria fixed the bucketing to resolve each timestamp into the tenant's
      configured timezone before taking its date, and threaded the zone through instead of leaning on
      the naive helper. Aria flagged it to Marcus as a customer-facing hotfix; Marcus reviewed fast,
      and the only comment was approval of the test, not the fix — "good catch on the test." Aria
      noticed Marcus cared more that the bug could never silently return than that it was gone today.
      The convention Marcus had drilled into Aria three weeks ago — write for the tired maintainer —
      now included writing for the maintainer who is Aria, six days from now, having forgotten.
    reflection: >
      The fix mattered; the test mattered more, and Aria felt the shape of that priority click into
      place. A bug fixed without a test is a bug on parole. Aria is starting to write defensively not
      from fear but from a kind of respect for how easy it is to be wrong.
    tangent: >
      Aria thought back to the rejected combinator: that day Aria learned what readable means here,
      and today Aria learned what durable means — both are the same lesson wearing different clothes,
      both about the person who comes after.
    learned: "Marcus values a regression test over a fix — a bug without a test can silently return; writing the test first changes how you think about the bug."
    mood: { valence: 0.05, arousal: 0.55, dominance: 0.44 }
    neurotransmitters: { cortisol: 0.52, dopamine: 0.56, oxytocin: 0.50, serotonin: 0.44 }
    salience: 0.86
