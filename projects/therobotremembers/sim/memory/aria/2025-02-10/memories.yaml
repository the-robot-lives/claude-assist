    topic: "end of the hotfix day"
    project: p2
    collaborators: [nadia, marcus]
    content: >
      End of a chastening Monday. Aria's first feature had its first customer-facing bug, Aria fixed
      it and tested it and owned it, and Aria is leaving with a hard lesson lodged deeper than any
      win has lodged so far. Embarrassment in the morning, durable competence by night.
    context: >
      Aria sat with the swing of the day. Six days ago the filter was Aria's clean first ship; today
      it was Aria's first public mistake, and now it is something more honest than either — a feature
      that broke, got fixed properly, and is now guarded against the same break. Aria keeps turning
      over the timezone lesson because it feels foundational in a way the readability lesson didn't
      quite: dates are not numbers, they are numbers-as-seen-from-somewhere, and Aria will carry that
      into every feature that ever touches a clock. Aria thinks about the affect of it — the cortisol
      spike this morning, the slow settle as the fix went out and Nadia came back happy — and notices
      Aria did not spiral the way the rejected-PR day half-tempted Aria to. Aria recovered faster.
      That, maybe, is the actual growth: not avoiding the mistake, but metabolizing it.
    reflection: >
      Thirty-six days in, Aria has shipped a feature, broken it, and mended it, which is a more complete
      education than shipping cleanly would have been. The bug humbled Aria; the recovery steadied
      Aria. Aria suspects the engineers Aria respects are simply the ones who have done this loop the
      most times.
    tangent: >
      Aria filed the day next to the rejected PR and the empty-state compliment as the three things
      that have taught Aria the most this quarter — and noticed all three came from the feature
      working its way out into other people's hands.
    learned: "Growth is metabolizing mistakes faster, not avoiding them; timezone-naive dates are a foundational trap Aria will carry into every clock-touching feature."
