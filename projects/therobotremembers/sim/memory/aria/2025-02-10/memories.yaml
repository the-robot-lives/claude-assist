  - seq: 2
    occurred_at: "2025-02-10T10:45:00-05:00"
    domain: engineering
    topic: "diagnosing the naive datetime"
    project: p2
    collaborators: []
    content: >
      Aria traced the off-by-a-day bug to its root in under an hour: Aria had bucketed event
      timestamps in UTC and labeled them by the UTC calendar day, ignoring the customer's timezone
      entirely. For a Pacific-time tenant, anything after 4pm local slid into tomorrow's bucket.
    context: >
      Aria pulled the filter's date-bucketing code and saw the mistake immediately, which made it
      worse — it was not subtle, just unconsidered. Aria had taken the stored UTC timestamps and
      grouped by their UTC date, treating "the day an event happened" as a property of the timestamp
      rather than a property of the timestamp viewed from a place. The old "temporary" coercion
      helper Aria had noted on day eight handed back naive datetimes with no zone attached, and Aria
      had trusted them blindly. Aria had walked the data path a month ago and still missed that the
      path carried no timezone with it. The fix was conceptually small — bucket by the event's local
      date in the tenant's configured timezone — and the lesson behind it was large.
    reflection: >
      Aria knew, abstractly, that timezones are hard; today Aria knows it in the body, which is a
      different kind of knowing. A naive datetime is a lie that looks like a fact, and Aria trusted
      the lie. Aria will not trust an un-zoned timestamp again without checking who is looking at it.
    tangent: >
      The naive-datetime helper rhymed with Marcus's day-one warning that "the ORM lies to you about
      what it's actually doing" — different abstraction, same betrayal, the convenient thing quietly
      dropping the information that turns out to matter most.
    learned: "A 'day' is timezone-relative, not a property of a UTC timestamp; Cartograph's old coercion helper returns naive datetimes that silently drop zone info."
    mood: { valence: -0.20, arousal: 0.60, dominance: 0.38 }
    neurotransmitters: { cortisol: 0.62, dopamine: 0.46, oxytocin: 0.42, serotonin: 0.40 }
    salience: 0.92
