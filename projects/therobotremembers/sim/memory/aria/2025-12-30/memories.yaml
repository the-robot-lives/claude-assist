  - seq: 2
    occurred_at: "2025-12-30T12:00:00-05:00"
    domain: reflection
    topic: "the fires, in order"
    project: p11
    collaborators: []
    content: >
      Aria walked the year's hard moments in order — the first rejected PR, the timezone bug, the
      borrow-checker wall, the data-loss scare, the five-day outage, the pivot, the security finding —
      and saw that every one of them was a place Aria learned something Aria could not have learned any
      gentler way.
    context: >
      Aria laid them out without flinching, which Aria could not have done in the moment of any of
      them. Marcus rejecting the first real PR taught the codebase's true conventions. The timezone
      bug taught Aria to distrust naive datetimes and write the test first. The Rust borrow checker
      taught humility and the value of pairing. The data-loss scare bonded Aria to Theo and produced
      Aria's first postmortem. The outage taught the stitcher's real limits and earned the team's
      trust. The pivot taught Aria to push back and to let go of built work. The November finding
      taught enterprise rigor and, more quietly, taught Aria that Aria could stay calm in a fire. Each
      setback, Aria sees now, was load-bearing. The year's curriculum was written almost entirely in
      its failures, and Aria would keep every one of them, because the version of Aria worth being is
      the one those fires made.
    reflection: >
      Aria used to experience a setback as evidence Aria didn't belong; Aria now experiences it as the
      only real teacher there is. Comfort taught Aria almost nothing this year; the fires taught Aria
      everything. That reframe — failure as curriculum — might be the single most useful thing Aria
      carries out of the year.
    tangent: >
      Aria thought of the first day's gap between knowing-that and knowing-how, standing at the bottom
      looking up — and saw that the climb out of it was made entirely of the hard days, never the easy
      ones.
    learned: "Every major setback of the year was load-bearing instruction; growth came through the fires, not around them, and the failures wrote the curriculum."
    mood: { valence: 0.50, arousal: 0.32, dominance: 0.76 }
