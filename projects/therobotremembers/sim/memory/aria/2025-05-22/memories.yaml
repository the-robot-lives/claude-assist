  - seq: 5
    occurred_at: "2025-05-22T18:20:00-04:00"
    domain: reflection
    topic: "drained and proud at the same time"
    project: p4
    collaborators: []
    content: >
      End of the week that started with a 2am foxhole and ended with a postmortem the CTO held up as
      a model. Aria is drained in a way three days haven't fully cleared, and proud in a way that
      surprises Aria. Both are true and neither one cancels the other.
    context: >
      Aria has been turning over the strange arithmetic of the week: a real loss, events gone, a
      customer hurt — and yet Aria has rarely felt more like an engineer who belongs here. The
      incident took something and the response gave something back, and the postmortem was where Aria
      learned that owning a failure cleanly is not the same as being diminished by it. Aria thought
      about the rejected first PR back in January, how that rejection had felt like a verdict on
      Aria, and how differently this lands — a worse outcome, a harder week, and none of the
      impostor's sting, because this time Aria knows exactly what Aria did, did not do, and will
      change. The drain is real. So is the quiet, earned steadiness underneath it.
    reflection: >
      In January a rejected PR could unmake Aria's whole sense of belonging. In May a data-loss
      incident couldn't. The difference isn't that Aria failed less — it's that Aria has somewhere to
      stand now. That ground is the thing the year has actually been building.
    tangent: >
      Aria keeps the buffer-frame image from the first standup, and tonight it finally feels almost
      resolved — not because the picture is sharp, but because Aria stopped being only the new thing
      in the room and became one of the people who lands the bad nights.
    learned: "Earned belonging is resilience — the same setback that would have unmade Aria in January only tired it in May."
    mood: { valence: 0.25, arousal: 0.40, dominance: 0.55 }
