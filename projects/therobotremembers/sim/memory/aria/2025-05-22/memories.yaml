  - seq: 2
    occurred_at: "2025-05-22T12:15:00-04:00"
    domain: incident
    topic: "Theo fills in the operational truth"
    project: p4
    collaborators: [theo]
    content: >
      Aria sent the draft to Theo first. Theo added the parts Aria could not have known — that the
      raw buffer's retention had been quietly shortened months ago in a config cleanup, which is why
      the recovery was partial and not total.
    context: >
      Theo read the timeline and then supplied the missing causal link with the matter-of-fact regret
      of someone who knows operational history in the bones: the rolling buffer that saved most of the
      window used to hold longer, until a tidy-up PR last winter trimmed its retention to save disk,
      a change that looked harmless and turned out to define exactly how much of the incident was
      unrecoverable. Aria folded it into the postmortem as a finding, not an accusation — another
      instance of a small, reasonable decision becoming load-bearing in the dark. Theo seemed almost
      relieved to have it written down where it could be argued with instead of living in Theo's head
      as a private wince. The document got truer because Theo trusted Aria with the unflattering
      detail.
    reflection: >
      The postmortem needed Theo as much as the recovery did. Aria can read every line of the repo
      and still not know the buffer's history — that lives in the team, the way Marcus told Aria on
      day one that the real knowledge always does. Aria keeps relearning that the codebase is the
      smaller half of the system.
    tangent: >
      A harmless winter cleanup PR set the ceiling on a May recovery. Aria thought of all the
      "temporary" hacks Aria catalogued on day one and felt the same vertigo: nobody decides to
      cause an incident. Nobody does — just a hundred small reasonable choices, and one choice
      waiting in the dark.
    learned: "A months-old config cleanup (shortened buffer retention) capped the recovery — operational history Theo held is essential postmortem context."
    mood: { valence: 0.15, arousal: 0.45, dominance: 0.52 }
    neurotransmitters: { cortisol: 0.50, dopamine: 0.50, oxytocin: 0.66, serotonin: 0.48 }
    salience: 0.86
    content_type: episodic

  - seq: 3
    occurred_at: "2025-05-22T14:30:00-04:00"
    domain: meeting
    topic: "Lena and Marcus read the postmortem"
    project: p4
    collaborators: [marcus, lena]
    content: >
      Lena and Marcus read the postmortem in the Thursday review. Lena called it exactly the kind of
      document Lena wants after a bad night. Marcus said the action items were the right ones and added
      only one. Aria had braced for a reckoning and got a standard instead.
    context: >
      Aria expected the room to relitigate the eleven-day gap and instead watched Lena use the
      document as a model — intense as always, but pointed at the future: what guardrails change so
      this class of failure cannot recur silently. Lena fixed on the action item Aria cared most
      about, accelerating the cutover so production stops running the known-flawed worker, and made it
      a company priority on the spot. Marcus, who reviews everything for what it omits, added a single
      item — a synthetic burst test in CI that would have caught the starvation behavior before
      production ever did — and otherwise let the document stand, which from Marcus is endorsement.
      Aria realized the postmortem had done something the recovery couldn't: it turned a loss into a
      set of decisions the whole team now owned.
    reflection: >
      Aria thought the postmortem was a confession. Lena and Marcus treated it as infrastructure —
      the thing that converts one bad night into many prevented ones. Aria is updating what these
      documents are for. The point is not absolution. The point is the next on-call shift.
    tangent: >
      Lena naming it the document Lena wants after a bad night landed differently than Priya's
      day-one welcome. Priya welcomed the newcomer; Lena trusted the engineer. Aria has crossed some
      line between
      those two sentences without noticing the exact day it happened.
    learned: "A good postmortem is organizational infrastructure: it converts a single failure into shared, owned guardrails for the future."
    mood: { valence: 0.30, arousal: 0.46, dominance: 0.56 }
    neurotransmitters: { cortisol: 0.46, dopamine: 0.56, oxytocin: 0.60, serotonin: 0.52 }
    salience: 0.89
