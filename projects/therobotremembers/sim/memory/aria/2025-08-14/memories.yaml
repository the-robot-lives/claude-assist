day_index: 221
weekday: Thursday
phase: "Q3 — scaling, the outage, the pivot"
project: p7
day_summary: >
  Day four, and THE OUTAGE ended. Aria and Marcus finished re-sharding the stitcher to stitch by
  journey instead of fanning out per segment, rolled it customer by customer through the morning, and
  watched the dashboards come back green by early afternoon. Theo confirmed the throttle could come
  off and the system held under full Northwind load. The team, forged across four brutal days, let out
  a collective breath. Aria ended the day hollowed out and flooded with an exhausted, disbelieving
  relief.

memories:
  - seq: 1
    occurred_at: "2025-08-14T07:30:00-04:00"
    domain: engineering
    topic: "finishing the re-shard at dawn"
    project: p7
    collaborators: [marcus]
    content: >
      After three days of building it, Aria and Marcus finished the re-shard before most of the company
      was awake — the stitcher now shards by journey, so each worker owns a contiguous slice and batches
      its reads instead of firing one query per segment. The fan-out was finally gone.
    context: >
      The design Aria started in a scratch document in late July became the thing the whole team built
      against for three days. Marcus took the doc seriously the moment Aria surfaced it on day two, said
      "this is the right shape, now let's make it survive contact," and the two of them had been heads-
      down since — Aria writing the journey-sharded stitch path, Marcus hardening the Postgres side and
      catching the edge cases that twenty years of scar tissue let Marcus see and Aria could not. By
      dawn Thursday the round-trips had collapsed from one-per-segment to a handful of batched reads per
      journey, and the staging replay of Northwind's full backfill ran clean for the first time since
      Aria started measuring in July. Marcus looked at the green replay, exhaled, and said "alright."
      From Marcus, after four days, "alright" was practically a fanfare.
    reflection: >
      The lonely, unsanctioned design from July turned out to be the most important thing Aria built all
      summer — not because anyone authorized it, but because it existed when the moment finally demanded
      it. Aria will remember that the next time the room declines to fund a risk Aria can clearly see.
    tangent: >
      Collapsing the fan-out into journey-sharded batches is replacing N+1 queries with a single keyed
      fetch — the oldest lesson in the book, learned this time at the cost of a four-day outage instead
      of a code review comment.
    learned: "Sharding the stitch by journey and batching reads per slice eliminates the per-segment fan-out entirely; the staging replay of Northwind's full backfill finally ran clean."
    mood: { valence: 0.10, arousal: 0.72, dominance: 0.58 }
