databaseChangeLog:
  - changeSet:
      id: 030-create-table-recall-log
      author: trr-memory
      changes:
        - sql:
            splitStatements: false
            sql: |
              -- Plain table for Phase 0. The shared instance is TimescaleDB, so this can be
              -- promoted to a hypertable (SELECT create_hypertable('recall_log','occurred_at'))
              -- in the perf pass; kept plain here for portability / migration safety.
              CREATE TABLE recall_log (
                id                uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                requester_id      text NOT NULL,
                owner_agent       text NOT NULL,
                mode              text NOT NULL,
                query             text,
                total_candidates  integer,
                returned_count    integer,
                hot_index_hit     boolean NOT NULL DEFAULT false,
                duration_ms       integer,
                result_memory_ids uuid[] NOT NULL DEFAULT '{}',
                path_breakdown    jsonb NOT NULL DEFAULT '{}',
                occurred_at       timestamptz NOT NULL DEFAULT now()
              );

              CREATE INDEX idx_recall_log_owner_time ON recall_log (owner_agent, occurred_at DESC);
      rollback:
        - dropTable:
            tableName: recall_log
