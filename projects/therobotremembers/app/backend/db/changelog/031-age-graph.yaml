databaseChangeLog:
  # Apache AGE graph projection of the association graph (Phase A). AGE is a *projection*
  # of `association_edges` — Postgres remains the system of record; the graph is rebuilt
  # from PG at will (see TheRobotRemembers.Memory.GraphMirror.backfill/0). Enabling AGE at
  # runtime is gated by AGE_GRAPH_ENABLED; this changelog only provisions the schema.
  #
  # AGE session rules (why each changeSet re-runs LOAD + SET):
  #   * `LOAD 'age';` loads the extension library into the session.
  #   * ag_catalog must be on search_path for create_graph / create_*label / agtype to resolve.
  #   * These are session-local; Liquibase may run each changeSet on a fresh/re-used session,
  #     so both are set at the top of every AGE changeSet.
  #   * splitStatements:false sends the block as a single multi-statement execute (same pattern
  #     as 025-memory-enums.yaml), so the LOAD/SET take effect for the calls that follow.
  #
  # PRIVILEGES: `CREATE EXTENSION age` is NOT a "trusted" extension — unlike citext/pg_trgm it
  # requires the executing role to be a superuser. 000-extensions.yaml already creates `vector`
  # (also untrusted in most builds) with the same Liquibase role, which implies that role is a
  # superuser (or vector is trusted in this image). If the migration role is only the database
  # owner, this changeSet fails ("permission denied to create extension age"); a DBA must then
  # run `CREATE EXTENSION age;` as a superuser once, out of band — the IF NOT EXISTS below then
  # no-ops on the next migration.

  - changeSet:
      id: 031-create-extension-age
      author: trr-memory
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS age;
      rollback:
        - sql:
            sql: DROP EXTENSION IF EXISTS age;

  # Graph + labels + indexes in one changeSet so a single drop_graph(cascade) is a clean rollback
  # (auto-generated index names make per-index DROPs brittle). AGE creates NO indexes by default,
  # and GIN/expression indexes added *after* a bulk load are ignored (apache/age#1010) — so every
  # index is created here, before any data lands.
  - changeSet:
      id: 031-create-graph
      author: trr-memory
      changes:
        - sql:
            splitStatements: false
            sql: |
              LOAD 'age';
              SET search_path = ag_catalog, "$user", public;

              SELECT create_graph('trr_memory');

              -- Vertex label: one Memory node per `memories` row (keyed by ext_id = memories.id).
              SELECT create_vlabel('trr_memory', 'Memory');

              -- Edge labels: one per association_edges.edge_type (upper-cased; AGE labels are
              -- case-sensitive and the GraphMirror maps :semantic -> "SEMANTIC" etc.).
              SELECT create_elabel('trr_memory', 'SEMANTIC');
              SELECT create_elabel('trr_memory', 'EMOTIONAL');
              SELECT create_elabel('trr_memory', 'TEMPORAL');
              SELECT create_elabel('trr_memory', 'CAUSAL');
              SELECT create_elabel('trr_memory', 'CO_OCCURRENCE');
              SELECT create_elabel('trr_memory', 'SYNTHETIC');
              SELECT create_elabel('trr_memory', 'CONTEXTUAL');
              SELECT create_elabel('trr_memory', 'TANGENT');

              -- ext_id seed index. Only the `WHERE n.ext_id = '...'` match form uses this index;
              -- the `{ext_id:'...'}` property-map form does NOT (apache/age), which is why the
              -- GraphMirror MATCHes vertices with an explicit WHERE clause.
              CREATE INDEX ON trr_memory."Memory"
                USING BTREE (agtype_access_operator(VARIADIC ARRAY[properties, '"ext_id"'::agtype]));

              -- Native graphid index on the vertex (id joins during edge traversal).
              CREATE INDEX ON trr_memory."Memory" USING BTREE (id);

              -- Per edge-label endpoint indexes (start_id/end_id drive both-direction traversal).
              CREATE INDEX ON trr_memory."SEMANTIC"      USING BTREE (start_id);
              CREATE INDEX ON trr_memory."SEMANTIC"      USING BTREE (end_id);
              CREATE INDEX ON trr_memory."EMOTIONAL"     USING BTREE (start_id);
              CREATE INDEX ON trr_memory."EMOTIONAL"     USING BTREE (end_id);
              CREATE INDEX ON trr_memory."TEMPORAL"      USING BTREE (start_id);
              CREATE INDEX ON trr_memory."TEMPORAL"      USING BTREE (end_id);
              CREATE INDEX ON trr_memory."CAUSAL"        USING BTREE (start_id);
              CREATE INDEX ON trr_memory."CAUSAL"        USING BTREE (end_id);
              CREATE INDEX ON trr_memory."CO_OCCURRENCE" USING BTREE (start_id);
              CREATE INDEX ON trr_memory."CO_OCCURRENCE" USING BTREE (end_id);
              CREATE INDEX ON trr_memory."SYNTHETIC"     USING BTREE (start_id);
              CREATE INDEX ON trr_memory."SYNTHETIC"     USING BTREE (end_id);
              CREATE INDEX ON trr_memory."CONTEXTUAL"    USING BTREE (start_id);
              CREATE INDEX ON trr_memory."CONTEXTUAL"    USING BTREE (end_id);
              CREATE INDEX ON trr_memory."TANGENT"       USING BTREE (start_id);
              CREATE INDEX ON trr_memory."TANGENT"       USING BTREE (end_id);
      rollback:
        - sql:
            splitStatements: false
            sql: |
              LOAD 'age';
              SET search_path = ag_catalog, "$user", public;
              SELECT drop_graph('trr_memory', true);
