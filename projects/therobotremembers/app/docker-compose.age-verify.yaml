# Standalone, throwaway Apache AGE verification database — NOT part of the dev or prod stack.
#
# Its own compose project name (trr-age-verify), its own host port (5499), and its own named
# volume mean it cannot disturb the shared dev Postgres reached over lets-go_default. Brought up,
# migrated, exercised, and torn down by scripts/verify-age-stack.sh.
#
# The image is the *production* database image, which ships Apache AGE 1.7.0 alongside pgvector,
# pg_trgm, cube, citext, uuid-ossp and earthdistance — so Liquibase 000-extensions and
# 031-age-graph apply exactly as they do in prod (the AGELESS shared dev/CI Postgres cannot run
# 031, which is the whole reason this override exists).
#
# All coordinates are overridable from the environment (scripts/verify-age-stack.sh sets them):
#   VERIFY_DB_USER / VERIFY_DB_PASSWORD / VERIFY_DB_NAME / VERIFY_DB_PORT
#
# NOTE: VERIFY_DB_NAME is the *physical* database and the Liquibase target. It is named
# "trr_verify_test" on purpose: backend/config/test.exs derives the Ecto database as
# "${DB_NAME}_test", so `mix` is pointed at DB_NAME=trr_verify and lands on this same database.
name: trr-age-verify

services:
  age-verify-db:
    image: docker.io/noizu/timescaledb-ha-with-age:pg17.9-ts2.25.2-all-age1.7.0-r2
    environment:
      POSTGRES_USER: ${VERIFY_DB_USER:-trr_verify}
      POSTGRES_PASSWORD: ${VERIFY_DB_PASSWORD:-trr_verify_pw}
      POSTGRES_DB: ${VERIFY_DB_NAME:-trr_verify_test}
    ports:
      - "${VERIFY_DB_PORT:-5499}:5432"
    volumes:
      # timescaledb-ha stores its cluster under /home/postgres/pgdata (PGDATA=.../pgdata/data).
      # If a future image changes this path the volume simply won't persist — the verify flow is
      # fully idempotent from an empty database, so correctness does not depend on persistence.
      - trr_age_verify_pgdata:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VERIFY_DB_USER:-trr_verify} -d ${VERIFY_DB_NAME:-trr_verify_test}"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: "no"

  # Reuses the repo's canonical Liquibase image (backend/db/Dockerfile): its entrypoint runs
  # `envsubst < liquibase.properties.template > liquibase.properties && liquibase update`, applying
  # db.changelog-master.yaml (000..031) against the JDBC URL built from DB_HOST/DB_PORT/DB_NAME/
  # DB_USER/DB_PASSWORD. DB_PORT is the in-network port (5432), not the host mapping (5499).
  age-verify-migrations:
    build:
      context: ./backend/db
    environment:
      DB_HOST: age-verify-db
      DB_PORT: "5432"
      DB_NAME: ${VERIFY_DB_NAME:-trr_verify_test}
      DB_USER: ${VERIFY_DB_USER:-trr_verify}
      DB_PASSWORD: ${VERIFY_DB_PASSWORD:-trr_verify_pw}
    depends_on:
      age-verify-db:
        condition: service_healthy
    restart: "no"

volumes:
  trr_age_verify_pgdata:
