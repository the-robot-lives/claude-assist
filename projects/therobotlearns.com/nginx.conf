server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /auth/oidc {
    return 302 https://auth.derobot.is/application/launch/therobotlearns/;
  }

  location = /styles.css {
    add_header Cache-Control "public, max-age=60, must-revalidate";
    try_files /styles.css =404;
  }

  location = /app.js {
    add_header Cache-Control "public, max-age=60, must-revalidate";
    try_files /app.js =404;
  }

  location = /login {
    add_header Cache-Control "no-store";
    try_files /index.html =404;
  }

  location = /signup {
    add_header Cache-Control "no-store";
    try_files /index.html =404;
  }

  location /quiz/ {
    try_files $uri $uri/ /quiz/index.html;
  }

  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }
}
