css-snippets:
  - name: Speech Bubble
    slug: speech-bubble
    title: "Comic speech bubble"
    description: "A card styled as a speech bubble with a triangular tail — like a character is explaining the concept."
    target-section: semantic-classes
    body: |
      .card.speech-bubble {
        background: var(--surface);
        border: 3px solid var(--black);
        border-radius: 20px;
        padding: var(--space-3);
        position: relative;
        margin-bottom: var(--space-4);
        font-family: var(--font-sans);
      }
      .card.speech-bubble::after {
        content: '';
        position: absolute;
        bottom: -16px;
        left: 30px;
        width: 0;
        height: 0;
        border: 8px solid transparent;
        border-top: 12px solid var(--black);
      }
      .card.speech-bubble::before {
        content: '';
        position: absolute;
        bottom: -11px;
        left: 32px;
        width: 0;
        height: 0;
        border: 6px solid transparent;
        border-top: 10px solid var(--surface);
        z-index: 1;
      }

  - name: Thought Bubble
    slug: thought-bubble
    title: "Thought bubble callout"
    description: "A cloud-shaped thought bubble with trailing dots — for 'hmm, think about this' moments."
    target-section: semantic-classes
    body: |
      .card.thought-bubble {
        background: var(--surface);
        border: 3px solid var(--black);
        border-radius: 30px;
        padding: var(--space-3) var(--space-4);
        position: relative;
        margin-bottom: var(--space-5);
        font-style: italic;
      }
      .card.thought-bubble::after {
        content: '';
        position: absolute;
        bottom: -22px;
        left: 30px;
        width: 12px;
        height: 12px;
        background: var(--surface);
        border: 3px solid var(--black);
        border-radius: 50%;
      }
      .card.thought-bubble::before {
        content: '';
        position: absolute;
        bottom: -34px;
        left: 24px;
        width: 8px;
        height: 8px;
        background: var(--surface);
        border: 2px solid var(--black);
        border-radius: 50%;
        z-index: 1;
      }

  - name: Action Burst
    slug: action-burst
    title: "POW! action callout"
    description: "A starburst/explosion shape behind text — for key revelations and important callouts."
    target-section: semantic-classes
    body: |
      .action-burst {
        display: inline-block;
        background: var(--brand-yellow);
        color: var(--black);
        font-family: var(--font-display);
        font-size: var(--font-size-xl);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: var(--space-2) var(--space-4);
        clip-path: polygon(
          50% 0%, 61% 15%, 78% 5%, 72% 24%, 95% 25%,
          80% 38%, 100% 50%, 80% 62%, 95% 75%,
          72% 76%, 78% 95%, 61% 85%, 50% 100%,
          39% 85%, 22% 95%, 28% 76%, 5% 75%,
          20% 62%, 0% 50%, 20% 38%, 5% 25%,
          28% 24%, 22% 5%, 39% 15%
        );
        text-align: center;
        min-width: 120px;
      }

  - name: Halftone Overlay
    slug: halftone-overlay
    title: "Comic halftone dots"
    description: "Classic halftone dot pattern overlay — gives surfaces a printed comic book texture."
    target-section: color
    body: |
      .halftone {
        position: relative;
      }
      .halftone::after {
        content: '';
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle, var(--black) 1px, transparent 1px);
        background-size: 6px 6px;
        opacity: 0.04;
        pointer-events: none;
      }

  - name: Panel Border
    slug: panel-border
    title: "Comic panel frame"
    description: "Thick black border like a comic book panel — cards become individual panels in a strip."
    target-section: semantic-classes
    body: |
      .card.panel {
        border: 3px solid var(--black);
        border-radius: 0;
        box-shadow: 4px 4px 0 var(--black);
        position: relative;
      }
      .card.panel.tilted {
        transform: rotate(-1deg);
      }
      .card.panel.tilted-right {
        transform: rotate(1.5deg);
      }

  - name: Sound Effect
    slug: sound-effect
    title: "Comic sound effect text"
    description: "Large, rotated, colorful text for emphasis — WHAM! KAPOW! ZAP!"
    target-section: typography
    body: |
      .sound-effect {
        font-family: var(--font-display);
        font-size: clamp(2rem, 5vw, 4rem);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--brand-red);
        text-shadow:
          3px 3px 0 var(--brand-yellow),
          -1px -1px 0 var(--black),
          1px -1px 0 var(--black),
          -1px 1px 0 var(--black),
          1px 1px 0 var(--black);
        display: inline-block;
        transform: rotate(-5deg) scale(1.1);
      }
