vars:
  groups:
    - name: "Seed Colors"
      vars:
        white: "#fffef5"
        black: "#1a1a1a"
        red: "#ff3366"
        blue: "#3366ff"
        yellow: "#ffcc00"

    - name: "Primaries"
      vars:
        brand-red: "#ff3366"
        brand-blue: "#3366ff"
        brand-yellow: "#ffcc00"

    - name: "Palette"
      vars:
        rose: "#ff3366"
        rose-light: "color-mix(in srgb, #ff3366 15%, var(--surface))"
        orange: "#ff6600"
        orange-light: "color-mix(in srgb, #ff6600 15%, var(--surface))"
        amber: "#ffaa00"
        amber-light: "color-mix(in srgb, #ffaa00 18%, var(--surface))"
        lime: "#66cc00"
        lime-light: "color-mix(in srgb, #66cc00 12%, var(--surface))"
        emerald: "#00cc66"
        emerald-light: "color-mix(in srgb, #00cc66 12%, var(--surface))"
        teal: "#00cccc"
        teal-light: "color-mix(in srgb, #00cccc 12%, var(--surface))"
        cyan: "#00ccff"
        cyan-light: "color-mix(in srgb, #00ccff 12%, var(--surface))"
        sky: "#3399ff"
        sky-light: "color-mix(in srgb, #3399ff 12%, var(--surface))"
        indigo: "#6633ff"
        indigo-light: "color-mix(in srgb, #6633ff 12%, var(--surface))"
        violet: "#9933ff"
        violet-light: "color-mix(in srgb, #9933ff 12%, var(--surface))"
        purple: "#cc33ff"
        purple-light: "color-mix(in srgb, #cc33ff 12%, var(--surface))"
        fuchsia: "#ff33cc"
        fuchsia-light: "color-mix(in srgb, #ff33cc 12%, var(--surface))"
        pink: "#ff6699"
        pink-light: "color-mix(in srgb, #ff6699 12%, var(--surface))"

    - name: "Semantic Colors"
      vars:
        success: "#00cc66"
        warning: "#ffaa00"
        error: "#ff3366"
        info: "#3366ff"

    - name: "Typography"
      vars:
        font-sans: "'Nunito', 'Comic Neue', -apple-system, sans-serif"
        font-mono: "'Fira Code', 'Menlo', monospace"
        font-display: "'Bangers', 'Impact', sans-serif"

    - name: "Shape"
      vars:
        radius: "0px"

    - name: "Cards"
      vars:
        card-separator-style: "solid"
        card-separator-color: "var(--black)"
        card-footer-font-size: "var(--font-size-sm)"
        card-footer-font-weight: "var(--font-weight-bold)"

    - name: "Buttons"
      vars:
        btn-font-size: "16px"
        btn-font-weight: "800"
        btn-letter-spacing: "0.02em"
