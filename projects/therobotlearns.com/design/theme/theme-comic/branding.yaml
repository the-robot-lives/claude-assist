name: "The Robot Learns — Comic"
logo-text: "THE ROBOT LEARNS"
font-url: "https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;600;700;800&family=Fira+Code:wght@400;500&display=swap"
intent: "Make every page a visual conversation. Speech bubbles explain concepts. Characters react. Callout boxes grab attention. Learning should feel like reading your favorite graphic novel."
perception: "Energetic, visual, alive. Every screen has personality — characters that emote, panels that break the grid, sound effects that punctuate big ideas."
audience: "Visual learners, younger audiences, anyone bored by traditional textbooks. People who learn better from HeadFirst than from O'Reilly."
tone: "Conversational, punchy, dramatic. Use speech bubbles. Break the fourth wall. Make concepts into characters. POW!"
keywords:
  - Visual
  - Panels
  - Speech
  - POW
  - Characters
  - Action
