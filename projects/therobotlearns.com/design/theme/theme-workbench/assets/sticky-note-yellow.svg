<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="fold" x1="1" y1="0" x2="0.85" y2="0.15">
      <stop offset="0%" stop-color="#e8d88a"/>
      <stop offset="100%" stop-color="#fef3b5"/>
