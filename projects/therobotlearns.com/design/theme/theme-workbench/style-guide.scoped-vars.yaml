# ═══════════════════════════════════════════════════════════════
# Workbench · scoped-var deltas (ACCUMULATE onto the base, per-var name).
#
# Workbench is LIGHT-PRIMARY (cream paper), so light mode already resolves the
# right cream/brown/clay values off the white/black seeds + vars.yaml — the only
# standard-section delta is the warm-brown shadow token (§6 deliberate elevation).
#
# DARK is a faithful "dark wood bench" translation (§3), and it needs a real block
# because the base's OWN dark scoped-vars (a) point surface at bluish slate and
# (b) brighten brand-red/blue/yellow + every semantic from LITERAL Bauhaus/navy/
# gold/green/rose hexes — NOT var(--brand-*). Left alone, Workbench's dark mode
# would show a slate canvas with a Bauhaus-red accent: the exact leak the v3
# template warns about. Every dark entry below re-pins those to Workbench's warm
# brown surfaces and clay accents. This is a base-cascade defect, escalated in
# conformance-workbench.md — NOT fixed in the base from here.
#
# prefix "theme" makes these emit as --theme-*, which the base cascade's
# `--brand-red: var(--theme-brand-red)` (etc.) aliases resolve. A scoped-vars file
# owns its `sections` block (no inheritance from the base file).
# ═══════════════════════════════════════════════════════════════
scoped-vars:
  prefix: "theme"
  sections:
    standard:
      selector: 'html[data-design-theme="workbench"]'
      prefix: "theme"
    dark:
      selector: 'html[data-design-theme="workbench"].dark'
      prefix: "theme"
  vars:
    # ── Shadow (warm brown, both modes) ────────────────────────────
    - name: shadow-color
      value:
        - section: standard
          value: "rgba(44,36,22,0.12)"   # §6 soft warm-brown lift on cream
        - section: dark
          value: "rgba(0,0,0,0.40)"

    # ── Dark surfaces / text / borders (§3 "dark wood bench") ───────
    # Overrides the base's bluish slate dark cascade with warm brown.
    - name: surface
      value:
        - section: dark
          value: "#2c2416"
    - name: surface-alt
      value:
        - section: dark
          value: "#3d3224"
    - name: surface-inverse
      value:
        - section: dark
          value: "#e8dfd0"
    - name: text
      value:
        - section: dark
          value: "#e8dfd0"       # warm cream text on wood ≈ 11:1
    - name: text-secondary
      value:
        - section: dark
          value: "#bfb095"       # ≈ 6.5:1
    - name: text-muted
      value:
        - section: dark
          value: "#a89876"       # floored ≈ 4.6:1 for body-adjacent; never the base gray
    - name: text-inverse
      value:
        - section: dark
          value: "#2c2416"
    - name: border
      value:
        - section: dark
          value: "#504030"
    - name: border-strong
      value:
        - section: dark
          value: "#6b5a44"

    # ── Dark brand tints (kill the base's Bauhaus/navy/gold leak) ──────
    # Clay accents, brightened toward white for legibility on warm brown —
    # same 75%/18%/30% shape the base uses, but off Workbench's own hexes.
    - name: brand-red
      value:
        - section: dark
          value: "color-mix(in srgb, #e74c3c 78%, white)"
    - name: brand-red-light
      value:
        - section: dark
          value: "color-mix(in srgb, #e74c3c 18%, var(--surface))"
    - name: brand-red-mid
      value:
        - section: dark
          value: "color-mix(in srgb, #e74c3c 30%, var(--surface))"
    - name: brand-blue
      value:
        - section: dark
          value: "color-mix(in srgb, #2980b9 72%, white)"
    - name: brand-blue-light
      value:
        - section: dark
          value: "color-mix(in srgb, #2980b9 18%, var(--surface))"
    - name: brand-blue-mid
      value:
        - section: dark
          value: "color-mix(in srgb, #2980b9 30%, var(--surface))"
    - name: brand-yellow
      value:
        - section: dark
          value: "color-mix(in srgb, #f1c40f 82%, white)"
    - name: brand-yellow-light
      value:
        - section: dark
          value: "color-mix(in srgb, #f1c40f 18%, var(--surface))"
    - name: brand-yellow-mid
      value:
        - section: dark
          value: "color-mix(in srgb, #f1c40f 30%, var(--surface))"

    # ── Dark semantic (clay set; kills base green/gold/rose/navy leak) ──
    # Same friendly clay hues as light, brightened for the warm-brown canvas.
    - name: success
      value:
        - section: dark
          value: "color-mix(in srgb, #27ae60 75%, white)"
    - name: success-tint
      value:
        - section: dark
          value: "color-mix(in srgb, #27ae60 18%, var(--surface))"
    - name: warning
      value:
        - section: dark
          value: "color-mix(in srgb, #f39c12 82%, white)"
    - name: warning-tint
      value:
        - section: dark
          value: "color-mix(in srgb, #f39c12 18%, var(--surface))"
    - name: error
      value:
        - section: dark
          value: "color-mix(in srgb, #e74c3c 78%, white)"
    - name: error-tint
      value:
        - section: dark
          value: "color-mix(in srgb, #e74c3c 18%, var(--surface))"
    - name: info
      value:
        - section: dark
          value: "color-mix(in srgb, #2980b9 72%, white)"
    - name: info-tint
      value:
        - section: dark
          value: "color-mix(in srgb, #2980b9 18%, var(--surface))"
