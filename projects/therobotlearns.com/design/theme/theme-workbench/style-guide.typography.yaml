typography:
  - var: font-sans
    name: Outfit
    description: "Primary typeface. Clean geometric sans — the 'typed label' on your project. Readable, modern, no-nonsense."
    usage: "Body text, UI labels, buttons, descriptions"
    weights: [400, 500, 600, 700]

  - var: font-mono
    name: Source Code Pro
    description: "Monospace typeface. Clean developer mono for code and technical content."
    usage: "Code blocks, token values, metadata"
    weights: [400, 500, 600]

  - var: font-display
    name: Caveat
    description: "Display typeface. Hand-written marker pen — like someone scrawled the heading on a whiteboard during a brainstorm."
    usage: "Page titles, sticky note text, annotations, callout labels"
    weights: [400, 500, 600, 700]
    colors:
      - label: "Marker Blue"
        value: "#2980b9"
        background: "#f5f0e8"
        note: "Blue dry-erase marker — primary headings and labels."
      - label: "Marker Red"
        value: "#e74c3c"
        background: "#f5f0e8"
        note: "Red marker — important callouts, 'don't forget!' annotations."
      - label: "Marker Green"
        value: "#27ae60"
        background: "#f5f0e8"
        note: "Green marker — success states, 'done!' checkmarks."

# BUG FIX (Stage B audit): a theme's typography.yaml REPLACES the base wholesale,
# so the prior Display/H1/H2/Label-only file silently deleted Body, Small, Code,
# Caption and Mono — body text had no class to resolve to. The full base set is
# re-declared here in Workbench's voice: handwritten Caveat (font-display) for the
# big titles, printed Outfit (font-sans) for body/sub-heads, Source Code Pro
# (font-mono) for code/metadata. Label stays handwritten by intent (§4).
typography-classes:
  - name: Display
    class: typography-display
    font-family: "var(--font-display)"
    font-size: "var(--font-size-display)"
    font-weight: "700"
    line-height: "1.1"
    letter-spacing: "-0.01em"

  - name: H1
    class: typography-h1
    font-family: "var(--font-display)"
    font-size: "var(--font-size-3xl)"
    font-weight: "600"
    line-height: "1.15"

  - name: H2
    class: typography-h2
    font-family: "var(--font-display)"
    font-size: "var(--font-size-2xl)"
    font-weight: "600"
    line-height: "1.2"

  - name: H3
    class: typography-h3
    font-family: "var(--font-display)"
    font-size: "var(--font-size-xl)"
    font-weight: "600"
    line-height: "1.25"

  - name: H4
    class: typography-h4
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-lg)"
    font-weight: "600"
    line-height: "1.4"

  - name: Body
    class: typography-body
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-md)"
    font-weight: "400"
    line-height: "1.6"

  - name: Small
    class: typography-small
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-sm)"
    font-weight: "400"
    line-height: "1.5"

  - name: Label
    class: typography-label
    font-family: "var(--font-display)"
    font-size: "var(--font-size-sm)"
    font-weight: "500"
    line-height: "1.3"
    letter-spacing: "0.01em"

  - name: Code
    class: typography-code
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-sm)"
    font-weight: "400"
    line-height: "1.6"

  - name: Caption
    class: typography-caption
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-xs)"
    font-weight: "400"
    line-height: "1.5"

  - name: Mono
    class: typography-mono
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-md)"
    font-weight: "400"
    line-height: "1.6"
