<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#2d4a2d"/>
  <!-- Chalk dust noise -->
  <filter id="chalk-noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="400" height="400" filter="url(#chalk-noise)" opacity="0.04" fill="white"/>
  <!-- Faint eraser smudge -->
  <ellipse cx="280" cy="120" rx="80" ry="40" fill="rgba(232,228,216,0.03)"/>
  <!-- Wood frame -->
  <rect x="0" y="290" width="400" height="10" fill="#5c4a32"/>
  <line x1="0" y1="290" x2="400" y2="290" stroke="#7a6544" stroke-width="1"/>
</svg>
