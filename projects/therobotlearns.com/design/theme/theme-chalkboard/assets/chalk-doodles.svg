<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <!-- Hand-drawn chalk doodles for margins and decorations -->
  <g stroke="#e8e4d8" fill="none" stroke-linecap="round" opacity="0.4">
    <!-- Star -->
    <path d="M 40 30 L 43 42 L 55 42 L 45 50 L 48 62 L 40 54 L 32 62 L 35 50 L 25 42 L 37 42 Z" stroke-width="1.5"/>
    <!-- Lightbulb -->
    <ellipse cx="120" cy="35" rx="12" ry="15" stroke-width="1.5"/>
    <path d="M 112 50 L 128 50 M 114 54 L 126 54 M 116 58 L 124 58" stroke-width="1.5"/>
    <path d="M 120 20 L 120 14 M 108 24 L 103 20 M 132 24 L 137 20" stroke-width="1"/>
    <!-- Arrow pointing right -->
    <path d="M 180 40 Q 200 30 220 35 Q 240 40 260 35" stroke-width="2"/>
    <path d="M 254 28 L 262 35 L 252 40" stroke-width="2"/>
    <!-- Checkmark -->
    <path d="M 310 45 L 320 55 L 345 25" stroke-width="2.5" stroke="#50b878"/>
    <!-- Question mark -->
    <path d="M 378 25 Q 390 20 390 35 Q 390 42 380 45" stroke-width="2" stroke="#6cb4dc"/>
    <circle cx="380" cy="52" r="1.5" fill="#6cb4dc"/>
  </g>
  <!-- Lower doodles -->
  <g stroke="#e8e4d8" fill="none" stroke-linecap="round" opacity="0.3">
    <!-- Spiral -->
    <path d="M 60 130 Q 65 120 75 125 Q 85 130 80 140 Q 75 150 65 145 Q 55 140 60 130" stroke-width="1.5"/>
    <!-- Atom -->
    <circle cx="180" cy="140" r="4" stroke-width="1.5"/>
    <ellipse cx="180" cy="140" rx="20" ry="8" stroke-width="1" transform="rotate(-30 180 140)"/>
    <ellipse cx="180" cy="140" rx="20" ry="8" stroke-width="1" transform="rotate(30 180 140)"/>
    <!-- Graph axes -->
    <path d="M 280 170 L 280 120 M 280 170 L 340 170" stroke-width="1.5"/>
    <path d="M 285 160 Q 300 130 315 145 Q 330 160 340 135" stroke-width="1.5" stroke="#e8d44c"/>
  </g>
</svg>
