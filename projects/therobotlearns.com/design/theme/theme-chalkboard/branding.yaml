name: "The Robot Learns — Chalkboard"
logo-text: "THE ROBOT LEARNS"
# font-url loads exactly the three faces referenced by font-sans/font-display/font-mono
# (Patrick Hand, Architects Daughter, Roboto Mono). Roboto Slab was dropped: it was a dead
# import — loaded but referenced by no font var (treatise §4/§10) — and a slab serif would
# break §4's "the whole board is written by hand" commitment. Verified HTTP 200, all 3 faces.
font-url: "https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Patrick+Hand:wght@400&family=Roboto+Mono:wght@400;500&display=swap"
intent: "Capture the magic of a brilliant lecture. The chalkboard after a great teacher finishes — diagrams, equations, arrows connecting ideas, margin notes, the 'aha' moment drawn in colored chalk."
perception: "Warm, academic, personal. Like sitting in the front row of the best class you ever took, where the professor draws everything out and makes it click."
audience: "Students, academics, anyone nostalgic for great classroom teaching. People who learn from explanation and demonstration."
tone: "Professorial but warm. Think-aloud style. 'Now watch what happens when we...' Underlines for emphasis. Arrows connecting ideas."
keywords:
  - Chalk
  - Lecture
  - Diagram
  - Underline
  - Explain
  - Blackboard
