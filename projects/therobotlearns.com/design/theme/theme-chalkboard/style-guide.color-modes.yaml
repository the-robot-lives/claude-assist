# DELIBERATE ALWAYS-DARK (Stage C BUG-2 decision). Chalkboard is chalk on a dark green slate
# board — its identity (treatise §1/§2/§3) is a dark surface, and its anti-reference §2 explicitly
# rejects "workbench's cream paper" and "a sterile dry-erase whiteboard". Authoring a true
# light/paper mode here would betray that identity and collapse the distinction from its sibling
# theme `workbench` (which IS the light paper theme). So BOTH maps below are dark on purpose:
#   light = "#2d4a2d"  → the DAYTIME board (forest green, board under classroom lights)
#   dark  = "#1e2a1e"  → the EVENING board (near-black green, the board after hours)
# These are two distinct dark board variants, not a light/dark luminance pair. There is no
# genuine light mode and no high-contrast mode by design; see conformance-chalkboard.md
# Deviations & Waivers. (Note: the legacy generate-css path does not emit these literal maps —
# only the white/black seed cascade resolves modes there — so the dark map is unverifiable until
# the npx serve path is available; recorded in the conformance note.)
color-modes:
  light:
    surface: "#2d4a2d"
    surface-alt: "#365636"
    surface-inverse: "#e8e4d8"
    surface-accent: "rgba(108,180,220,0.1)"
    surface-warning: "rgba(232,212,76,0.12)"
    surface-danger: "rgba(224,96,96,0.1)"
    text: "#e8e4d8"
    text-secondary: "#c8c0a8"
    text-muted: "#90886c"
    text-inverse: "#2d4a2d"
    text-link: "#6cb4dc"
    border: "rgba(232,228,216,0.2)"
    border-strong: "rgba(232,228,216,0.35)"
    border-accent: "#e8d44c"
    shadow-color: "rgba(0,0,0,0.2)"
    focus-ring: "rgba(108,180,220,0.4)"

  dark:
    surface: "#1e2a1e"
    surface-alt: "#253525"
    surface-inverse: "#d8d0bc"
    surface-accent: "rgba(108,180,220,0.12)"
    surface-warning: "rgba(232,212,76,0.1)"
    surface-danger: "rgba(224,96,96,0.12)"
    text: "#d8d0bc"
    text-secondary: "#a8a088"
    text-muted: "#787060"
    text-inverse: "#1e2a1e"
    text-link: "#88c8e8"
    border: "rgba(216,208,188,0.15)"
    border-strong: "rgba(216,208,188,0.25)"
    border-accent: "#e8d44c"
    shadow-color: "rgba(0,0,0,0.35)"
    focus-ring: "rgba(136,200,232,0.4)"
