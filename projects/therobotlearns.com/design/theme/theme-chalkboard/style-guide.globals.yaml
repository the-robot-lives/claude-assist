toast:
  position: top-right
  duration: 8000
  gap: 16
  expand: true
  visible-toasts: 4

# globals are emitted VERBATIM (self-scoped). The universal reset is idempotent with the base and
# stays global; the theme-token rules (body, ::selection) are scoped to chalkboard so its warm
# background + yellow-chalk selection don't bleed onto sibling themes (V3 self-scope fix).
globals: |
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html[data-design-theme="chalkboard"] { font-size: var(--base-font-size); -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
  html[data-design-theme="chalkboard"] body {
    font-family: var(--base-font-family);
    color: var(--base-font-color);
    background: var(--base-background);
    line-height: var(--base-line-height);
  }
  html[data-design-theme="chalkboard"] ::selection { background: var(--brand-yellow); color: var(--black); }
