# Deep Focus — dark-mode brand-tint re-point (Stage C V3 fix).
#
# The base theme-style-guide/style-guide.scoped-vars.yaml brightens brand-red/-light/-mid for
# dark mode from a LITERAL Bauhaus hex (#e20613 75%/18%/30%), NOT var(--brand-red). So even
# with a fully correct vars.yaml, deep-focus's teal accent would silently revert to Bauhaus red
# in dark mode. This delta re-points the dark values to the teal accent (#14b8a6) at the base's
# own 75/18/30 ratios. This is a base-cascade defect (escalation pending against the base file);
# do not fix the base from a Stage C run.
#
# Only brand-red is re-pointed: brand-blue and brand-yellow are OFF-CHROME in this theme
# (info/warning are set directly in vars.yaml; focus/controls point at the teal accent), so
# their dark leak is inert and is documented as a reserved standing caution in
# conformance-deep-focus.md rather than re-pointed here.
#
# A scoped-vars file owns its selectors explicitly and does NOT inherit the base's sections.
scoped-vars:
  prefix: "theme"

  sections:
    standard:
      selector: 'html[data-design-theme="deep-focus"]'
      prefix: "theme"
    dark:
      selector: 'html[data-design-theme="deep-focus"].dark'
      prefix: "theme"

  vars:
    - name: brand-red
      value:
        - section: dark
          value: "color-mix(in srgb, #14b8a6 75%, white)"
    - name: brand-red-light
      value:
        - section: dark
          value: "color-mix(in srgb, #14b8a6 18%, var(--surface))"
    - name: brand-red-mid
      value:
        - section: dark
          value: "color-mix(in srgb, #14b8a6 30%, var(--surface))"
