color-modes:
  light:
    surface: "var(--white)"
    surface-alt: "var(--gray-50)"
    surface-inverse: "var(--black)"
    surface-accent: "rgba(99,102,241,0.08)"
    surface-warning: "var(--yellow-light)"
    surface-danger: "var(--red-light)"
    text: "var(--black)"
    text-secondary: "var(--gray-700)"
    text-muted: "var(--gray-500)"
    text-inverse: "var(--white)"
    text-link: "#4f46e5"
