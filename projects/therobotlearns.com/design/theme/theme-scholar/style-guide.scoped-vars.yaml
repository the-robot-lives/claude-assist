# Scholar — dark-mode brand-tint re-point (Stage C V3 fix).
#
# Scholar is light-primary (treatise §3), but a faithful dark mode exists. The base
# theme-style-guide/style-guide.scoped-vars.yaml brightens brand-red/-light/-mid for dark mode
# from a LITERAL Bauhaus hex (#e20613 at 75/18/30), NOT var(--brand-red). So even with a fully
# correct vars.yaml, scholar's indigo accent would silently revert to Bauhaus red in dark mode.
# This delta re-points the dark values to the indigo accent (#6366F1) at the base's own 75/18/30
# ratios (the treatise names #818CF8 as the dark indigo; the 75%-white mix lands adjacent to it).
# Base-cascade defect (escalation pending against the base file); do NOT fix the base from a
# Stage C run.
#
# Only brand-red is re-pointed: brand-blue and brand-yellow are OFF-CHROME here (info/warning are
# set directly in vars.yaml; focus/controls point at the indigo accent), so their dark leak is
# inert and is documented as a reserved standing caution in conformance-scholar.md, not re-pointed.
#
# A scoped-vars file owns its selectors explicitly and does NOT inherit the base's sections.
scoped-vars:
  prefix: "theme"

  sections:
    standard:
      selector: 'html[data-design-theme="scholar"]'
      prefix: "theme"
    dark:
      selector: 'html[data-design-theme="scholar"].dark'
      prefix: "theme"

  vars:
    - name: brand-red
      value:
        - section: dark
          value: "color-mix(in srgb, #6366F1 75%, white)"
    - name: brand-red-light
      value:
        - section: dark
          value: "color-mix(in srgb, #6366F1 18%, var(--surface))"
    - name: brand-red-mid
      value:
        - section: dark
          value: "color-mix(in srgb, #6366F1 30%, var(--surface))"
