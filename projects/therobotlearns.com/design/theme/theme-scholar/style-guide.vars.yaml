# Scholar — light-native minimal tech. DELTA seeds over base-theme: theme-style-guide.
# Treatise: near-white #fafafa canvas, near-black #111118 ink, a single indigo accent, crisp
# 4px radius, Inter + JetBrains Mono. Neutrals inherit the base cool-slate/gray ramp (treatise
# §3, intentional — a faint cool cast is exactly what the base slate surfaces provide; see
# conformance-scholar.md for the documented-inheritance rationale).
#
# SEED-TRAP FIX (Stage C): the base wires accents on brand-red/brand-blue/brand-yellow, NOT
# bare red/blue/yellow (bare keys are silent no-ops). The shipped file used bare `red`/`blue`/
# `yellow`, so the indigo accent NEVER applied — chrome silently rendered the base Bauhaus red.
# Moved the accent to brand-red and re-pointed brand-red-light/-mid to read var(--brand-red)
# (the base pins those to a color-mix with the OLD hex baked in). Accent count is ONE (indigo):
# brand-blue/brand-yellow are left at base, off-chrome and unused (info/warning are set directly,
# controls are re-pointed to the indigo accent) — see conformance standing cautions.
vars:
  groups:
    - name: "Seed Colors"
      vars:
        white: "#fafafa"        # §3 lightest surface — near-white canvas (not pure #fff)
        black: "#111118"        # §3 darkest — near-black ink, faint cool cast

        brand-red: "#6366F1"    # §3 the single indigo accent — the theme's whole voice
        brand-red-light: "color-mix(in srgb, var(--brand-red) 12%, var(--surface))"
        brand-red-mid: "color-mix(in srgb, var(--brand-red) 20%, var(--surface))"

    - name: "Semantic Colors"
      # §3 standard modern-web set; set directly (not via brand-*) so each is exact and
      # independent of the off-chrome brand-blue/brand-yellow slots.
      vars:
        success: "#22c55e"
        warning: "#eab308"
        error: "#ef4444"        # §3 far from indigo (~0° vs ~239°) — "error" never reads as brand
        info: "#3b82f6"

    - name: "Typography"
      vars:
        font-sans: "'Inter', -apple-system, BlinkMacSystemFont, sans-serif"  # §4 must match branding font-url
        font-mono: "'JetBrains Mono', 'Fira Code', monospace"                # §4 code, IDs, literals

    - name: "Shape"
      vars:
        radius: "4px"           # §6 crisp-soft "competent default" — cards, inputs, buttons; no pills, no sharp 0

    - name: "Interaction — indigo focus & controls (§7/§8/§9)"
      # §7/§8/§9 commit to a 2px indigo focus ring on every focusable element, an indigo primary
      # fill, and indigo-active controls. The base defaults these to var(--brand-blue) (a blue),
      # so scholar's form chrome would render blue, not indigo. Re-point them to the indigo accent
      # so focus/controls honor the treatise and brand-blue stays genuinely off-chrome.
      vars:
        hui-focus-ring-color: "color-mix(in srgb, var(--brand-red) 35%, transparent)"  # §7 2px indigo ring, ~0.35 alpha
        hui-control-color: "var(--brand-red)"
        hui-field-focus-border: "var(--brand-red)"
        hui-switch-track-on-bg: "var(--brand-red)"
        hui-radio-option-border-active: "var(--brand-red)"
        hui-radio-option-bg-active: "color-mix(in srgb, var(--brand-red) 8%, var(--surface))"
