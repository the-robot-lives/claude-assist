vars:
  groups:
    - name: "Seed Colors"
      vars:
        white: "#fafafa"
        black: "#111118"
        red: "#6366F1"
        blue: "#3B82F6"
        yellow: "#F59E0B"

    - name: "Semantic Colors"
      vars:
        success: "#22c55e"
        warning: "#eab308"
        error: "#ef4444"
        info: "#3b82f6"

    - name: "Typography"
      vars:
        font-sans: "'Inter', -apple-system, BlinkMacSystemFont, sans-serif"
        font-mono: "'JetBrains Mono', 'Fira Code', monospace"

    - name: "Shape"
      vars:
        radius: "4px"
