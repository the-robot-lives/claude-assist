# ═══════════════════════════════════════════════════════════════
# Cockpit — seed deltas over theme-style-guide (treatise §3/§4/§6/§10).
# Only the seeds this theme pins; everything else rides the base cascade.
#
# DARK-PRIMARY PATTERN (mirrors theme-npl-minimal): the SEED carries the
# LIGHT-mode magenta (#c81e6e, legible on the pale daylight canvas), and
# style-guide.scoped-vars.yaml brightens it to the SIGNATURE dark magenta
# #ff2e88 for dark mode (the design target). This also repairs the base
# dark-scoped-vars leak that would otherwise revert the accent to Bauhaus red.
#
# SEED-TRAP FIX: the cascade's accent slot is named brand-red (NOT bare red).
# brand-red-light is re-pointed to var(--brand-red) because the base pins it to
# a color-mix() with the old literal Bauhaus hex hard-coded inside.
#
# brand-blue / brand-yellow are deliberately LEFT to the base cascade — Cockpit's
# discipline is ONE brand signal (magenta) plus exactly four status hues; a fifth
# decorative color is a bug (treatise §2). Those reserved slots never touch working
# chrome (documented standing caution in conformance-cockpit.md).
# ═══════════════════════════════════════════════════════════════

vars:
  groups:
    # ── Surfaces ── §3 neutrals: cool graphite canvas, cool off-white ink.
    # white is re-seeded to a cool off-white (not pure white) so the derived ramp
    # stays blue-cool and dark-mode text (white-seed on black-seed) reads ~12:1.
    - name: Surfaces
      vars:
        white: "#c9d1d9"   # cool off-white — dark-mode data ink on graphite (~12:1)
        black: "#0e1116"   # cool graphite canvas (~215°, very low lightness) — the panel

    # ── Primary ── §3: a SINGLE brand signal, electric magenta, held OFF the
    # semantic axis so "selected" never reads as error/ok. Seed = light value;
    # dark brightens to #ff2e88 in scoped-vars.
    - name: Primary - Signal Magenta
      vars:
        brand-red: "#c81e6e"     # PRIMARY accent (light-mode magenta); dark → #ff2e88
        brand-red-light: "color-mix(in srgb, var(--brand-red) 70%, var(--surface))"

    # ── Semantic ── §3/§9: the GitHub-dark set — battle-tested for legibility on
    # dark graphite, each always paired with a glyph (✓ ! ✗ i) so status survives
    # grayscale/colorblind viewing. error(red) stays distinct from accent(magenta).
    - name: Semantic - GitHub-dark set
      vars:
        success: "#3fb950"   # green ✓
        warning: "#d29922"   # amber !  (near-the-line on graphite ≈4.7:1 — label size+)
        error: "#f85149"     # red ✗
        info: "#58a6ff"      # blue i

    # ── Typography ── §4: DUAL system — mono for all data/values/meters/tables,
    # a tight grotesk for pane titles and field labels only (no serif anywhere).
    - name: Typography
      vars:
        font-sans: "'Inter', -apple-system, BlinkMacSystemFont, sans-serif"   # labels/titles
        font-mono: "'JetBrains Mono', 'IBM Plex Mono', monospace"             # all data

    # ── Shape ── §6: crisp rectangles, 1px maximum. No soft corners, no pills.
    - name: Shape
      vars:
        radius: "1px"
