# Cockpit color modes (treatise §3 Mode strategy).
# DARK is primary and the design target — a cockpit is a dark instrument panel.
# LIGHT is a faithful "daylight instrument" translation (graphite ink on a pale
# canvas, magenta carried by the seed at #c81e6e) with no independent design
# decisions. Data text targets AAA (≥7:1) in dark since operators scan numbers
# for long stretches.
#
# VERIFICATION NOTE: the legacy generate-css path does NOT emit these literal
# light/dark maps (only the white/black seed cascade resolves modes on that path),
# so these values are reasoned, not serve-verified while styleguide_serve is off
# (see conformance-cockpit.md). border (resting, decorative box-rules) is the
# GitHub-dark #30363d and is intentionally sub-3:1 — meaningful boundaries use
# border-strong (≥3.9:1) and the active-pane magenta border.
color-modes:
  light:
    surface: "#eef1f4"
    surface-alt: "#e2e7ec"
    surface-inverse: "#0e1116"
    text: "#1c2128"            # #1c2128 on #eef1f4 ≈ 13.8:1
    text-secondary: "#424a53"  # ≈ 8.3:1
    text-muted: "#5b636d"      # ≈ 5.3:1 (clears body)
    text-inverse: "#eef1f4"
    border: "#c2cad2"          # resting decorative rule
    border-strong: "#6e7681"   # meaningful boundary ≈ 4.1:1 on pale
    shadow-color: "rgba(1, 4, 9, 0.15)"   # only the modal-overlay shadow (§6)
  dark:
    surface: "#0e1116"
    surface-alt: "#161b22"      # one graphite step lighter — the active pane tone
    surface-inverse: "#c9d1d9"
    text: "#c9d1d9"             # #c9d1d9 on #0e1116 ≈ 12:1 (AAA data)
    text-secondary: "#8b949e"   # ≈ 5.9:1
    text-muted: "#7d8590"       # ≈ 4.8:1 (clears body; gray-500 would fail)
    text-inverse: "#0e1116"
    border: "#30363d"           # dim graphite box-rule (resting/decorative, sub-3:1 by design)
    border-strong: "#6e7681"    # meaningful boundary ≈ 3.9:1 on graphite
    shadow-color: "rgba(1, 4, 9, 0.6)"    # single soft shadow under a modal overlay only
