# Phosphor · component inflections (treatise §6/§7/§8/§9). This facet
# ACCUMULATES onto the base (unlike vars/color-modes/typography, which
# replace), so it is the safe home for Phosphor's terminal-specific sample
# elements without clobbering the base design-sections.
#
# SELF-SCOPED: every selector is nested under html[data-design-theme="phosphor"]
# — the generator emits css-snippets VERBATIM (self-scoped facet), so a bare
# selector would bleed into every sibling theme. The one @keyframes is
# name-namespaced ("phosphor-…"), which matches no markup and cannot bleed.
# --brand-red resolves to amber (#ffb000 dark / #a85f00 light) in this theme.
css-snippets:
  - name: Phosphor Foundation — radius 0, zero elevation, focus block, no motion
    slug: phosphor-foundation
    title: "Radius 0, zero shadows, amber focus box, instant state (§6/§7/§9)"
    description: "The theme's structural floor: radius 0 and box-shadow:none on every working surface (§6 zero elevation); motion tokens pinned to 0ms (§7 — a terminal repaints, it does not animate); an 80ch terminal measure (§5); and a 1px full-amber focus box on every focusable element, never removed (§9). Self-scoped so it never touches sibling themes."
    target-section: interaction
    body: |
      html[data-design-theme="phosphor"] {
        --motion: 0ms;
        --motion-micro: 0ms;
        --motion-panel: 0ms;
        --transition-base: 0ms;
        --terminal-measure: 80ch;
      }
      html[data-design-theme="phosphor"] .card,
      html[data-design-theme="phosphor"] .btn,
      html[data-design-theme="phosphor"] .panel,
      html[data-design-theme="phosphor"] .stat-tile {
        border-radius: 0;
        box-shadow: none;
      }
      html[data-design-theme="phosphor"] :focus-visible {
        outline: 1px solid var(--brand-red);
        outline-offset: 1px;
      }

  - name: Phosphor Block Cursor
    slug: phosphor-cursor
    title: "Blinking block cursor, reduced-motion static (§7)"
    description: "The one living element (§7): a 1ch amber block cursor that blinks on a 1000ms step (square-wave) toggle, no fade. prefers-reduced-motion freezes it to a static block (§9) — nothing else in the theme moves, so nothing else needs disabling."
    target-section: interaction
    body: |
      @keyframes phosphor-cursor-blink {
        0%, 50% { opacity: 1; }
        50.01%, 100% { opacity: 0; }
      }
      html[data-design-theme="phosphor"] .cursor,
      html[data-design-theme="phosphor"] .prompt-caret {
        display: inline-block;
        width: 1ch;
        height: 1.2em;
        vertical-align: text-bottom;
        background: var(--brand-red);
        animation: phosphor-cursor-blink 1000ms step-end infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        html[data-design-theme="phosphor"] .cursor,
        html[data-design-theme="phosphor"] .prompt-caret {
          animation: none;
          opacity: 1;
        }
      }

  - name: Phosphor Prompt Input
    slug: phosphor-prompt-input
    title: "Prompt-line input: amber underline + block cursor (§8)"
    description: "Inputs render as a prompt line (§8): a '> ' prefix on .prompt-line, no box — just an amber underline rule for the field extent, text typed in full amber, transparent background so the void shows through. Focus brightens the underline to full amber. Placeholder sits at the 4.5:1 floor via --text-muted (dim amber #c88a00), never dimmer."
    target-section: forms
    body: |
      html[data-design-theme="phosphor"] .prompt-line::before {
        content: "> ";
        color: var(--brand-red);
        font-family: var(--font-mono);
      }
      html[data-design-theme="phosphor"] .input,
      html[data-design-theme="phosphor"] .field,
      html[data-design-theme="phosphor"] input[type="text"],
      html[data-design-theme="phosphor"] input[type="search"] {
        font-family: var(--font-mono);
        background: transparent;
        color: var(--brand-red);
        border: none;
        border-bottom: 1px solid var(--border-strong);
        border-radius: 0;
        padding: 0.15em 0 0.15em 1.4ch;
      }
      html[data-design-theme="phosphor"] .input::placeholder,
      html[data-design-theme="phosphor"] .field::placeholder,
      html[data-design-theme="phosphor"] input[type="text"]::placeholder,
      html[data-design-theme="phosphor"] input[type="search"]::placeholder {
        color: var(--text-muted);
      }
      html[data-design-theme="phosphor"] .input:focus-visible,
      html[data-design-theme="phosphor"] .field:focus-visible,
      html[data-design-theme="phosphor"] input[type="text"]:focus-visible,
      html[data-design-theme="phosphor"] input[type="search"]:focus-visible {
        outline: none;
        border-bottom-color: var(--brand-red);
      }

  - name: Phosphor Bracketed Button
    slug: phosphor-button
    title: "Bracketed mono buttons, reverse-video primary (§8)"
    description: "Buttons are bracketed mono labels — '[ RUN ]', '[ CANCEL ]' — via ::before/::after brackets; secondary is dim-amber bracket text on the void, no fill. The primary/default is reverse-video: amber fill with a near-black (surface-colored) label. No radius, no shadow; focus is a 1px amber box."
    target-section: buttons
    body: |
      html[data-design-theme="phosphor"] .btn,
      html[data-design-theme="phosphor"] .btn.secondary {
        font-family: var(--font-mono);
        background: transparent;
        color: var(--text-secondary);
        border: none;
        border-radius: 0;
        box-shadow: none;
      }
      html[data-design-theme="phosphor"] .btn::before { content: "[ "; }
      html[data-design-theme="phosphor"] .btn::after  { content: " ]"; }
      html[data-design-theme="phosphor"] .btn-primary,
      html[data-design-theme="phosphor"] .btn.primary {
        font-family: var(--font-mono);
        background: var(--brand-red);
        color: var(--surface);
        border: none;
        border-radius: 0;
        box-shadow: none;
      }
      html[data-design-theme="phosphor"] .btn:focus-visible,
      html[data-design-theme="phosphor"] .btn-primary:focus-visible,
      html[data-design-theme="phosphor"] .btn.primary:focus-visible {
        outline: 1px solid var(--brand-red);
        outline-offset: 1px;
      }

  - name: Phosphor Box-Drawn Card
    slug: phosphor-card
    title: "Box-drawn region, no fill, no shadow (§6/§8)"
    description: "Cards are box-drawn regions (§8): no background fill (the void shows through), a 1px amber rule as the only border, radius 0, and NO shadow at rest (§6 zero elevation). An active/selected card brightens its rule to full amber — never a fill."
    target-section: cards
    body: |
      html[data-design-theme="phosphor"] .card {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0;
        box-shadow: none;
      }
      html[data-design-theme="phosphor"] .card.selected,
      html[data-design-theme="phosphor"] .card[aria-selected="true"],
      html[data-design-theme="phosphor"] .card.active {
        border-color: var(--brand-red);
      }

  - name: Phosphor TUI Status Rule
    slug: phosphor-statusbar
    title: "Persistent reverse-video keybind status bar (§8)"
    description: "The product's TUI signature (§8 navigation): a persistent bottom status rule like a real terminal app, drawn as a reverse-video bar (amber fill, surface-colored text) with left-aligned context and right-aligned keybind hints ('^Q quit  ^R reload'). Keybind glyphs stand out by weight, not by a second color."
    target-section: navigation
    body: |
      html[data-design-theme="phosphor"] .statusbar,
      html[data-design-theme="phosphor"] .status-rule {
        font-family: var(--font-mono);
        display: flex;
        justify-content: space-between;
        gap: 2ch;
        background: var(--brand-red);
        color: var(--surface);
        padding: 0.1em 1ch;
        border-radius: 0;
      }
      html[data-design-theme="phosphor"] .statusbar .key,
      html[data-design-theme="phosphor"] .status-rule .key {
        font-weight: 700;
      }

  - name: Phosphor KB Stat Tile
    slug: phosphor-stat-tile
    title: "Box-drawn KB stat tile — bright number, dim label (§8)"
    description: "The KB Maintenance Console's density unit (screens 14): a box-drawn tile with no fill, a big full-amber .value (the brightest thing on screen) over a dim-amber uppercase .label. Radius 0, no shadow — hierarchy is intensity, not elevation."
    target-section: cards
    body: |
      html[data-design-theme="phosphor"] .stat-tile {
        font-family: var(--font-mono);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 0;
        box-shadow: none;
        padding: 0.4em 1.2ch;
        text-align: left;
      }
      html[data-design-theme="phosphor"] .stat-tile .value {
        color: var(--brand-red);
        font-size: 1.4em;
        font-weight: 700;
        line-height: 1.1;
      }
      html[data-design-theme="phosphor"] .stat-tile .label {
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

  - name: Phosphor Reverse-Video Row
    slug: phosphor-row
    title: "Session-log row: hover intensifies, selection reverse-videos (§7/§8)"
    description: "The Session Log Viewer's row pattern (screen 04): a mono grid row where hover intensifies the amber one step (§7) and the current selection is a full reverse-video block (amber fill, surface-colored text) — the way a TUI marks the active line. State never depends on a second hue."
    target-section: tables
    body: |
      html[data-design-theme="phosphor"] .row,
      html[data-design-theme="phosphor"] .log-row {
        font-family: var(--font-mono);
      }
      html[data-design-theme="phosphor"] .row:hover,
      html[data-design-theme="phosphor"] .log-row:hover {
        color: var(--brand-red);
      }
      html[data-design-theme="phosphor"] .row.selected,
      html[data-design-theme="phosphor"] .row[aria-selected="true"],
      html[data-design-theme="phosphor"] .log-row.selected {
        background: var(--brand-red);
        color: var(--surface);
      }
