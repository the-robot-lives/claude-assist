# ═══════════════════════════════════════════════════════════════
# Phosphor · scoped-var deltas (ACCUMULATE onto the base, per-var name).
#
# Phosphor is MONOCHROME AMBER and DARK-PRIMARY, so it needs more
# scoped-var overrides than a typical light theme:
#
#  • LIGHT (standard) mode already inherits amber from vars.yaml — the base
#    only leaks Bauhaus colors in its DARK scoped-vars, whose brand/semantic
#    entries are all `section: dark`. So the standard section here only
#    re-points SURFACES/TEXT/BORDERS off the raw white seed (white=#ffb000
#    would otherwise paint the light canvas bright amber) to the treatise's
#    §3 cream "paper terminal" fallback, and darkens the amber accent so it
#    stays legible on cream.
#
#  • DARK mode is the ONE true mode (§3). The base's own dark scoped-vars
#    (a) point surface at slate (bluish) and (b) brighten brand-red/blue/
#    yellow + every semantic from LITERAL Bauhaus/navy/gold/green/rose hexes
#    — NOT var(--brand-*). Left alone, phosphor's dark mode would show a
#    blue-slate canvas with a Bauhaus-red accent and a GREEN success: the
#    exact monochrome-leak the v3 template warns about. Every dark entry
#    below re-pins those to phosphor's warm near-black void and amber ladder
#    (error stays the one red-shifted break). This is a base-cascade defect,
#    escalated in conformance-phosphor.md — NOT fixed in the base from here.
#
# prefix "theme" makes these emit as --theme-*, which the base cascade's
# `--brand-red: var(--theme-brand-red)` (etc.) aliases resolve. A scoped-vars
# file owns its `sections` block (no inheritance from the base file).
# ═══════════════════════════════════════════════════════════════
scoped-vars:
  prefix: "theme"
  sections:
    standard:
      selector: 'html[data-design-theme="phosphor"]'
      prefix: "theme"
    dark:
      selector: 'html[data-design-theme="phosphor"].dark'
      prefix: "theme"
  vars:
    # ── Surfaces / text / borders ──────────────────────────────────
    # standard = §3 cream "paper terminal" fallback (faithful, secondary,
    # serve-unverified); dark = §3 warm near-black void + amber phosphor.
    - name: surface
      value:
        - section: standard
          value: "#f4ead6"
        - section: dark
          value: "#140c00"
    - name: surface-alt
      value:
        - section: standard
          value: "#ece0c8"
        - section: dark
          value: "#1f1400"
    - name: surface-inverse
      value:
        - section: standard
          value: "#140c00"
        - section: dark
          value: "#ffb000"
    - name: text
      value:
        - section: standard
          value: "#a85f00"       # amber on cream ≈ 4.6:1 (treatise §3 light pair)
        - section: dark
          value: "#ffb000"       # primary amber on void ≈ 10:1
    - name: text-secondary
      value:
        - section: standard
          value: "#8a4e00"
        - section: dark
          value: "#c88a00"       # dim amber ≈ 6:1
    - name: text-muted
      value:
        - section: standard
          value: "#a85f00"
        - section: dark
          value: "#c88a00"       # §8/§9: muted floored at the 6:1 dim step, never #8a5e00 (3:1)
    - name: text-inverse
      value:
        - section: standard
          value: "#ffb000"
        - section: dark
          value: "#140c00"
    - name: border
      value:
        - section: standard
          value: "color-mix(in srgb, var(--brand-red) 35%, var(--surface))"
        - section: dark
          value: "color-mix(in srgb, var(--brand-red) 32%, var(--surface))"   # §6: 1px amber rule at ~30% intensity
    - name: border-strong
      value:
        - section: standard
          value: "color-mix(in srgb, var(--brand-red) 60%, var(--surface))"
        - section: dark
          value: "color-mix(in srgb, var(--brand-red) 60%, var(--surface))"   # active/brighter rule
    - name: shadow-color
      value:
        - section: standard
          value: "transparent"   # §6: zero elevation, no shadows ever
        - section: dark
          value: "transparent"

    # ── Accent (light legibility) ──────────────────────────────────
    # Light: darken the amber so the accent reads on cream (#ffb000 on cream
    # is ~1.6:1). Dark is pinned to full amber (already ~10:1 on the void).
    - name: brand-red
      value:
        - section: standard
          value: "#a85f00"
        - section: dark
          value: "#ffb000"
    - name: brand-blue
      value:
        - section: standard
          value: "#a85f00"
        - section: dark
          value: "#ffb000"
    - name: brand-yellow
      value:
        - section: standard
          value: "#a85f00"
        - section: dark
          value: "#ffb000"

    # ── Dark brand tints (kill the base's Bauhaus/navy/gold leak) ──────
    - name: brand-red-light
      value:
        - section: dark
          value: "color-mix(in srgb, #ffb000 18%, var(--surface))"
    - name: brand-red-mid
      value:
        - section: dark
          value: "color-mix(in srgb, #ffb000 30%, var(--surface))"
    - name: brand-blue-light
      value:
        - section: dark
          value: "color-mix(in srgb, #ffb000 18%, var(--surface))"
    - name: brand-blue-mid
      value:
        - section: dark
          value: "color-mix(in srgb, #ffb000 30%, var(--surface))"
    - name: brand-yellow-light
      value:
        - section: dark
          value: "color-mix(in srgb, #ffb000 18%, var(--surface))"
    - name: brand-yellow-mid
      value:
        - section: dark
          value: "color-mix(in srgb, #ffb000 30%, var(--surface))"

    # ── Dark semantic (amber intensities; error = the one red break) ──
    # Base dark brightens these from green/gold/rose/navy literals; re-pin
    # to the amber ladder so the true mode stays monochrome (glyph-led).
    - name: success
      value:
        - section: dark
          value: "#ffd050"       # bright amber (pair with ✓)
    - name: success-tint
      value:
        - section: dark
          value: "color-mix(in srgb, #ffd050 18%, var(--surface))"
    - name: warning
      value:
        - section: dark
          value: "#ffb000"       # amber (prefixed "! ")
    - name: warning-tint
      value:
        - section: dark
          value: "color-mix(in srgb, #ffb000 18%, var(--surface))"
    - name: error
      value:
        - section: dark
          value: "#ff5a3c"       # the one sanctioned hue break (pair with ✗)
    - name: error-tint
      value:
        - section: dark
          value: "color-mix(in srgb, #ff5a3c 18%, var(--surface))"
    - name: info
      value:
        - section: dark
          value: "#c88a00"       # dim amber (pair with i)
    - name: info-tint
      value:
        - section: dark
          value: "color-mix(in srgb, #c88a00 18%, var(--surface))"
