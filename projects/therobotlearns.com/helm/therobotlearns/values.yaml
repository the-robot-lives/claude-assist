static-site:
  nameOverride: therobotlearns
  fullnameOverride: therobotlearns
  domain: therobotlearns.com
  image: ops.noizu.com/therobotlearns.com/web:latest
  port: 80
  imagePullSecrets:
    - name: ops-registry-secret
  tls:
    secretName: therobotlearns-com-tls
    infisical:
      secretsPath: "/apps/tls/therobotlearns"
      crtKey: THEROBOTLEARNS_TLS_CRT
      keyKey: THEROBOTLEARNS_TLS_KEY
