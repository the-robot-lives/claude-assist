replicas: 1
domain: therobotlearns.com
appDomain: app.therobotlearns.com
# Dot-prefixed apex so auth cookies span therobotlearns.com and app.therobotlearns.com.
cookieDomain: ".therobotlearns.com"
backend:
  image: ops.noizu.com/therobotlearns.com/backend:v1.0.5
  port: 4000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
frontend:
  image: ops.noizu.com/therobotlearns.com/frontend:v1.0.5
  port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
migrate:
  # Schema is applied via Liquibase (liquibase-shell therobotlearns); the
  # release-eval hook only runs Ecto.Migrator against an empty priv dir.
  enabled: false
  command: ["bin/the_robot_learns", "eval", "TheRobotLearns.Release.migrate()"]
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
database:
  host: app-timescaledb.apps.svc.cluster.local
  port: 5432
  name: therobotlearns
redis:
  host: app-valkey.apps.svc.cluster.local
  port: 6379
  db: 14
secrets:
  name: therobotlearns-secrets
  infisical:
    enabled: true
    resyncInterval: 120
    hostAPI: "https://infisical.noizu.com/api"
    credentialsSecret: universal-auth-credentials
    credentialsNamespace: infra
    projectSlug: k8-infra
    envSlug: prod
    secretsPath: "/apps/therobotlearns"
  keys:
    dbUser: THEROBOTLEARNS_DB_USER
    dbPassword: THEROBOTLEARNS_DB_PASSWORD
    databaseUrl: THEROBOTLEARNS_DATABASE_URL
    secretKeyBase: THEROBOTLEARNS_SECRET_KEY_BASE
    guardianSecretKey: THEROBOTLEARNS_GUARDIAN_SECRET_KEY
    redisUrl: THEROBOTLEARNS_REDIS_URL
    sendgridApiKey: ""
    oidcClientId: THEROBOTLEARNS_OIDC_CLIENT_ID
    oidcClientSecret: THEROBOTLEARNS_OIDC_CLIENT_SECRET
    googleClientId: ""
    googleClientSecret: ""
    facebookClientId: ""
    facebookClientSecret: ""
    githubClientId: ""
    githubClientSecret: ""
    linkedinClientId: ""
    linkedinClientSecret: ""
    samlSpCert: ""
    samlSpKey: ""
mail:
  fromName: ""
  fromAddress: ""
sso:
  requireInvite: false
  # domain=providers entries (";"/space separated); domains absent from this
  # map cannot use SSO at all (backend defaults closed).
  domains: "noizu.com=oidc;therobotlives.com=oidc"
  # New SSO users from these domains are active immediately (others pend approval).
  autoApproveDomains: "noizu.com,therobotlives.com"
  oidc:
    issuer: "https://auth.derobot.is/application/o/therobotlearns"
  saml:
    idpMetadataUrl: ""
    spEntityId: ""
extraEnv: []
configMap:
  enabled: false
  data: {}
imagePullSecrets:
  - name: ops-registry-secret
analytics:
  ga:
    measurementId: ""
  posthog:
    key: ""
    host: "https://us.i.posthog.com"
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  cloudflareOnly: true
tls:
  enabled: true
  secretName: therobotlearns-tls
  infisical:
    enabled: true
    resyncInterval: 120
    hostAPI: "https://infisical.noizu.com/api"
    credentialsSecret: universal-auth-credentials
    credentialsNamespace: infra
    projectSlug: k8-infra
    envSlug: prod
    secretsPath: "/apps/tls/therobotlearns"
    crtKey: THEROBOTLEARNS_TLS_CRT
    keyKey: THEROBOTLEARNS_TLS_KEY
otel:
  enabled: false
  collectorEndpoint: "otel-collector.observability-ns.svc.cluster.local:4317"
  collectorHttpEndpoint: "http://otel-collector.observability-ns.svc.cluster.local:4318"
  serviceName: "therobotlearns"
storage:
  enabled: false
  bucket: ""
  region: "us-east-1"
  endpoint: ""
  scheme: "https://"
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
podDisruptionBudget:
  enabled: false
  minAvailable: 1
sandbox:
  enabled: false
  image: ops.noizu.com/therobotlearns.com/sandbox:latest
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    enabled: false
    size: 5Gi
    storageClass: ""
  service:
    type: ClusterIP
