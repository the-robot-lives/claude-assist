databaseChangeLog:
  - changeSet:
      id: 026-create-waitlist-signups
      author: starter-scaffold
      changes:
        - sql:
            sql: |
              CREATE TABLE waitlist_signups (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                email citext NOT NULL,
                invite_token varchar(255),
                focus varchar(64) NOT NULL,
                status varchar(20) NOT NULL DEFAULT 'waitlist',
                source varchar(255),
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );

              CREATE UNIQUE INDEX idx_waitlist_signups_email
                ON waitlist_signups(email);
              CREATE INDEX idx_waitlist_signups_status
                ON waitlist_signups(status);
      rollback:
        - sql:
            sql: DROP TABLE IF EXISTS waitlist_signups;
