databaseChangeLog:
  - changeSet:
      id: 028-create-table-lesson-plans
      author: trl
      changes:
        - sql:
            sql: |
              CREATE TABLE lesson_plans (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                project_id uuid NOT NULL REFERENCES projects(id) ON DELETE CASCADE,
                title varchar(255) NOT NULL,
                body text,
                position integer NOT NULL DEFAULT 0,
                status varchar(20) NOT NULL DEFAULT 'draft'
                  CHECK (status IN ('draft', 'active', 'completed', 'archived')),
                created_by uuid REFERENCES users(id) ON DELETE SET NULL,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
              CREATE INDEX idx_lesson_plans_project ON lesson_plans (project_id, position, inserted_at);
      rollback:
        - dropTable:
            tableName: lesson_plans

  - changeSet:
      id: 028-create-table-wiki-pages
      author: trl
      changes:
        - sql:
            sql: |
              CREATE TABLE wiki_pages (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                project_id uuid NOT NULL REFERENCES projects(id) ON DELETE CASCADE,
                title varchar(255) NOT NULL,
                slug citext NOT NULL,
                body text,
                created_by uuid REFERENCES users(id) ON DELETE SET NULL,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT uq_wiki_pages_project_slug UNIQUE (project_id, slug)
              );
              CREATE INDEX idx_wiki_pages_project ON wiki_pages (project_id, updated_at DESC);
      rollback:
        - dropTable:
            tableName: wiki_pages

  - changeSet:
      id: 028-create-table-quizzes
      author: trl
      changes:
        - sql:
            sql: |
              CREATE TABLE quizzes (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                project_id uuid NOT NULL REFERENCES projects(id) ON DELETE CASCADE,
                title varchar(255) NOT NULL,
                description text,
                created_by uuid REFERENCES users(id) ON DELETE SET NULL,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
              CREATE INDEX idx_quizzes_project ON quizzes (project_id, inserted_at);
      rollback:
        - dropTable:
            tableName: quizzes

  - changeSet:
      id: 028-create-table-quiz-questions
      author: trl
      changes:
        - sql:
            sql: |
              CREATE TABLE quiz_questions (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                quiz_id uuid NOT NULL REFERENCES quizzes(id) ON DELETE CASCADE,
                position integer NOT NULL DEFAULT 0,
                prompt text NOT NULL,
                answer text,
                choices jsonb NOT NULL DEFAULT '[]',
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
              CREATE INDEX idx_quiz_questions_quiz ON quiz_questions (quiz_id, position);
      rollback:
        - dropTable:
            tableName: quiz_questions

