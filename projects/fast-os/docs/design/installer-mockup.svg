<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Inter, SF Pro, system-ui, sans-serif">
  <defs>
    <style>
      .t1{fill:#FAFAFA}.t2{fill:#A3A3A3}.t3{fill:#525252}
      .accent{fill:#7C3AED}.warn{fill:#FACC15}
      .mono{font-family:'JetBrains Mono',monospace}
      .cap{font-size:10px;letter-spacing:.08em}
    </style>
  </defs>
  <rect width="1000" height="720" fill="#0A0A0A"/>

  <!-- step thread -->
  <g transform="translate(360,40)">
    <circle class="t3" cx="0" cy="0" r="4" fill="#525252"/>
    <circle cx="60" cy="0" r="4" fill="#525252"/>
    <circle cx="120" cy="0" r="4" fill="#525252"/>
    <circle class="accent" cx="180" cy="0" r="6"/>
    <circle cx="240" cy="0" r="4" fill="#525252"/>
    <text class="t2" x="150" y="26" font-size="11">Step 4 of 5 · Review Plan</text>
  </g>

  <!-- title -->
  <text class="t1" x="90" y="120" font-size="30" font-weight="600">Review the plan</text>
  <text class="t2" x="90" y="150" font-size="15">Nothing has been written yet. These are the exact operations fast-os will perform.</text>

  <!-- plain-language summary -->
  <rect x="90" y="176" width="820" height="60" rx="8" fill="#141414" stroke="#262626"/>
  <text class="t2 cap" x="108" y="200">SUMMARY</text>
  <text class="t1" x="108" y="222" font-size="14">Erase 1 disk · create encrypted fastfs pool · mirror /home across 2 disks · install bootloader</text>

  <!-- staged operations (the plan preview) -->
  <rect x="90" y="252" width="820" height="250" rx="8" fill="#141414" stroke="#262626"/>
  <text class="t2 cap" x="108" y="278">STAGED OPERATIONS — journaled to flight recorder</text>
  <g class="mono" font-size="12.5">
    <text class="t3" x="108" y="308">1</text><text class="t1" x="132" y="308">partition.create  nvme0  GPT: ESP + fastfs</text><text class="t3" x="660" y="308">cap: write nvme0</text>
    <text class="t3" x="108" y="334">2</text><text class="t1" x="132" y="334">fastfs.mkpool     nvme0,nvme1  --encrypt</text><text class="t3" x="660" y="334">cap: write nvme0,nvme1</text>
    <text class="t3" x="108" y="360">3</text><text class="t1" x="132" y="360">fastfs.policy     /home  mirror:2</text><text class="t3" x="660" y="360">cap: admin pool</text>
    <text class="t3" x="108" y="386">4</text><text class="t1" x="132" y="386">image.copy        root subvolume  → pool</text><text class="t3" x="660" y="386">cap: read image</text>
    <text class="accent" x="108" y="412">5</text><text class="accent" x="132" y="412">boot.install      UEFI  → ESP</text><text class="t3" x="660" y="412">effectful</text>
    <line x1="108" y1="430" x2="892" y2="430" stroke="#262626"/>
    <text class="t2" x="108" y="456">est. 38 s · warm-reboot on completion</text>
    <text class="t3" x="640" y="456">⌘⏎ dry-run (no writes)</text>
  </g>

  <!-- warning + destructive gate -->
  <rect x="90" y="520" width="820" height="52" rx="8" fill="#2A2410" stroke="#FACC15" stroke-width="1"/>
  <text class="warn" x="112" y="551" font-size="13">⚠  nvme0 (Samsung 990 · 2 TB) will be erased. This cannot be undone.</text>

  <!-- buttons -->
  <g transform="translate(90,600)">
    <rect x="0" y="0" width="120" height="46" rx="8" fill="none" stroke="#262626"/>
    <text class="t2" x="30" y="29" font-size="14">Esc  Back</text>

    <rect x="540" y="0" width="280" height="46" rx="8" fill="#7C3AED"/>
    <text x="566" y="29" font-size="14" font-weight="600" fill="#fff">Erase nvme0 &amp; Install  ⏎</text>
  </g>

  <text class="t3" x="90" y="690" font-size="11">The one destructive gate. Reuses the OS's staged-effects approval UI — the same pattern that governs every agent action.</text>
</svg>
