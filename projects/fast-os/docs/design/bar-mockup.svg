<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Inter, SF Pro, system-ui, sans-serif">
  <defs>
    <style>
      .t1{fill:#FAFAFA}.t2{fill:#A3A3A3}.t3{fill:#525252}
      .accent{fill:#7C3AED}.mono{font-family:'JetBrains Mono',monospace}
      .cap{font-size:10px;letter-spacing:.08em}
    </style>
  </defs>
  <rect width="1000" height="640" fill="#0A0A0A"/>
  <!-- dimmed desktop behind -->
  <rect width="1000" height="640" fill="#000" opacity=".45"/>

  <!-- the Bar -->
  <g transform="translate(180,90)">
    <rect x="0" y="0" width="640" height="470" rx="14" fill="#141414" stroke="#262626"/>

    <!-- input -->
    <text class="accent mono" x="26" y="52" font-size="20">›</text>
    <text class="t1" x="52" y="52" font-size="20">compress logs older than a week</text>
    <rect class="accent" x="380" y="36" width="2" height="22"/>
    <line x1="0" y1="76" x2="640" y2="76" stroke="#262626"/>

    <!-- lane: INTENT (matched, expanded with plan preview) -->
    <text class="accent cap" x="26" y="100">INTENT · will plan &amp; stage</text>
    <rect x="16" y="110" width="608" height="118" rx="8" fill="#1A1A1A" stroke="#7C3AED" stroke-width="1.5"/>
    <text class="t1" x="30" y="132" font-size="13">Plan preview — 3 Tool Bus calls</text>
    <g class="mono" font-size="11.5">
      <text class="t2" x="30" y="156">1  fs.find /var/log --older-than 7d          <tspan class="t3">[cap: read /var/log]</tspan></text>
      <text class="t2" x="30" y="176">2  fs.compress {matches} --zstd              <tspan class="t3">[cap: write /var/log]</tspan></text>
      <text class="accent" x="30" y="196">3  schedule.weekly this-plan                 <tspan class="t3">[effectful → approve]</tspan></text>
    </g>
    <rect x="30" y="206" width="150" height="14" rx="3" fill="#7C3AED" opacity=".18"/>
    <text class="accent" x="38" y="217" font-size="10">⏎ approve &amp; run</text>
    <text class="t3" x="196" y="217" font-size="10">esc to edit · ⌘⏎ dry-run</text>

    <!-- other lanes, ranked below -->
    <text class="t2 cap" x="26" y="264">LAUNCH</text>
    <g font-size="13">
      <text class="t1" x="30" y="288">📦 Logs viewer</text>
      <text class="t3 mono" x="560" y="288">app</text>
    </g>

    <text class="t2 cap" x="26" y="320">FIND</text>
    <g font-size="13">
      <text class="t1" x="30" y="344">🗎 nginx access.log</text><text class="t3 mono" x="540" y="344">2.3 GB</text>
      <text class="t1" x="30" y="370">🗎 postgres config — last week</text><text class="t3 mono" x="520" y="370">memoryd</text>
    </g>

    <text class="t2 cap" x="26" y="402">COMMAND</text>
    <g font-size="13">
      <text class="t1" x="30" y="426">⌘ split right · move to Scene 2 · add mirror redundancy here</text>
    </g>

    <!-- footer -->
    <line x1="0" y1="446" x2="640" y2="446" stroke="#262626"/>
    <text class="t3" x="26" y="463" font-size="11">One keystroke — ⌘Space — launch · find · command · intent, ranked together</text>
  </g>

  <text class="t3" x="180" y="590" font-size="12">The Bar replaces Start menu + Spotlight + command palette + agent prompt.</text>
  <text class="t3" x="180" y="610" font-size="11">Reflex model (&lt;50ms) classifies each keystroke into a lane; every lane tags its authority before you commit.</text>
</svg>
