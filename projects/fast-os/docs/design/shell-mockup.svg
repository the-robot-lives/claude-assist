<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Inter, SF Pro, system-ui, sans-serif">
  <defs>
    <style>
      .bg{fill:#0A0A0A}.surf{fill:#141414}.surf2{fill:#1A1A1A}
      .bd{fill:none;stroke:#262626;stroke-width:1}
      .accent{fill:#7C3AED}.accentbd{fill:none;stroke:#7C3AED;stroke-width:2}
      .t1{fill:#FAFAFA}.t2{fill:#A3A3A3}.t3{fill:#525252}
      .mono{font-family:'JetBrains Mono',monospace}
      .cap{font-size:11px;letter-spacing:.05em}
    </style>
  </defs>

  <rect class="bg" width="1280" height="800"/>

  <!-- status thread (top-right) -->
  <g transform="translate(1040,18)">
    <text class="t2 mono" x="0" y="12" font-size="12">09:41</text>
    <text class="t2" x="58" y="12" font-size="12">net</text>
    <circle class="accent" cx="104" cy="8" r="4"/>
    <text class="t2" x="114" y="12" font-size="12">2 agents</text>
    <rect x="196" y="1" width="44" height="15" rx="3" fill="#7C3AED" opacity=".18"/>
    <text class="accent" x="203" y="12" font-size="10">● REC</text>
  </g>

  <!-- scene ribbon (top edge) -->
  <g transform="translate(40,14)">
    <rect class="surf2" x="0" y="0" width="150" height="22" rx="5"/>
    <rect class="accentbd" x="0" y="0" width="150" height="22" rx="5"/>
    <text class="t1" x="12" y="15" font-size="12">kernel-hacking</text>
    <text class="t2" x="172" y="15" font-size="12">invoice-review</text>
    <text class="t2" x="300" y="15" font-size="12">morning-triage</text>
    <text class="t3" x="430" y="15" font-size="12">+ new scene</text>
  </g>

  <!-- tiled layout: dev preset (editor 60% + terminal + logs) -->
  <!-- editor tile (focused, accent ring) -->
  <g transform="translate(40,60)">
    <rect class="surf" x="0" y="0" width="700" height="560" rx="8"/>
    <rect class="accentbd" x="0" y="0" width="700" height="560" rx="8"/>
    <rect class="accent" x="16" y="16" width="3" height="18"/>
    <text class="t2 cap" x="30" y="29">EDITOR — main.rs</text>
    <g class="mono" font-size="12.5">
      <text class="t3" x="24" y="70">  1</text><text class="accent" x="54" y="70">#[no_mangle]</text>
      <text class="t3" x="24" y="92">  2</text><text class="t1" x="54" y="92">pub extern "C" fn kmain(dtb: *const u8) -> ! {</text>
      <text class="t3" x="24" y="114">  3</text><text class="t2" x="54" y="114">    detect_console(dtb);</text>
      <text class="t3" x="24" y="136">  4</text><text class="t2" x="54" y="136">    kprintln!("fast-os phase-0");</text>
      <text class="t3" x="24" y="158">  5</text><text class="t1" x="54" y="158">}</text>
    </g>
    <!-- agent progress underline -->
    <rect class="accent" x="0" y="556" width="240" height="3" rx="1.5"/>
  </g>

  <!-- terminal tile -->
  <g transform="translate(756,60)">
    <rect class="surf" x="0" y="0" width="484" height="330" rx="8"/>
    <rect class="bd" x="0" y="0" width="484" height="330" rx="8"/>
    <text class="t2 cap" x="20" y="29">TERMINAL — fsh</text>
    <g class="mono" font-size="12.5">
      <text class="accent" x="20" y="66">fsh></text><text class="t1" x="66" y="66">make</text>
      <text class="t2" x="20" y="90">[fast-os] building kernel...</text>
      <text class="t2" x="20" y="114">[fast-os] image: fast-os.img</text>
      <text class="accent" x="20" y="146">fsh></text><text class="t1" x="66" y="146">_</text>
    </g>
  </g>

  <!-- logs tile -->
  <g transform="translate(756,406)">
    <rect class="surf" x="0" y="0" width="484" height="214" rx="8"/>
    <rect class="bd" x="0" y="0" width="484" height="214" rx="8"/>
    <text class="t2 cap" x="20" y="29">LOGS — kernel</text>
    <g class="mono" font-size="11.5">
      <text class="t2" x="20" y="60">boot-to-banner: 41 ms · EL1</text>
      <text class="t2" x="20" y="82">console: virtio-console (Apple VZ)</text>
      <text class="t2" x="20" y="104">console detected, fsh0 ready</text>
    </g>
  </g>

  <!-- hint rail (bottom, dimmable) -->
  <g transform="translate(40,650)">
    <rect class="surf2" x="0" y="0" width="1200" height="38" rx="8"/>
    <g font-size="12">
      <rect class="bd" x="16" y="9" width="70" height="20" rx="4"/><text class="t2 mono" x="24" y="23">⌘ Space</text>
      <text class="t2" x="96" y="23">Bar</text>
      <rect class="bd" x="150" y="9" width="74" height="20" rx="4"/><text class="t2 mono" x="158" y="23">⌘ H J K L</text>
      <text class="t2" x="234" y="23">Focus tile</text>
      <rect class="bd" x="330" y="9" width="46" height="20" rx="4"/><text class="t2 mono" x="338" y="23">⌘ L</text>
      <text class="t2" x="386" y="23">Layout preset</text>
      <rect class="bd" x="500" y="9" width="52" height="20" rx="4"/><text class="t2 mono" x="508" y="23">⌘ Tab</text>
      <text class="t2" x="562" y="23">Switch Scene</text>
      <rect class="bd" x="690" y="9" width="42" height="20" rx="4"/><text class="t2 mono" x="698" y="23">⌘ F</text>
      <text class="t2" x="742" y="23">Focus mode</text>
      <text class="t3" x="1090" y="23">⌘ /  all keys</text>
    </g>
  </g>

  <text class="t3" x="40" y="720" font-size="12">Scene "kernel-hacking" · layout preset: dev · violet = focus / accent / agent activity</text>
  <text class="t3" x="40" y="740" font-size="11">Minimal Tech · accent #7C3AED · no dock, no taskbar — everything is ⌘Space or a keybind</text>
</svg>
