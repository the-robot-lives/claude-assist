[package]
name = "fastfs"
version = "0.1.0"
edition = "2021"
description = "Userspace reference implementation of the fast-os native filesystem"

# Zero dependencies — std only. The on-disk format and algorithms here are the
# reference the eventual in-kernel (no_std) fastfs will be ported from.

[[bin]]
name = "fastfs-tool"
path = "src/bin/fastfs_tool.rs"

[lib]
name = "fastfs"
path = "src/lib.rs"

[profile.release]
opt-level = 3
