# NOTE: build from the kernel/ directory (or via the top-level Makefile)
# so the relative -Tlink.ld path resolves.
[build]
target = "aarch64-unknown-none"

[target.aarch64-unknown-none]
rustflags = [
  "-C", "relocation-model=pic",
  "-C", "link-arg=-pie",
  "-C", "link-arg=--no-dynamic-linker",
  "-C", "link-arg=-znotext",
  "-C", "link-arg=-Tlink.ld",
  "-C", "link-arg=--gc-sections",
]
