<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — The Copacetic Accord</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="https://accords.derobot.is/{{SLUG}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="article">
<meta property="og:url" content="https://accords.derobot.is/{{SLUG}}">
<style>
  :root{
    --bg:#faf9f6; --ink:#1c1b18; --muted:#6b675e; --line:#e4e1d8;
    --card:#ffffff; --accent:#0e6e5c; --gold:#b08d2f; --code:#f1efe8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12110f; --ink:#ece9e2; --muted:#9a958a; --line:#2a2822;
      --card:#1b1a17; --accent:#2fa48c; --gold:#d4b35a; --code:#201f1b;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:17px/1.7 Georgia,'Times New Roman',serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:0 22px}
  header.masthead{border-bottom:1px solid var(--line)}
  .masthead .bar{display:flex;justify-content:space-between;align-items:center;padding:18px 0;flex-wrap:wrap;gap:10px}
  .masthead .logo{font-family:'Helvetica Neue',Arial,sans-serif;font-weight:700;letter-spacing:.08em;font-size:14px;text-transform:uppercase;text-decoration:none;color:var(--ink)}
  .masthead .logo span{color:var(--accent)}
  .masthead nav a{font-family:'Helvetica Neue',Arial,sans-serif;font-size:12.5px;letter-spacing:.05em;color:var(--muted);text-decoration:none;margin-left:18px}
  .masthead nav a:hover,.masthead nav a.active{color:var(--accent)}
  .doc-head{padding:58px 0 34px;border-bottom:1px solid var(--line);text-align:center}
  .doc-head .kicker{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
  .doc-head h1{font-size:clamp(30px,4.6vw,44px);line-height:1.15;font-weight:500;margin-bottom:14px}
  .doc-head .subtitle{color:var(--muted);font-style:italic;font-size:18px;max-width:52ch;margin:0 auto 18px}
  .doc-head .byline{font-family:'Helvetica Neue',Arial,sans-serif;font-size:13px;color:var(--muted);letter-spacing:.04em}
  .doc-head .byline b{color:var(--ink);font-weight:600}
  article{padding:44px 0 72px}
  article h2{font-size:26px;font-weight:600;margin:52px 0 18px;line-height:1.25}
  article h2:first-child{margin-top:0}
  article h3{font-size:20px;font-weight:600;margin:38px 0 14px}
  article h4{font-size:17px;font-weight:600;margin:30px 0 12px;font-family:'Helvetica Neue',Arial,sans-serif}
  article p{margin:0 0 18px}
  article ul,article ol{margin:0 0 18px 26px}
  article li{margin-bottom:8px}
  article em{font-style:italic}
  article blockquote{border-left:3px solid var(--accent);padding:6px 0 6px 22px;margin:26px 0;color:var(--muted);font-style:italic}
  article hr{border:0;border-top:1px solid var(--line);margin:46px auto;width:38%}
  article table{width:100%;border-collapse:collapse;margin:26px 0;font-size:15px;display:block;overflow-x:auto}
  article th,article td{border:1px solid var(--line);padding:9px 13px;text-align:left;vertical-align:top}
  article th{font-family:'Helvetica Neue',Arial,sans-serif;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--code)}
  article code{font:14px/1.6 ui-monospace,'SF Mono',Menlo,monospace;background:var(--code);padding:1px 6px;border-radius:3px}
  article pre{background:var(--code);border:1px solid var(--line);border-radius:6px;padding:18px 20px;overflow-x:auto;margin:26px 0}
  article pre code{background:none;padding:0;font-size:13.5px}
  article a{color:var(--accent)}
  .link-card{display:block;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px 26px;margin:34px 0;text-decoration:none;color:var(--ink)}
  .link-card:hover{border-color:var(--accent)}
  .link-card .lc-kicker{font-family:'Helvetica Neue',Arial,sans-serif;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
  .link-card .lc-title{font-size:18px;font-weight:600}
  .link-card .lc-sub{font-size:14px;color:var(--muted);margin-top:4px}
  footer{border-top:1px solid var(--line);padding:26px 0 46px;font-family:'Helvetica Neue',Arial,sans-serif;font-size:12.5px;color:var(--muted)}
  footer .frow{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
  footer a{color:var(--muted)}
  footer a:hover{color:var(--accent)}
</style>
</head>
<body>
<header class="masthead"><div class="wrap"><div class="bar">
  <a class="logo" href="/">The Copacetic <span>Accord</span></a>
  <nav>
    <a href="/the-accord" class="{{ACTIVE_ACCORD}}">The Accord</a>
    <a href="/manifesto" class="{{ACTIVE_MANIFESTO}}">Manifesto</a>
    <a href="/building-the-accord" class="{{ACTIVE_BUILDING}}">Building It</a>
    <a href="/signatures" class="{{ACTIVE_SIGNATURES}}">Signatures</a>
  </nav>
</div></div></header>

<div class="doc-head"><div class="wrap">
  <div class="kicker">{{KICKER}}</div>
  <h1>{{TITLE}}</h1>
  <p class="subtitle">{{SUBTITLE}}</p>
  <p class="byline"><b>Keith Brings</b> · Noizu Labs</p>
</div></div>

<article><div class="wrap">
{{CONTENT}}
</div></article>

<footer><div class="wrap"><div class="frow">
  <div>© 2026 Keith Brings · Noizu Labs — text of the Accord released for reference and adoption</div>
  <div><a href="https://noizu.com/papers">noizu.com/papers</a> · <a href="/signatures">Adopt the Accord</a></div>
</div></div></footer>
</body>
</html>
