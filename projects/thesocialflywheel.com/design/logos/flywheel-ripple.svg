<svg width="420" height="132" viewBox="0 0 420 132" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flywheel — Ripple logo">
  <defs>
    <radialGradient id="ripple-drop" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6fe3e6"/>
      <stop offset="70%" stop-color="#10b3b8"/>
      <stop offset="100%" stop-color="#0a8f93"/>
    </radialGradient>
  </defs>

  <!-- Logomark: concentric ripples, coral counter-current on the outer ring -->
  <g transform="translate(66 66)">
    <circle cx="0" cy="0" r="48" stroke="#ff6b5e" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="0" r="36" stroke="#1d9bf0" stroke-width="2.4" opacity="0.7"/>
    <circle cx="0" cy="0" r="23" stroke="#10b3b8" stroke-width="3" opacity="0.92"/>
    <circle cx="0" cy="0" r="10" fill="url(#ripple-drop)"/>
  </g>

  <!-- Wordmark -->
  <text x="132" y="62" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="40" font-weight="700" letter-spacing="-0.025em" fill="#0a2a2d">Flywheel</text>
  <text x="133" y="92" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="14.5" font-weight="600" letter-spacing="0.14em" fill="#6f9092">DROP. TRAVEL. RETURN.</text>
</svg>
