<svg width="420" height="132" viewBox="0 0 420 132" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flywheel — Orbit logo">
  <defs>
    <radialGradient id="orbit-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#aef3ff"/>
      <stop offset="60%" stop-color="#3ce0ff"/>
      <stop offset="100%" stop-color="#1fb4e6"/>
    </radialGradient>
    <filter id="orbit-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Logomark: orbital field -->
  <g transform="translate(66 66)" filter="url(#orbit-glow)">
    <ellipse cx="0" cy="0" rx="46" ry="20" stroke="#8b7bff" stroke-width="2.4" opacity="0.9" transform="rotate(-24)"/>
    <ellipse cx="0" cy="0" rx="46" ry="20" stroke="#5b6b9e" stroke-width="2" opacity="0.55" transform="rotate(34)"/>
    <circle cx="0" cy="0" r="12.5" fill="url(#orbit-core)"/>
    <circle cx="38" cy="-19" r="6.5" fill="#ffd166"/>
    <circle cx="-40" cy="14" r="4" fill="#8b7bff"/>
  </g>

  <!-- Wordmark -->
  <text x="132" y="62" font-family="'Space Grotesk','Inter',sans-serif" font-size="40" font-weight="600" letter-spacing="-0.02em" fill="#0b0f1e">Flywheel</text>
  <text x="133" y="92" font-family="'Space Grotesk','Inter',sans-serif" font-size="14.5" font-weight="500" letter-spacing="0.16em" fill="#6b749b">PEOPLE IN ORBIT</text>
</svg>
