vars:
  groups:
    - name: "Seed Colors"
      vars:
        white: "#fbf7ef"      # warm cream — lightest neutral
        black: "#161310"      # near-black ink — darkest neutral
        red: "#e5337a"        # PRIMARY accent — magenta circle (you / common ground)
        blue: "#4733e5"        # SECONDARY accent — indigo circle (difference)
        yellow: "#f2a900"      # TERTIARY accent — amber circle (the overlap/serendipity)

    - name: "Semantic Colors"
      vars:
        success: "#2bb673"
        warning: "#f2a900"
        error: "#e5337a"
        info: "#4733e5"

    - name: "Typography"
      vars:
        font-sans: "'Sora', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif"
        font-mono: "'Space Mono', 'JetBrains Mono', monospace"

    - name: "Shape"
      vars:
        radius: "20px"        # bold, confident rounding; circles everywhere
