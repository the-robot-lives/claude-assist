name: "Flywheel"
logo-text: "FLYWHEEL"
font-url: "https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
logo-style:
  font: "var(--font-sans)"
  color: "var(--text)"
  # Three overlapping translucent circles (Venn); intersections darken into the "lens" of serendipity.
  html: '<div style="display:inline-flex;align-items:center;gap:11px"><svg width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="13" cy="14" r="9" fill="var(--red)" opacity="0.72"/><circle cx="21" cy="14" r="9" fill="var(--blue)" opacity="0.62"/><circle cx="17" cy="22" r="9" fill="var(--yellow)" opacity="0.62"/></svg><span style="font-family:var(--font-sans);font-size:21px;font-weight:700;letter-spacing:-0.03em;line-height:1;color:currentColor">Flywheel</span></div>'
intent: "Bold-expressive system built on the Venn diagram as core metaphor. Saturated circle hues overlap on a warm cream field; the darkened intersection is the visual hook — the place where common ground meets difference. Big shapes, confident type, generous radius."
perception: "Energetic, optimistic, and a bit daring — a network that celebrates difference instead of hiding from it."
audience: "Expressive, opinion-forward users and creators who want a platform with a point of view and personality."
tone: "Punchy, witty, and humane. 'You and someone unlike you, in the same circle.'"
keywords:
  - Overlap
  - Venn
  - Difference
  - Common-ground
  - Serendipity
  - Bold
intro:
  title: "Flywheel — Commons"
  subtitle: "WHERE YOUR CIRCLES OVERLAP"
  version: "v0.1.0"
  date: "2026-06-26"
  colors:
    - "#e5337a"
    - "#4733e5"
    - "#f2a900"
    - "#2bb673"
