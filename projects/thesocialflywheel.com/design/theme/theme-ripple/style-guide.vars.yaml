vars:
  groups:
    - name: "Seed Colors"
      vars:
        white: "#f6fbfb"      # sea-foam white — lightest neutral
        black: "#0a2a2d"      # deep teal ink — darkest neutral
        red: "#10b3b8"        # PRIMARY accent — teal (the drop / your ripple)
        blue: "#1d9bf0"        # SECONDARY accent — clear-water blue (mutuals)
        yellow: "#ffc94d"      # TERTIARY accent — sunlight gold (discovery)

    - name: "Semantic Colors"
      vars:
        success: "#1bbf89"
        warning: "#f6b73c"
        error: "#ff6b5e"       # coral — doubles as the opposing-view counter-current
        info: "#1d9bf0"

    - name: "Typography"
      vars:
        font-sans: "'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif"
        font-mono: "'JetBrains Mono', 'Menlo', monospace"

    - name: "Shape"
      vars:
        radius: "18px"         # soft, rounded, buoyant — full circular feel
