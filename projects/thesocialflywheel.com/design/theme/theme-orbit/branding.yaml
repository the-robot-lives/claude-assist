  # Concentric orbital rings + a core node (you) and an orbiting mutual.
  html: '<div style="display:inline-flex;align-items:center;gap:11px"><svg width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg"><ellipse cx="17" cy="17" rx="15" ry="7" stroke="currentColor" stroke-width="1.3" opacity="0.45" transform="rotate(32 17 17)"/><ellipse cx="17" cy="17" rx="15" ry="7" stroke="var(--blue)" stroke-width="1.6" opacity="0.85" transform="rotate(-24 17 17)"/><circle cx="17" cy="17" r="4.4" fill="var(--red)"/><circle cx="17" cy="17" r="4.4" fill="var(--red)" opacity="0.35" style="filter:none"/><circle cx="29.5" cy="11.5" r="2.6" fill="var(--yellow)"/></svg><span style="font-family:var(--font-sans);font-size:21px;font-weight:600;letter-spacing:-0.02em;line-height:1;color:currentColor">Flywheel</span></div>'
intent: "Cosmic Nocturne system: render the mutuals web as a living orbital field. Concentric rings encode degrees of separation; luminous nodes are people; motion implies gravity. Dark canvas makes accent light do the talking."
perception: "Calm, intelligent, and a little awe-inspiring — like looking at a map of your own galaxy of connections."
audience: "Curious, design-literate social users who find echo chambers boring and want a network that feels exploratory and alive."
tone: "Quietly confident and spatial. 'Your world has gravity. Watch it grow.'"
keywords:
  - Orbit
  - Gravity
  - Degrees
  - Luminous
  - Explore
  - Nocturne
