# Normative layout constants shared by ALL scene compilers (Elixir
# Ithkuil.Scene, python reference, web/src/scene.js). Values recorded from
# web/src/scene.js (the JS twin); the Elixir and Python compilers MUST use
# these same constants so conformance/scene_graph.jsonl vectors agree.
#
# Geometry model (see web/src/scene.js header):
#   marker  p_i = c + dir(theta_i) * marker_r * k     (socket indicator circle)
#   orbit   q_i = c + dir(theta_i) * orbit_r * k      (orbit box center)
#   ray     c -> q_i                                  (radial connector)
# where theta_i = socket angle (sockets.yaml) + parent orientation, and
# k = child_factor ** depth shrinks each recursion level.
# Socket angles are FIXED: empty sockets draw nothing; occupied sockets
# never move.

schema_version: 1
status: verified # against web/src/scene.js (2026-07-17)
stability: "An integer ID is never reassigned; removed elements become reserved IDs."

units: SVG user units (y-down)

constants:
  base_r:             {value: 40,  source: scene.js BASE_R,             note: "base glyph half-extent"}
  anchor_r:           {value: 46,  source: scene.js ANCHOR_R,           note: "compact attachment radius from center"}
  marker_r:           {value: 64,  source: scene.js MARKER_R,           note: "exploded socket-marker radius"}
  orbit_r:            {value: 118, source: scene.js ORBIT_R,            note: "exploded orbit-box center radius"}
  box_half:           {value: 26,  source: scene.js BOX_HALF,           note: "exploded orbit-box half-size"}
  child_factor:       {value: 0.5, source: scene.js CHILD_FACTOR,       note: "per-depth shrink; k = child_factor ** depth"}
  compact_mod_scale:  {value: 0.5, source: scene.js COMPACT_MOD_SCALE,  note: "modifier scale, compact projection"}
  exploded_mod_scale: {value: 1.4, source: scene.js EXPLODED_MOD_SCALE, note: "modifier scale, exploded projection"}
  diac_ring_compact:  {value: 18,  source: scene.js DIAC_RING_COMPACT,  note: "diacritic orbit radius around modifier, compact"}
  diac_ring_exploded: {value: 36,  source: scene.js DIAC_RING_EXPLODED, note: "diacritic orbit radius around modifier, exploded"}
  compact_advance:    {value: 130, source: scene.js COMPACT_ADVANCE,    note: "glyph-to-glyph x advance, compact"}
  exploded_advance:   {value: 400, source: scene.js EXPLODED_ADVANCE,   note: "glyph-to-glyph x advance, exploded"}
  view_box_pad:       {value: 18,  source: scene.js PAD,                note: "viewBox padding on all sides"}

diacritic_slots:
  # Diacritic j on a modifier occupies fixed 45-degree slots around the
  # modifier's local center, starting straight up (SVG -90 deg) and rotating
  # with the modifier's orientation:
  #   slot_angle(j) = -90 + j * 45 + modifier_orientation_degrees
  start_degrees: -90
  step_degrees: 45
  slot_count: 8

derived_rules:
  - "Exploded socket marker radius: max(2.5, 4 * k)."
  - "Compact diacritic scale: max(0.5, 0.8 * k); exploded: max(0.5, k)."
  - "Bounds: base extends BASE_R + 8; compact modifier extends (16 + diac_ring_compact) * k + 8; exploded orbit extends box_half + diac_ring_exploded * k + 10; marker extends 6."
  - "Empty-scene fallback viewBox: [-60, -60, 120, 120]."
