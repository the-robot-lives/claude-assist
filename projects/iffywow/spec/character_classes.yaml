# Character classes of the New Ithkuil script.
# Source: A Grammar of New Ithkuil, Ch. 12 "The Writing System"
# (https://ithkuil.net/newithkuil_12_script.htm — Dec 2022 spec reconciled
# with the 2023-02-15 Grammar Design v1.3.2 amendments) and Ch. 13 "Numbers".
# Cross-checked against the pinned toolkit's script module layout
# (github.com/zsakowitz/ithkuil: script/{primary,secondary,tertiary,
# quaternary,bias,register,alphabetic,other}).

schema_version: 1
status: verified # classes 0-6 per Ch. 12; numeral per Ch. 13 (inventory not enumerated here); word_break per toolkit only
stability: "An integer ID is never reassigned; removed elements become reserved IDs."

character_classes:
  - id: 0
    name: primary
    description: >-
      Word-initial character of a formative. Encodes Relation/Concatenation
      status, Stem, Specification, Function, Context, Version, and the full
      Ca complex (Configuration, Extension, Affiliation, Perspective,
      Essence). Sec. 12.1.
  - id: 1
    name: secondary
    description: >-
      Consonantal characters built from a core shape plus top/bottom
      extensions. Used for the Slot III root (Cr), Slot V Cs affixes, and —
      rotated 180 degrees — Slot VII Cs affixes, specialized Cs-roots, and
      specialized personal-reference roots. Sec. 12.2-12.2.4.
  - id: 2
    name: tertiary
    description: >-
      Composite character placed after all secondary characters. Indicates
      Valence (core) with Aspect/Phase/Effect/Level segments above and below.
      Sec. 12.3.
  - id: 3
    name: quaternary
    description: >-
      Character following any tertiary character. Displays Vc Case or Vk
      Illocution+Validation via top/bottom extensions on a vertical bar;
      Mood (superposed) and Case-Scope (underposed) via diacritics; also
      case-accessor / case-stacking constructions. Sec. 12.4.
  - id: 4
    name: bias
    description: >-
      Standalone characters for the 60 Bias adjuncts, placed sentence-initial
      or sentence-final. Sec. 12.5.
  - id: 5
    name: register
    description: >-
      Paired marks placed before/after a phrase to show Register; each
      register has four modes (plain, alphabetic/proper-name, Transcriptive,
      Transliterative). Sec. 12.6-12.6.1.
  - id: 6
    name: alphabetic
    description: >-
      Alphabetic writing of proper names and foreign words using secondary
      characters, the placeholder character, vowel diacritics, and the
      stress bar. Sec. 12.7.
  - id: 7
    name: numeral
    description: >-
      Numerical characters described in Ch. 13 "Numbers".
      # TODO verify glyph inventory against https://ithkuil.net/newithkuil_13_numbers.htm
  - id: 8
    name: word_break
    description: >-
      Word/line break helper used by the pinned toolkit renderer
      (script/other/break). Not an official Ch. 12 character class.
      # TODO verify against the Dec 2022 "A Writing System for New Ithkuil" PDF punctuation section

reserved_ids: []
