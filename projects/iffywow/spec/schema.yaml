# iffywow spec — registry schema manifest.
# The YAML files in spec/ are the single source of truth for enum inventories,
# socket geometry, and glyph shape registries. enums.ex / enums.py /
# element-names.json are GENERATED from these files — never hand-edit outputs.

schema_version: 1
status: draft

stability_rules: |
  An integer ID is never reassigned; removed elements become reserved IDs.

  Corollaries:
    - New elements are appended with the next free integer ID.
    - Renames keep the ID; the old name may be recorded as an alias.
    - A removed element's ID is listed under `reserved_ids` in its file and is
      never reused for a different meaning.
    - Reordering a YAML file is a cosmetic change only; IDs, not positions,
      are canonical.

registries:
  - sockets.yaml
  - orientations.yaml
  - character_classes.yaml
  - bases.yaml
  - modifiers.yaml
  - diacritics.yaml
  - morphology/cases.yaml
  - morphology/aspects.yaml
  - morphology/biases.yaml
  - morphology/valences.yaml
  - morphology/phases.yaml
  - morphology/effects.yaml
  - morphology/levels.yaml
  - morphology/moods.yaml
  - morphology/case_scopes.yaml
  - morphology/illocutions.yaml
  - morphology/validations.yaml
  - morphology/ca_categories.yaml
  - morphology/formative_categories.yaml
  - morphology/affix_meta.yaml
  - morphology/registers.yaml
  - geometry/attachment_points.yaml

sources:
  official_grammar: "https://ithkuil.net/ — A Grammar of New Ithkuil (chapters 1-13 + appendices)"
  writing_system: "https://ithkuil.net/newithkuil_12_script.htm — Ch. 12, The Writing System (Dec 2022 spec, reconciled with the 2023-02-15 Grammar Design v1.3.2 amendments)"
  design_doc: "https://www.ithkuil.net/New_Ithkuil_design_doc_v_1_3.pdf (v1.3.2, 2023-02-15)"
  pinned_toolkit: "https://github.com/zsakowitz/ithkuil (MIT; pinned reference, not a floating authority)"
