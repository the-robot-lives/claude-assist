# Base (core) shape registry — Secondary-character cores of the New Ithkuil
# script.
#
# Inventory: the 28 standard consonantal cores ("The 28 forms below are the
# 'core' characters" — grammar Ch. 12, Sec. 12.2), plus the special cores the
# script needs (placeholder, alphabetic placeholder, tonal placeholder,
# stressed-syllable bar, bias core), as digitized by the pinned MIT toolkit
# (github.com/zsakowitz/ithkuil, script/secondary/core.tsx CORES).
#
# ids 0-27: the 28 standard cores, in the toolkit's stable key order.
# ids 28-32: special cores.
#
# `ascii` is the codegen-safe identifier. `path: null` entries use the
# deterministic generated placeholder path (web/src/registry.js basePath(id))
# until the official path is digitized into spec/geometry/; the digitized
# source for each shape is named in `source`.

schema_version: 1
status: verified # count + membership per Ch. 12 Sec. 12.2 and pinned toolkit (2026-07-17)
stability: "An integer ID is never reassigned; removed elements become reserved IDs."

