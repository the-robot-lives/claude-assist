# Modifier shape registry — Secondary-character EXTENSIONS of the New Ithkuil
# script (grammar Ch. 12, Sec. 12.2.1: extensions applied to the top end of a
# core prefix a consonant; to the bottom end, suffix one).
#
# Inventory and order follow the pinned MIT toolkit
# (github.com/zsakowitz/ithkuil, script/secondary/extension.tsx EXTENSIONS),
# which digitizes the official figures. Each extension has three positional
# path variants (vert / diag / horiz) chosen by the connection direction of
# the core it attaches to; this registry assigns one ID per extension, not
# per variant.
#
# `path: null` entries use the deterministic generated placeholder path
# (web/src/registry.js modifierPath(id)) until the official paths are
# digitized into spec/geometry/.
#
# NOTE: the official Sec. 12.2.1 figures are images; membership below is
# verified against the pinned toolkit. # TODO verify figure-order against
# https://ithkuil.net/newithkuil_12_script.htm Sec. 12.2.1 images

schema_version: 1
status: verified # membership per pinned toolkit (2026-07-17); official figure order unconfirmed
stability: "An integer ID is never reassigned; removed elements become reserved IDs."

