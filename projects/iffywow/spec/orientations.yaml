# Orientation registry — quarter-turn rotations applied to glyphs/modifiers.
# Matches web/src/registry.js orientationDegrees(id) = ((id % 4) + 4) % 4 * 90.
#
# The writing system requires 180-degree rotation for Slot VII secondary
# characters (grammar Ch. 12, Sec. 12.2.3); the full 4-step set keeps the
# coordinate space regular and future-proof.

schema_version: 1
status: verified # against web/src/registry.js (2026-07-17)
stability: "An integer ID is never reassigned; removed elements become reserved IDs."

orientations:
  - {id: 0, name: identity,   degrees: 0}
  - {id: 1, name: rotate_90,  degrees: 90}
  - {id: 2, name: rotate_180, degrees: 180}
  - {id: 3, name: rotate_270, degrees: 270}

reserved_ids: []
