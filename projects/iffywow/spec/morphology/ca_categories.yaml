# The Ca complex of New Ithkuil: Configuration, Extension, Affiliation,
# Perspective, Essence — each with its values in grammar-table order.
# Source: A Grammar of New Ithkuil, Ch. 3 "Basic Morphology"; verified via
# pinned toolkit generate/ca/{configuration,extension,affiliation,
# perspective,essence}.ts.
#
# IDs are scoped per category (each category's values count from 0).

schema_version: 1
status: verified
stability: "An integer ID is never reassigned; removed elements become reserved IDs."

