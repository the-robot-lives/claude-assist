# The 9 illocutions of New Ithkuil, in grammar-table order (ASR first;
# Validation applies only under ASR).
# Source: A Grammar of New Ithkuil, Ch. 5/6 (Vk Illocution table); verified
# via pinned toolkit ALL_ILLOCUTIONS / ILLOCUTION_TO_NAME_MAP
# (generate/formative/slot-9/illocution.ts).

schema_version: 1
status: verified
stability: "An integer ID is never reassigned; removed elements become reserved IDs."

illocutions:
  - {id: 0, name: Assertive,     abbr: ASR}
  - {id: 1, name: Directive,     abbr: DIR}
  - {id: 2, name: Declarative,   abbr: DEC}
  - {id: 3, name: Interrogative, abbr: IRG}
  - {id: 4, name: Verificative,  abbr: VRF}
  - {id: 5, name: Admonitive,    abbr: ADM}
  - {id: 6, name: Potentiative,  abbr: POT}
  - {id: 7, name: Hortative,     abbr: HOR}
  - {id: 8, name: Conjectural,   abbr: CNJ}

reserved_ids: []
