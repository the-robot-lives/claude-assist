# Bias adjuncts of New Ithkuil, in official table (alphabetical-by-abbr)
# order.
# Source: A Grammar of New Ithkuil, Ch. 8 "Adjuncts", Sec. 8.5
# (https://ithkuil.net/newithkuil_08_adjuncts.htm); cross-checked against
# the pinned toolkit's ALL_BIAS_ADJUNCTS (generate/adjunct/bias.ts).
#
# COUNT NOTE: the official Sec. 8.5 table contains exactly 61 biases
# (ACC through VEX). The pre-amendment EXPERIENTIAL (EXP) bias was renamed
# MANIFESTIVE (MNF) in the 2023-02-15 Grammar Design v1.3.2 reconciliation
# (a legacy "EXP: Experiential" key survives only in the toolkit's name map,
# with no Cbb form). EXP is therefore recorded as an alias of MNF (id 41),
# not as its own ID.

