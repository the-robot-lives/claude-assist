  - {id: 1, name: Antecedent, abbr: CCA}
  - {id: 2, name: Subaltern,  abbr: CCS}
  - {id: 3, name: Qualifier,  abbr: CCQ}
  - {id: 4, name: Precedent,  abbr: CCP}
  - {id: 5, name: Successive, abbr: CCV}

