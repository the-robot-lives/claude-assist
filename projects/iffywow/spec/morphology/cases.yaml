# The 68 cases of New Ithkuil, in grammar-table (Vc vowel-table) order.
# Source: A Grammar of New Ithkuil, Ch. 4 "Case Morphology"
# (https://ithkuil.net/newithkuil_04_case.htm); order/abbreviations
# cross-checked against the pinned toolkit's ALL_CASES
# (generate/formative/slot-9/case.ts).
#
# The Vc table is 8 rows of 9 slots (72 slots); rows 5-8 skip degree 8, so
# the final four groups have 8 members each: 4*9 + 4*8 = 68 cases.

