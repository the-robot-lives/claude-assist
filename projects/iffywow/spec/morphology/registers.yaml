# The registers of New Ithkuil (Register adjuncts), in grammar-table order.
# Source: A Grammar of New Ithkuil, Ch. 8 Sec. 8.3
# (https://ithkuil.net/newithkuil_08_adjuncts.htm); verified via pinned
# toolkit REGISTER_ADJUNCT_TO_NAME_MAP (generate/adjunct/register.ts).
#
# NRR is the default, unmarked register. Each marked register has paired
# start/end adjunct forms (e.g. DSV: ha ... hai); END has only a final form
# (hü). In the script, each register mark has four modes (plain, alphabetic,
# Transcriptive, Transliterative — grammar Sec. 12.6).

schema_version: 1
status: verified
stability: "An integer ID is never reassigned; removed elements become reserved IDs."

registers:
  - {id: 0, name: Narrative,       abbr: NRR, note: "default; unmarked"}
  - {id: 1, name: Discursive,      abbr: DSV, note: "direct speech"}
  - {id: 2, name: Parenthetical,   abbr: PNT, note: "parenthetical aside"}
  - {id: 3, name: Specificative,   abbr: SPF, note: "proper name of preceding referent"}
  - {id: 4, name: Exemplificative, abbr: EXM, note: "'for example, ...'"}
  - {id: 5, name: Cogitant,        abbr: CGT, note: "silent/subjective thoughts"}
  - {id: 6, name: Carrier-End,     abbr: END, note: "end of term/phrase governed by carrier stem/adjunct"}

reserved_ids: []
