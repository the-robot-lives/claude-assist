# The 9 levels of New Ithkuil, in Vn table order.
# Source: A Grammar of New Ithkuil, Ch. 5/6 (Vn Level table); verified via
# pinned toolkit ALL_LEVELS / LEVEL_TO_NAME_MAP
# (generate/formative/slot-8/level.ts). Note the toolkit changelog: the
# Deficient level's official abbreviation is DFT (an early toolkit release
# briefly used DFC and reverted).

schema_version: 1
status: verified
stability: "An integer ID is never reassigned; removed elements become reserved IDs."

levels:
  - {id: 0, name: Minimal,       abbr: MIN}
  - {id: 1, name: Subequative,   abbr: SBE}
  - {id: 2, name: Inferior,      abbr: IFR}
  - {id: 3, name: Deficient,     abbr: DFT}
  - {id: 4, name: Equative,      abbr: EQU}
  - {id: 5, name: Surpassive,    abbr: SUR}
  - {id: 6, name: Superlative,   abbr: SPL}
  - {id: 7, name: Superequative, abbr: SPQ}
  - {id: 8, name: Maximal,       abbr: MAX}

reserved_ids: []
