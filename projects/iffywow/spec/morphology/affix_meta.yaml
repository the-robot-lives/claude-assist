# Affix machinery metadata for New Ithkuil VxCs affixes: affix types, degrees,
# and affixual-adjunct scopes.
# Sources: A Grammar of New Ithkuil, Ch. 7 "Affixes" (types, degrees) and
# Ch. 8 Sec. 8.1 "Affixual Adjuncts" (scopes,
# https://ithkuil.net/newithkuil_08_adjuncts.htm); scopes verified via pinned
# toolkit ALL_AFFIXUAL_ADJUNCT_SCOPES (generate/adjunct/affixual/scope.ts).
#
# IDs are scoped per category (each category's values count from 0).

schema_version: 1
status: verified
stability: "An integer ID is never reassigned; removed elements become reserved IDs."

affix_types: # marked in script by superposed diacritics: T2 = dot, T3 = bar (grammar Sec. 12.2.2)
  - {id: 0, name: Type One,   abbr: T1}
  - {id: 1, name: Type Two,   abbr: T2}
  - {id: 2, name: Type Three, abbr: T3}

degrees: # id == degree number; shown in script by underposed diacritics (grammar Sec. 12.2.2)
  - {id: 0, name: Degree Zero,  abbr: D0}
  - {id: 1, name: Degree One,   abbr: D1}
  - {id: 2, name: Degree Two,   abbr: D2}
  - {id: 3, name: Degree Three, abbr: D3}
  - {id: 4, name: Degree Four,  abbr: D4}
  - {id: 5, name: Degree Five,  abbr: D5}
  - {id: 6, name: Degree Six,   abbr: D6}
  - {id: 7, name: Degree Seven, abbr: D7}
  - {id: 8, name: Degree Eight, abbr: D8}
  - {id: 9, name: Degree Nine,  abbr: D9}

affix_scopes: # affixual-adjunct scope values (grammar Sec. 8.1.1 Vs table)
  - {id: 0, name: Last of Slot V,       abbr: "V:DOM",
     note: "applies to stem only; scope over all Slot V affixes"}
  - {id: 1, name: First of Slot V,      abbr: "V:SUB",
     note: "applies to stem only; subordinate to all Slot V affixes"}
  - {id: 2, name: Last of Slot VII,     abbr: "VII:DOM",
     note: "applies to stem + Ca; scope over all Slot VII affixes"}
  - {id: 3, name: First of Slot VII,    abbr: "VII:SUB",
     note: "applies to stem + Ca; subordinate to all Slot VII affixes"}
  - {id: 4, name: Entire Formative,     abbr: FORMATIVE,
     note: "scope over the formative as a whole (Valence, Mood/Case, Illocution/Validation, ...)"}
  - {id: 5, name: Formative and Adjacent Adjuncts, abbr: ADJACENT,
     note: "scope over the formative plus adjacent adjuncts incl. modular adjuncts"}
