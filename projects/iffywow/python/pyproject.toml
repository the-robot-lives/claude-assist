[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ithkuil"
version = "0.1.0"
description = "iffywow New Ithkuil coordinate SDK - Python REFERENCE codec (test oracle for the Elixir production codec)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Noizu Labs" }]
# Stdlib only. The reference codec must stay trivially auditable; do not add
# runtime dependencies. pytest is the sole dev dependency.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["ithkuil*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
