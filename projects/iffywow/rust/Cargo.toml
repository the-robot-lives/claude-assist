[package]
name = "ithkuil"
version = "0.1.0"
edition = "2021"
description = "iffywow New Ithkuil codec — core conversions only (codec-v1 bytes/integers, wire JSON, romanization profile core-v1)"

# Dependency-light per SDK-INTERFACE.md §4: num-bigint for arbitrary-precision
# integers, serde_json for the wire JSON boundary. Nothing else.
[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
serde_json = "1"
