openapi: 3.1.0
info:
  title: Billing Noizu Platform API
  version: 0.1.0
  description: Shared contract for Billing Noizu web, iOS, Android, and macOS clients.
servers:
  - url: https://billing.noizu.com/api
paths:
  /workspaces/{workspaceId}/summary:
    get:
      summary: Receivables summary
      operationId: getReceivablesSummary
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Current receivables summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceivablesSummary"
  /workspaces/{workspaceId}/invoices:
    get:
      summary: List invoices
      operationId: listInvoices
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, sent, viewed, partially_paid, paid, overdue, void, written_off]
        - name: customer
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Invoice list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invoice"
    post:
      summary: Create draft invoice
      operationId: createDraftInvoice
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceRequest"
      responses:
        "201":
          description: Draft invoice created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
  /workspaces/{workspaceId}/invoices/{invoiceId}:
    get:
      summary: View invoice
      operationId: getInvoice
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: Invoice detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceDetail"
  /workspaces/{workspaceId}/invoices/{invoiceId}/send:
    post:
      summary: Send invoice
      operationId: sendInvoice
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/InvoiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendInvoiceRequest"
      responses:
        "202":
          description: Invoice send accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingEvent"
  /workspaces/{workspaceId}/payment-methods:
    get:
      summary: List payment methods
      operationId: listPaymentMethods
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Configured payment methods
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentMethod"
    post:
      summary: Configure payment method
      operationId: configurePaymentMethod
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigurePaymentMethodRequest"
      responses:
        "202":
          description: Payment method configuration accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethod"
  /workspaces/{workspaceId}/payments:
    get:
      summary: List payments
      operationId: listPayments
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: invoiceId
          in: query
          schema:
            type: string
        - name: provider
          in: query
          schema:
            $ref: "#/components/schemas/PaymentProvider"
      responses:
        "200":
          description: Payment history
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Payment"
    post:
      summary: Record payment
      operationId: recordPayment
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPaymentRequest"
      responses:
        "201":
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
  /workspaces/{workspaceId}/notifications/preferences:
    get:
      summary: Get notification preferences
      operationId: getNotificationPreferences
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
components:
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        type: string
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          description: Minor currency units.
        currency:
          type: string
          minLength: 3
          maxLength: 3
    ReceivablesSummary:
      type: object
      required: [workspaceId, outstanding, overdue, paidThisMonth, collectionRiskCount]
      properties:
        workspaceId:
          type: string
        outstanding:
          $ref: "#/components/schemas/Money"
        overdue:
          $ref: "#/components/schemas/Money"
        paidThisMonth:
          $ref: "#/components/schemas/Money"
        collectionRiskCount:
          type: integer
    Invoice:
      type: object
      required: [id, number, customerName, status, total, balanceDue, dueDate]
      properties:
        id:
          type: string
        number:
          type: string
        customerName:
          type: string
        status:
          type: string
          enum: [draft, sent, viewed, partially_paid, paid, overdue, void, written_off]
        total:
          $ref: "#/components/schemas/Money"
        balanceDue:
          $ref: "#/components/schemas/Money"
        dueDate:
          type: string
          format: date
    InvoiceDetail:
      allOf:
        - $ref: "#/components/schemas/Invoice"
        - type: object
          required: [lineItems, paymentMethods, events]
          properties:
            lineItems:
              type: array
              items:
                $ref: "#/components/schemas/InvoiceLineItem"
            paymentMethods:
              type: array
              items:
                $ref: "#/components/schemas/PaymentProvider"
            events:
              type: array
              items:
                $ref: "#/components/schemas/BillingEvent"
    InvoiceLineItem:
      type: object
      required: [description, quantity, unitPrice, total]
      properties:
        description:
          type: string
        quantity:
          type: number
        unitPrice:
          $ref: "#/components/schemas/Money"
        total:
          $ref: "#/components/schemas/Money"
    CreateInvoiceRequest:
      type: object
      required: [customerId, lineItems]
      properties:
        customerId:
          type: string
        projectId:
          type: string
        lineItems:
          type: array
          items:
            type: object
            required: [description, quantity, unitPrice]
            properties:
              description:
                type: string
              quantity:
                type: number
              unitPrice:
                $ref: "#/components/schemas/Money"
    SendInvoiceRequest:
      type: object
      required: [recipientEmail, subject, message, paymentProviders]
      properties:
        recipientEmail:
          type: string
          format: email
        subject:
          type: string
        message:
          type: string
        paymentProviders:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PaymentProvider"
        requireHumanApproval:
          type: boolean
          default: true
    PaymentProvider:
      type: string
      enum: [stripe, paypal, ach, manual]
    PaymentMethod:
      type: object
      required: [id, provider, label, state]
      properties:
        id:
          type: string
        provider:
          $ref: "#/components/schemas/PaymentProvider"
        label:
          type: string
        state:
          type: string
          enum: [ready, not_connected, needs_review, disabled]
        webhookEndpoint:
          type: string
          format: uri
        publicPaymentInstructions:
          type: string
    ConfigurePaymentMethodRequest:
      type: object
      required: [provider, label]
      properties:
        provider:
          $ref: "#/components/schemas/PaymentProvider"
        label:
          type: string
        webhookEndpoint:
          type: string
          format: uri
        publicPaymentInstructions:
          type: string
    Payment:
      type: object
      required: [id, invoiceId, provider, amount, receivedAt, status]
      properties:
        id:
          type: string
        invoiceId:
          type: string
        provider:
          $ref: "#/components/schemas/PaymentProvider"
        amount:
          $ref: "#/components/schemas/Money"
        receivedAt:
          type: string
          format: date-time
        processorReference:
          type: string
        status:
          type: string
          enum: [pending, settled, failed, reversed]
        note:
          type: string
    RecordPaymentRequest:
      type: object
      required: [invoiceId, provider, amount, receivedAt]
      properties:
        invoiceId:
          type: string
        provider:
          $ref: "#/components/schemas/PaymentProvider"
        amount:
          $ref: "#/components/schemas/Money"
        receivedAt:
          type: string
          format: date-time
        processorReference:
          type: string
        note:
          type: string
    BillingEvent:
      type: object
      required: [id, type, occurredAt]
      properties:
        id:
          type: string
        type:
          type: string
        occurredAt:
          type: string
          format: date-time
    NotificationPreferences:
      type: object
      required: [overdue, paymentReceived, sendFailed, approvalNeeded]
      properties:
        overdue:
          type: boolean
        paymentReceived:
          type: boolean
        sendFailed:
          type: boolean
        approvalNeeded:
          type: boolean
