rubric:
  scoring_scale: 1-10
  dimensions:
    complexity: Higher means larger implementation scope, more systems, more content, more platforms, or harder technology.
    monetization: Higher means stronger ethical revenue fit for the concept and audience.
    novelty: Higher means more differentiated mechanics, fantasy, or market position.
    marketability: Higher means clearer audience, pitch, genre demand, and store-page legibility.
    prototype_fit: Higher means easier to validate with a focused small prototype.
    production_risk: Higher means more schedule, content, technical, compliance, or live-ops risk.
  grade_formula: Rewards novelty, marketability, monetization, and prototype fit; penalizes complexity and production risk.
  grades:
    A: Prioritize for prototype or stage promotion.
    B: Worth keeping warm; needs scope control or a sharper vertical slice.
    C: Interesting but currently heavy, risky, or under-positioned.
    D: Park unless a strategic reason emerges.
