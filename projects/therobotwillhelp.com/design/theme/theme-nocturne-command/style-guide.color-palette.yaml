color-palette:
  - group: Brand
    description: Dark command palette using cyan signal, magenta danger, and phosphor yellow review states.
    colors:
      - name: Signal Cyan
        value: "var(--brand-blue)"
      - name: Alarm Magenta
        value: "var(--brand-red)"
      - name: Phosphor Yellow
        value: "var(--brand-yellow)"
      - name: Command Violet
        value: "var(--brand-secondary)"
  - group: Semantic
    description: High-contrast dark-mode states for dense operations consoles.
    colors:
      - name: Approved
        value: "var(--success)"
      - name: Needs Review
        value: "var(--warning)"
      - name: Blocked
        value: "var(--error)"
      - name: Running
        value: "var(--info)"

