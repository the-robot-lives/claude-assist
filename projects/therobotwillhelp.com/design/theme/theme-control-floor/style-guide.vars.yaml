vars:
  groups:
    - name: Surfaces
      vars:
        white: "#f7fafc"
        off-white: "#edf2f7"
        gray-50: "#f7fafc"
        gray-100: "#edf2f7"
        gray-200: "#e2e8f0"
        gray-300: "#cbd5e1"
        gray-400: "#94a3b8"
        gray-500: "#64748b"
        gray-600: "#475569"
        gray-700: "#334155"
        gray-800: "#1e293b"
        gray-900: "#0f172a"
        black: "#0b1120"

    - name: Brand
      vars:
        brand-red: "#d94645"
        brand-blue: "#1f5eff"
        brand-yellow: "#f2a900"
        brand-red-light: "rgba(217, 70, 69, 0.12)"
        brand-blue-light: "rgba(31, 94, 255, 0.12)"
        brand-blue-mid: "rgba(31, 94, 255, 0.32)"
        brand-yellow-light: "rgba(242, 169, 0, 0.16)"
        brand-primary: "#1f5eff"
        brand-secondary: "#0f766e"
        brand-accent: "#f2a900"

    - name: Semantic
      vars:
        success: "#0f9f6e"
        success-tint: "rgba(15, 159, 110, 0.12)"
        warning: "#b7791f"
        warning-tint: "rgba(183, 121, 31, 0.14)"
        error: "#c2413b"
        error-tint: "rgba(194, 65, 59, 0.12)"
        info: "#2563eb"
        info-tint: "rgba(37, 99, 235, 0.12)"
        running: "#2563eb"
        blocked: "#c2413b"
        review: "#b7791f"
        approved: "#0f9f6e"

    - name: Typography
      vars:
        font-sans: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-mono: "'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace"
        font-display: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-body: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size-base: "15px"
        font-size-xs: "12px"
        font-size-sm: "13px"
        font-size-md: "15px"
        font-size-lg: "18px"
        font-size-xl: "22px"
        font-size-2xl: "28px"
        font-size-3xl: "36px"
        font-size-display: "48px"
        line-height-base: "1.55"
        line-height-heading: "1.12"
        letter-spacing-tight: "0"

    - name: Layout
      vars:
        unit: "8px"
        radius: "6px"
        radius-sm: "4px"
        radius-md: "6px"
        radius-lg: "8px"
        col-gap: "16px"
        page-max-width: "1280px"
        panel-padding: "20px"

    - name: Cards
      vars:
        card-background: "#ffffff"
        card-border-color: "#cbd5e1"
        card-hover-background: "#f8fafc"
        card-header-background: "#f8fafc"
        card-footer-background: "#f1f5f9"
        card-accent-color: "#1f5eff"
        card-tag-color: "#475569"
        card-separator-style: "solid"
        card-separator-color: "#cbd5e1"
        card-rounded-radius: "6px"

    - name: Buttons
      vars:
        btn-font-family: "var(--font-sans)"
        btn-font-weight: "600"
        btn-font-size: "13px"
        btn-background: "#1f5eff"
        btn-color: "#ffffff"
        btn-border-color: "#1f5eff"
        btn-hover-background: "#1646c8"
        btn-outline-background: "#ffffff"
        btn-outline-color: "#1f5eff"
        btn-outline-hover-background: "rgba(31, 94, 255, 0.08)"

    - name: Forms
      vars:
        input-background: "#ffffff"
        input-border-color: "#cbd5e1"
        input-focus-border-color: "#1f5eff"
        input-color: "#0f172a"
        input-placeholder-color: "#64748b"

