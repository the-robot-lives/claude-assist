typography:
  - var: font-sans
    name: Nunito
    description: Rounded, human, and informal without becoming childish.
    usage: Landing copy, friendly setup flows, robot cards, and review surfaces.
    weights: [400, 600, 700, 800]
  - var: font-mono
    name: Space Mono
    description: Friendly technical accent that keeps IDs and traces readable.
    usage: Robot IDs, small status metadata, and compact command labels.
    weights: [400, 700]

typography-classes:
  - name: Display
    class: typography-display
    font-family: "var(--font-display)"
    font-size: "var(--font-size-display)"
    font-weight: "800"
    line-height: "1.02"
    letter-spacing: "0"
  - name: H1
    class: typography-h1
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-3xl)"
    font-weight: "800"
    line-height: "1.08"
    letter-spacing: "0"
  - name: H2
    class: typography-h2
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-2xl)"
    font-weight: "800"
    line-height: "1.15"
  - name: Body
    class: typography-body
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-md)"
    font-weight: "400"
    line-height: "1.65"
  - name: Code
    class: typography-code
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-sm)"
    font-weight: "400"
    line-height: "1.6"
  - name: Label
    class: typography-label
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-xs)"
    font-weight: "800"
    line-height: "1.35"
    letter-spacing: "0.03em"
    text-transform: "uppercase"

