typography:
  - var: font-sans
    name: IBM Plex Sans Condensed
    description: Narrow technical sans for dense command surfaces and high information throughput.
    usage: Dashboards, headers, compact panes, queue views, and status-heavy UI.
    weights: [400, 500, 600, 700]
  - var: font-mono
    name: JetBrains Mono
    description: Engineering monospace for terminal-like command and trace surfaces.
    usage: Logs, event streams, code, message hashes, and debug panels.
    weights: [400, 500, 700]

typography-classes:
  - name: Display
    class: typography-display
    font-family: "var(--font-display)"
    font-size: "var(--font-size-display)"
    font-weight: "700"
    line-height: "1"
    letter-spacing: "0"
  - name: H1
    class: typography-h1
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-3xl)"
    font-weight: "700"
    line-height: "1"
    letter-spacing: "0"
  - name: H2
    class: typography-h2
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-2xl)"
    font-weight: "600"
    line-height: "1.08"
  - name: Body
    class: typography-body
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-md)"
    font-weight: "400"
    line-height: "1.5"
  - name: Code
    class: typography-code
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-sm)"
    font-weight: "400"
    line-height: "1.55"
  - name: Label
    class: typography-label
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-xs)"
    font-weight: "700"
    line-height: "1.25"
    letter-spacing: "0.04em"
    text-transform: "uppercase"

