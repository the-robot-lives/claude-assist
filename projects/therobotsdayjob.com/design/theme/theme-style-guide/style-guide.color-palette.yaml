color-palette:
  - group: Brand
    description: Base reference colors for the shared style guide.
    colors:
      - name: Brand Red
        value: "var(--brand-red)"
      - name: Brand Blue
        value: "var(--brand-blue)"
      - name: Brand Yellow
        value: "var(--brand-yellow)"
      - name: Brand Red Light
        value: "var(--brand-red-light)"
      - name: Brand Blue Light
        value: "var(--brand-blue-light)"
      - name: Brand Yellow Light
        value: "var(--brand-yellow-light)"

  - group: Semantic
    description: Status and feedback colors.
    colors:
      - name: Success
        value: "var(--success)"
      - name: Warning
        value: "var(--warning)"
      - name: Error
        value: "var(--error)"
      - name: Info
        value: "var(--info)"

  - group: Surfaces
    description: Neutral surfaces and text foundations.
    colors:
      - name: White
        value: "var(--white)"
      - name: Off White
        value: "var(--off-white)"
      - name: Gray 100
        value: "var(--gray-100)"
      - name: Gray 300
        value: "var(--gray-300)"
      - name: Gray 600
        value: "var(--gray-600)"
      - name: Gray 900
        value: "var(--gray-900)"
      - name: Black
        value: "var(--black)"

