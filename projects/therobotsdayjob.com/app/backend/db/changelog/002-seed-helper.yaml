databaseChangeLog:
  - changeSet:
      id: create-table-seed-helper-seeds
      author: starter-scaffold
      changes:
        - createTable:
            tableName: seed_helper_seeds
            columns:
              - column:
                  name: seed
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: inserted_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: seed_helper_seeds
            columnNames: seed, version
            constraintName: seed_helper_seeds_pkey
      rollback:
        - dropTable:
            tableName: seed_helper_seeds
  - changeSet:
      id: create-table-seed-helper-handles
      author: starter-scaffold
      changes:
        - createTable:
            tableName: seed_helper_handles
            columns:
              - column:
                  name: handle
                  type: varchar(255)
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: value
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: inserted_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: seed_helper_handles
