color-palette:
  - group: Brand
    description: Warm service-product palette with coral primary, teal support, and sunny accents.
    colors:
      - name: Robot Coral
        value: "var(--brand-red)"
      - name: Friendly Teal
        value: "var(--brand-blue)"
      - name: Shift Bell Yellow
        value: "var(--brand-yellow)"
      - name: Paper Surface
        value: "var(--surface)"
  - group: Semantic
    description: Human-readable status colors tuned for approachable review queues.
    colors:
      - name: Approved
        value: "var(--success)"
      - name: Needs Review
        value: "var(--warning)"
      - name: Blocked
        value: "var(--error)"
      - name: Running
        value: "var(--info)"

