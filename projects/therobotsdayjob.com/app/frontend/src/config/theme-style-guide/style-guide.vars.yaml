vars:
  groups:
    - name: Surfaces
      vars:
        white: "#ffffff"
        off-white: "#fafafa"
        gray-50: "#f5f5f5"
        gray-100: "#eeeeee"
        gray-200: "#e0e0e0"
        gray-300: "#bdbdbd"
        gray-400: "#9e9e9e"
        gray-500: "#757575"
        gray-600: "#616161"
        gray-700: "#424242"
        gray-800: "#212121"
        gray-900: "#121212"
        black: "#000000"

    - name: Brand
      vars:
        brand-red: "#e20613"
        brand-blue: "#0047ab"
        brand-yellow: "#f5c518"
        brand-red-light: "rgba(226, 6, 19, 0.12)"
        brand-blue-light: "rgba(0, 71, 171, 0.12)"
        brand-blue-mid: "rgba(0, 71, 171, 0.28)"
        brand-yellow-light: "rgba(245, 197, 24, 0.18)"

    - name: Semantic
      vars:
        success: "#059669"
        success-tint: "rgba(5, 150, 105, 0.12)"
        warning: "#d97706"
        warning-tint: "rgba(217, 119, 6, 0.12)"
        error: "#e11d48"
        error-tint: "rgba(225, 29, 72, 0.12)"
        info: "#0047ab"
        info-tint: "rgba(0, 71, 171, 0.12)"

    - name: Typography
      vars:
        font-sans: "'Space Grotesk', -apple-system, sans-serif"
        font-mono: "'IBM Plex Mono', Menlo, monospace"
        font-size-base: "16px"
        font-size-xs: "12px"
        font-size-sm: "14px"
        font-size-md: "16px"
        font-size-lg: "20px"
        font-size-xl: "24px"
        font-size-2xl: "32px"
        font-size-3xl: "40px"
        font-size-display: "56px"
        line-height-base: "1.55"

    - name: Grid & Spacing
      vars:
        unit: "8px"
        radius: "4px"
        col-gap: "16px"
        page-max-width: "1280px"

    - name: Base
      vars:
        base-font-family: "var(--font-sans)"
        base-font-color: "var(--text)"
        base-background: "var(--surface)"
        base-line-height: "var(--line-height-base)"
        base-font-size: "var(--font-size-base)"

    - name: Cards
      vars:
        card-background: "var(--surface)"
        card-border-color: "var(--border)"
        card-footer-font-size: "var(--font-size-xs)"
        card-footer-font-weight: "500"
        card-separator-style: "dotted"
        card-separator-color: "var(--border-strong)"
        card-tag-color: "var(--text-secondary)"

    - name: Buttons
      vars:
        btn-font-family: "var(--font-sans)"
        btn-font-weight: "600"
        btn-font-size: "14px"
        btn-background: "var(--brand-blue)"
        btn-color: "#ffffff"
        btn-border-color: "var(--brand-blue)"
        btn-hover-background: "#003a8c"

    - name: Toggle
      vars:
        sg-section-title-font-family: "var(--font-sans)"
        sg-section-title-color: "var(--text)"
        sg-section-number-bg: "var(--brand-blue-light)"
        sg-section-number-color: "var(--brand-blue)"

    - name: "HUI: Focus & Interaction"
      vars:
        hui-focus-ring-color: "rgba(0, 71, 171, 0.28)"
        hui-focus-ring-width: "2px"

    - name: "HUI: Trigger Buttons"
      vars:
        hui-trigger-bg: "var(--surface)"
        hui-trigger-border: "var(--border)"
        hui-trigger-border-hover: "var(--border-strong)"
        hui-trigger-color: "var(--text)"

    - name: "HUI: Showcase Grid"
      vars:
        hui-showcase-accent: "var(--brand-blue)"
        hui-showcase-bg: "var(--surface-alt)"
        hui-showcase-border: "var(--border)"
        hui-showcase-cell-bg: "var(--surface)"
        hui-showcase-cell-border: "var(--border)"
        hui-showcase-label-color: "var(--text-muted)"

