vars:
  groups:
    - name: "Seed Colors"
      vars:
        white: "#E0E0E0"
        black: "#0C0C0C"
        red: "#00D4AA"
        blue: "#6366F1"
        yellow: "#F59E0B"

    - name: "Semantic Colors"
      vars:
        success: "#00D4AA"
        warning: "#F59E0B"
        error: "#EF4444"
        info: "#6366F1"

    - name: "Typography"
      vars:
        font-sans: "'Inter', -apple-system, BlinkMacSystemFont, sans-serif"
        font-mono: "'JetBrains Mono', 'Fira Code', 'Menlo', monospace"

    - name: "Shape"
      vars:
        radius: "4px"
