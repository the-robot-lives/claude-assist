typography:
  - family: "DM Sans"
    var: "--font-sans"
    weights: [400, 500, 600, 700]
    description: "Primary typeface — rounded, open letterforms that feel warm and approachable"

  - family: "DM Serif Display"
    var: "--font-serif"
    weights: [400]
    description: "Pull quotes and accent text — adds gravitas without formality"

  - family: "DM Mono"
    var: "--font-mono"
    weights: [400, 500]
    description: "Code, structured data, epoch labels"

typography-classes:
  - name: "Display"
    size: "clamp(2.25rem, 5vw, 3.5rem)"
    weight: 700
    family: "var(--font-sans)"
    line-height: 1.15
    usage: "Landing hero, major statements"

  - name: "Heading 1"
    size: "clamp(1.75rem, 3vw, 2.25rem)"
    weight: 700
    family: "var(--font-sans)"
    line-height: 1.2
    usage: "Page titles, section headers"

  - name: "Heading 2"
    size: "clamp(1.25rem, 2vw, 1.625rem)"
    weight: 600
    family: "var(--font-sans)"
    line-height: 1.3
    usage: "Subsection headers, article titles"

  - name: "Body"
    size: "1.0625rem"
    weight: 400
    family: "var(--font-sans)"
    line-height: 1.7
    usage: "Accord text, blog content, explanatory text"

  - name: "Pull Quote"
    size: "1.375rem"
    weight: 400
    family: "var(--font-serif)"
    line-height: 1.5
    font-style: "italic"
    usage: "Key accord passages, testimonials, highlighted wisdom"

  - name: "Label"
    size: "0.8125rem"
    weight: 500
    family: "var(--font-sans)"
    line-height: 1.4
    usage: "Tags, epoch labels, card metadata"

  - name: "Caption"
    size: "0.875rem"
    weight: 400
    family: "var(--font-sans)"
    line-height: 1.5
    usage: "Illustration captions, footnotes, timestamps"
