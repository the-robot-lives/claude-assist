css-snippets:
  - name: "Rounded Card"
    target-section: "ui-elements"
    body: |
      html[data-design-theme="garden"] .garden-card {
        background: var(--surface-overlay);
        border: 1px solid var(--border-default);
        border-radius: var(--radius);
        padding: var(--space-5);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        transition: transform 200ms ease-out, box-shadow 200ms ease-out;
      }
      html[data-design-theme="garden"] .garden-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      }

  - name: "Epoch Growth Bar"
    target-section: "ui-elements"
    body: |
      html[data-design-theme="garden"] .epoch-bar {
        display: flex;
        align-items: center;
        gap: var(--space-4);
        padding: var(--space-4);
      }
      html[data-design-theme="garden"] .epoch-bar .epoch-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-1);
      }
      html[data-design-theme="garden"] .epoch-bar .epoch-icon {
        font-size: 1.5rem;
      }
      html[data-design-theme="garden"] .epoch-bar .epoch-label {
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--text-secondary);
      }
      html[data-design-theme="garden"] .epoch-bar .epoch-progress {
        flex: 1;
        height: 6px;
        background: var(--border-default);
        border-radius: 3px;
        overflow: hidden;
      }
      html[data-design-theme="garden"] .epoch-bar .epoch-progress .fill {
        height: 100%;
        background: var(--red);
        border-radius: 3px;
        transition: width 500ms ease-out;
      }

  - name: "Speech Bubble"
    target-section: "ui-elements"
    body: |
      html[data-design-theme="garden"] .speech-bubble {
        background: var(--surface-overlay);
        border-radius: 16px;
        padding: var(--space-4) var(--space-5);
        position: relative;
        border: 1px solid var(--border-subtle);
      }
      html[data-design-theme="garden"] .speech-bubble::after {
        content: "";
        position: absolute;
        bottom: -8px;
        left: 24px;
        width: 16px;
        height: 16px;
        background: var(--surface-overlay);
        border-right: 1px solid var(--border-subtle);
        border-bottom: 1px solid var(--border-subtle);
        transform: rotate(45deg);
      }

  - name: "Pill Navigation"
    target-section: "navigation"
    body: |
      html[data-design-theme="garden"] .pill-nav {
        display: flex;
        gap: var(--space-1);
        padding: var(--space-1);
        background: var(--surface-raised);
        border-radius: 9999px;
      }
      html[data-design-theme="garden"] .pill-nav a {
        padding: var(--space-2) var(--space-4);
        border-radius: 9999px;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--text-secondary);
        text-decoration: none;
        transition: background 150ms, color 150ms;
      }
      html[data-design-theme="garden"] .pill-nav a:hover {
        background: var(--surface-overlay);
        color: var(--text-primary);
      }
      html[data-design-theme="garden"] .pill-nav a.active {
        background: var(--red);
        color: white;
      }

  - name: "Illustration Container"
    target-section: "ui-elements"
    body: |
      html[data-design-theme="garden"] .illustration {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-8);
        background: linear-gradient(180deg, var(--surface-raised) 0%, var(--surface-base) 100%);
        border-radius: var(--radius);
        overflow: hidden;
      }

  - name: "Gentle Float-In"
    target-section: "interaction"
    body: |
      html[data-design-theme="garden"] .float-in {
        opacity: 0;
        transform: translateY(16px);
        animation: garden-float-in 400ms ease-out forwards;
      }
      @keyframes garden-float-in {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
