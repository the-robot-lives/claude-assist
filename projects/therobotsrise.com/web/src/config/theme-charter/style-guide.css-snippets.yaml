css-snippets:
  - name: "Article Section Border"
    target-section: "ui-elements"
    body: |
      html[data-design-theme="charter"] .article-section {
        border-left: 2px solid var(--red);
        padding-left: var(--space-4);
        margin-bottom: var(--space-8);
      }

  - name: "Pull Quote"
    target-section: "ui-elements"
    body: |
      html[data-design-theme="charter"] blockquote.pull-quote {
        font-family: var(--font-display);
        font-size: 1.5rem;
        font-style: italic;
        line-height: 1.5;
        border-left: 3px solid var(--red);
        padding-left: var(--space-4);
        margin: var(--space-8) 0;
        color: var(--text-secondary);
      }

  - name: "Scroll Progress Bar"
    target-section: "ui-elements"
    body: |
      html[data-design-theme="charter"] .scroll-progress {
        position: fixed;
        top: 0;
        left: 0;
        height: 3px;
        background: var(--red);
        z-index: 100;
        transition: width 50ms linear;
      }

  - name: "Seal Logo Container"
    target-section: "ui-elements"
    body: |
      html[data-design-theme="charter"] .seal-logo {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 2px solid var(--blue);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto var(--space-6);
      }

  - name: "Small Caps"
    target-section: "typography"
    body: |
      html[data-design-theme="charter"] .small-caps {
        font-variant: small-caps;
        letter-spacing: 0.1em;
        font-family: var(--font-mono);
        font-weight: 500;
      }
