color-palette:
  - group: Surfaces
    description: Neutral backgrounds, surfaces, borders, and text values. Foundation for all UI layers.
    colors:
      - name: White
        value: "#ffffff"
      - name: Off-White
        value: "#fafafa"
      - name: Gray 50
        value: "#f5f5f5"
      - name: Gray 100
        value: "#eeeeee"
      - name: Gray 200
        value: "#e0e0e0"
      - name: Gray 300
        value: "#bdbdbd"
      - name: Gray 400
        value: "#9e9e9e"
      - name: Gray 500
        value: "#757575"
      - name: Gray 600
        value: "#616161"
      - name: Gray 700
        value: "#424242"
      - name: Gray 800
        value: "#212121"
      - name: Gray 900
        value: "#121212"
      - name: Black
        value: "#000000"

  - group: Slate
    description: Blue-tinted neutrals for surfaces and backgrounds. Used by the semantic surface layer — flips in dark mode.
    colors:
      - name: Slate 50
        value: "var(--slate-50)"
      - name: Slate 100
        value: "var(--slate-100)"
      - name: Slate 200
        value: "var(--slate-200)"
      - name: Slate 300
        value: "var(--slate-300)"
      - name: Slate 400
        value: "var(--slate-400)"
      - name: Slate 500
        value: "var(--slate-500)"
      - name: Slate 600
        value: "var(--slate-600)"
      - name: Slate 700
        value: "var(--slate-700)"
      - name: Slate 800
        value: "var(--slate-800)"
      - name: Slate 900
        value: "var(--slate-900)"
      - name: Slate 950
        value: "var(--slate-950)"

  - group: Semantic Surfaces
    description: Mode-aware surface and text colors — these flip automatically in dark mode.
    colors:
      - name: Surface
        value: "var(--surface)"
      - name: Surface Alt
        value: "var(--surface-alt)"
      - name: Surface Inverse
        value: "var(--surface-inverse)"
      - name: Text
        value: "var(--text)"
      - name: Text Secondary
        value: "var(--text-secondary)"
      - name: Text Muted
        value: "var(--text-muted)"
      - name: Text Inverse
        value: "var(--text-inverse)"
      - name: Border
        value: "var(--border)"
      - name: Border Strong
        value: "var(--border-strong)"

  - group: Primaries - Bauhaus
    description: Core brand colors drawn from Bauhaus primary theory — used for accents, actions, and semantic reinforcement.
    notes:
      - swatch: "#e20613"
        label: Red
        text: "Brand accent. CTAs, active states, logo mark, error reinforcement."
      - swatch: "#0047ab"
        label: Blue
        text: "Primary actions, links, focus rings, info states."
      - swatch: "#f5c518"
        label: Yellow
        text: "Highlights, selection, featured content, warnings."
    colors:
      - name: Red
        value: "#e2061513"
      - name: Blue
        value: "#0047ab"
      - name: Yellow
        value: "#f5c518"

  - group: Semantic
    description: Functional state colors communicating system status — success, warning, error, and info.
    colors:
      - name: Success
        value: "#1a8a3f"
      - name: Warning
        value: "#c27a00"
      - name: Error
        value: "#c41a1a"
      - name: Info
        value: "#0047ab"
    notes:
      - swatch: "#1a8a3f"
        label: Success
        text: "Confirmations, published states, positive actions."
      - swatch: "#c27a00"
        label: Warning
        text: "Cautions, pending states, attention required."
      - swatch: "#c41a1a"
        label: Error
        text: "Failures, danger states, destructive actions."
      - swatch: "#0047ab"
        label: Info
        text: "Guidance, links, informational states."
