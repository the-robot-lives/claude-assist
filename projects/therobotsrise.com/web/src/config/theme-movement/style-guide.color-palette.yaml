color-palette:
  - group: "Core Palette"
    colors:
      - name: "Void Black"
        hex: "#0A0A0A"
      - name: "Card Dark"
        hex: "#1A1A1A"
      - name: "High White"
        hex: "#F5F5F5"
    notes:
      - "Maximum contrast. No gray middle ground. You are here or you are not."

  - group: "Action Colors"
    colors:
      - name: "Movement Red"
        hex: "#FF3B30"
      - name: "Gold"
        hex: "#FFD700"
    notes:
      - "Red: CTAs, urgency, the call to action — the color of movements"
      - "Gold: highlighted terms, important callouts, earned emphasis"

  - group: "Poster Mode (Alt)"
    colors:
      - name: "Poster White"
        hex: "#FFFFFF"
      - name: "Poster Black"
        hex: "#0A0A0A"
      - name: "Poster Red"
        hex: "#FF3B30"
    notes:
      - "Inverted palette for manifesto pages — white bg, black text, red accents"
      - "Mimics screen-printed protest posters"

  - group: "Semantic"
    colors:
      - name: "Success"
        hex: "#34C759"
      - name: "Warning"
        hex: "#FFD700"
      - name: "Error"
        hex: "#FF3B30"
      - name: "Info"
        hex: "#5AC8FA"
