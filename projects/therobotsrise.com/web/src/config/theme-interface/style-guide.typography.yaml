typography:
  - family: "JetBrains Mono"
    var: "--font-mono"
    weights: [400, 500, 600, 700]
    description: "Display and headings — monospace-first establishes the terminal/protocol aesthetic"

  - family: "Inter"
    var: "--font-sans"
    weights: [400, 500]
    description: "Body text — clean readability for longer content while maintaining technical feel"

typography-classes:
  - name: "Display"
    size: "clamp(2rem, 4vw, 3rem)"
    weight: 700
    family: "var(--font-mono)"
    line-height: 1.15
    usage: "> theRobotsRise title, major section names"

  - name: "Heading 1"
    size: "clamp(1.5rem, 2.5vw, 1.75rem)"
    weight: 600
    family: "var(--font-mono)"
    line-height: 1.25
    usage: "Page titles, article headers"

  - name: "Heading 2"
    size: "1.25rem"
    weight: 600
    family: "var(--font-mono)"
    line-height: 1.35
    usage: "Subsections, key-value group labels"

  - name: "Body"
    size: "1rem"
    weight: 400
    family: "var(--font-sans)"
    line-height: 1.65
    usage: "Accord text, explanatory content"

  - name: "Code"
    size: "0.875rem"
    weight: 400
    family: "var(--font-mono)"
    line-height: 1.5
    usage: "Inline terms, protocol tags, structured data blocks"

  - name: "Terminal Prompt"
    size: "0.9375rem"
    weight: 500
    family: "var(--font-mono)"
    line-height: 1.6
    usage: "Key quotes rendered in terminal-style > prompt format"

  - name: "Label"
    size: "0.75rem"
    weight: 500
    family: "var(--font-mono)"
    line-height: 1.4
    letter-spacing: "0.1em"
    text-transform: "uppercase"
    usage: "Section labels, status badges, epoch markers"
