{{- if and .Values.migrate.enabled .Values.migrate.liquibase.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hologram-start-app.fullname" . }}-liquibase
  labels:
    {{- include "hologram-start-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: liquibase
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.liquibase.backoffLimit | default 2 }}
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "hologram-start-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: liquibase
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: liquibase
        image: {{ required "migrate.liquibase.image is required when migrate.liquibase.enabled is true" .Values.migrate.liquibase.image }}
        imagePullPolicy: Always
        {{- with .Values.migrate.liquibase.command }}
        command: {{ . | toJson }}
        {{- end }}
        env:
          {{- include "hologram-start-app.liquibaseEnv" . | nindent 8 }}
          {{- with .Values.migrate.liquibase.extraEnv }}
          {{- toYaml . | nindent 8 }}
          {{- end }}
        resources:
          {{- toYaml .Values.migrate.liquibase.resources | nindent 10 }}
{{- end }}
