replicas: 0

domain: timely.noizu.com
appDomain: timely.noizu.com
cookieDomain: ".timely.noizu.com"

sandbox:
  enabled: true
  image: ops.noizu.com/timely.noizu.com/sandbox:v1.0.0
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    enabled: true
    size: 5Gi
  service:
    type: ClusterIP

backend:
  image: ops.noizu.com/timely.noizu.com/backend:v1.0.0
  port: 4000

# No separate frontend container/image (Hologram serves the UI from the
# backend process) -- port only, to satisfy service.yaml/ingress.yaml's
# shared-chart references to `.Values.frontend.port`.
frontend:
  port: 4000

migrate:
  enabled: false

database:
  host: app-timescaledb.apps.svc.cluster.local
  port: 5432
  name: timely

secrets:
  name: timely-secrets
  keys:
    dbUser: TIMELY_DB_USER
    dbPassword: TIMELY_DB_PASSWORD
    secretKeyBase: TIMELY_SECRET_KEY_BASE
    guardianSecretKey: TIMELY_GUARDIAN_SECRET_KEY
    redisUrl: TIMELY_REDIS_URL
    databaseUrl: TIMELY_DATABASE_URL
    sendgridApiKey: ""
    oidcClientId: ""
    oidcClientSecret: ""
    googleClientId: ""
    googleClientSecret: ""
    facebookClientId: ""
    facebookClientSecret: ""
    githubClientId: ""
    githubClientSecret: ""
    linkedinClientId: ""
    linkedinClientSecret: ""
    samlSpCert: ""
    samlSpKey: ""

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  cloudflareOnly: true

tls:
  enabled: true
  secretName: cloudflare-tls-synced
  infisical:
    enabled: false
