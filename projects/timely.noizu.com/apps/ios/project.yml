name: TimelyiOS

options:
  bundleIdPrefix: com.noizu.timely
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  TimelyKit:
    path: ../shared/TimelyKit

targets:
  TimelyiOS:
    type: application
    platform: iOS
    # The app target compiles the package sources directly, so the SwiftPM
    # library and the .app are always the same code. `App/` carries only the
    # @main entry point and the bundle metadata, which SwiftPM never sees.
    sources:
      - path: Sources/TimelyiOS
      - path: App
    dependencies:
      - package: TimelyKit
        product: TimelyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noizu.timely.ios
        # PRODUCT_NAME is deliberately left as the target name. Overriding it
        # renames the built binary and breaks the test bundle's TEST_HOST; the
        # name on the home screen comes from CFBundleDisplayName instead.
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        # No signing identity is provisioned in this repo; simulator builds and
        # CI compile checks do not need one. Set these for a device build.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  TimelyiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TimelyiOSTests
    dependencies:
      - target: TimelyiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noizu.timely.ios.tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TimelyiOS:
    build:
      targets:
        TimelyiOS: all
        TimelyiOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TimelyiOSTests
