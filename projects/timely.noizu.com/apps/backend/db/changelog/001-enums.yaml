databaseChangeLog:
  - changeSet:
      id: create-enum-status
      author: timely-scaffold
      changes:
        - sql:
            sql: CREATE TYPE status_enum AS ENUM ('active', 'disabled', 'suspended', 'deleted', 'other');
      rollback:
        - sql:
            sql: DROP TYPE IF EXISTS status_enum;

  - changeSet:
      id: create-enum-user-status
