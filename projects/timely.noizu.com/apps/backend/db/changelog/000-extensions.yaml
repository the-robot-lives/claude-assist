databaseChangeLog:
  - changeSet:
      id: create-extension-citext
      author: timely-scaffold
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS citext;
      rollback:
        - sql:
            sql: DROP EXTENSION IF EXISTS citext;

  - changeSet:
      id: create-extension-uuid-ossp
      author: timely-scaffold
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
      rollback:
        - sql:
            sql: DROP EXTENSION IF EXISTS "uuid-ossp";

  # postgis removed: not available in shared-postgres (Alpine timescaledb) and
  # not used by any column/function in this schema.
  - changeSet:
      id: create-extension-vector
      author: timely-scaffold
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS vector;
      rollback:
        - sql:
            sql: DROP EXTENSION IF EXISTS vector;

  - changeSet:
      id: create-extension-cube
      author: timely-scaffold
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS cube;
      rollback:
        - sql:
            sql: DROP EXTENSION IF EXISTS cube;

  - changeSet:
      id: create-extension-pg-trgm
      author: timely-scaffold
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS pg_trgm;
      rollback:
        - sql:
            sql: DROP EXTENSION IF EXISTS pg_trgm;

  - changeSet:
      id: create-extension-earthdistance
      author: timely-scaffold
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS earthdistance;
      rollback:
        - sql:
            sql: DROP EXTENSION IF EXISTS earthdistance;
