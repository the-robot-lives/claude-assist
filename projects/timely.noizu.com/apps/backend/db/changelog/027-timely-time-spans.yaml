databaseChangeLog:
  - changeSet:
      id: 027-create-table-time-spans
      author: timely-scaffold
      changes:
        - sql:
            sql: |
              -- `start` and `end` are reserved words in SQL, so the columns are
              -- start_at / end_at; the wire contract keeps `start` / `end`.
              --
              -- client_id / project_id / ticket_id are deliberately NOT database
              -- foreign keys. SYNC-PROTOCOL 6.1 step 2 requires that an at-least-once
              -- push queue be able to deliver a span before the project it names:
              -- the reference is stored as a deferred reference and reported through
              -- `unresolved_refs`, not rejected.
              CREATE TABLE time_spans (
                id uuid PRIMARY KEY,
                workspace_id uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
                title varchar(500) NOT NULL DEFAULT '',
                canonical_title text NOT NULL DEFAULT '',
                client_id uuid,
                project_id uuid,
                ticket_id uuid,
                client_name text NOT NULL DEFAULT '',
                project_name text NOT NULL DEFAULT '',
                ticket_name text NOT NULL DEFAULT '',
                start_at timestamptz NOT NULL,
                end_at timestamptz,
                source varchar(20) NOT NULL DEFAULT 'manual'
                  CHECK (source IN ('manual','timer','pomodoro')),
                is_billable boolean NOT NULL DEFAULT false,
                notes text NOT NULL DEFAULT '',
                review_state varchar(20) NOT NULL DEFAULT 'unreviewed'
                  CHECK (review_state IN ('unreviewed','needs_review','reviewed','approved','locked','disputed')),
                review_reasons jsonb NOT NULL DEFAULT '[]'::jsonb,
                derived_from_span_ids uuid[] NOT NULL DEFAULT ARRAY[]::uuid[],
                locked_at timestamptz,
                unresolved_refs jsonb NOT NULL DEFAULT '[]'::jsonb,
                created_at timestamptz NOT NULL,
                updated_at timestamptz NOT NULL,
                updated_at_effective timestamptz NOT NULL,
                server_revision bigint NOT NULL,
                deleted_at timestamptz,
                origin_device_id uuid,
                CONSTRAINT chk_time_spans_interval CHECK (end_at IS NULL OR end_at >= start_at)
              );

              CREATE INDEX idx_time_spans_sync_cursor
                ON time_spans (workspace_id, server_revision) INCLUDE (id, deleted_at);

              -- Duplicate / billing-overlap detection (SYNC-PROTOCOL 8.3) scans live
              -- spans whose start is within 24 hours of the candidate.
              CREATE INDEX idx_time_spans_live_start
                ON time_spans (workspace_id, start_at) WHERE deleted_at IS NULL;

              -- Report rollups group by project/client over a date range.
              CREATE INDEX idx_time_spans_report
                ON time_spans (workspace_id, start_at, project_id) WHERE deleted_at IS NULL;

              CREATE INDEX idx_time_spans_open
                ON time_spans (workspace_id) WHERE deleted_at IS NULL AND end_at IS NULL;
      rollback:
        - dropTable:
            tableName: time_spans
