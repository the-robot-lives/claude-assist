  /api/v1/devices/{device_id}:
    parameters:
      - $ref: '#/components/parameters/DeviceIdPath'
    patch:
      tags: [devices]
      operationId: updateDevice
      summary: Update a device's name, version, or privacy flag
      description: |
        Only the owning device may mutate its own row. Any other device receives
        `403 not_device_owner`. Included because `local_only_screenshots` is half
        of the screenshot upload gate and must be togglable from the device that
        holds the bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdate'
            examples:
              opt_in_upload:
                summary: User opts this device in to blob upload
                value:
                  local_only_screenshots: false
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/sync/changes:
    get:
      tags: [sync]
      operationId: pullChanges
      summary: Pull every row changed since a revision watermark
      description: |
        Returns all rows in the workspace whose `server_revision` is strictly
        greater than `since`, ordered by `server_revision` ascending, capped at
        `limit` rows **across all buckets combined**. Tombstones
        (`deleted_at != null`) are included and MUST be applied by the client.

        `next_cursor` is the highest gap-free committed revision represented by
        this page. The server MUST NOT advance `next_cursor` past a revision that
        may still be uncommitted, otherwise a concurrent transaction can commit
        "behind" the watermark and its row will never be delivered.

        Loop while `has_more` is true, feeding `next_cursor` back as `since`.
        `since=0` performs a full bootstrap.

        If `since` is older than `tombstone_horizon_revision` the server responds
        `410 cursor_too_old` and the client MUST re-bootstrap from 0.
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdQuery'
        - name: since
          in: query
          required: true
          description: Exclusive lower bound on `server_revision`. Use 0 to bootstrap.
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          description: Max rows returned across all buckets.
          schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
        - name: entities
          in: query
          required: false
          description: |
            Optional comma-separated bucket filter. Omit for all buckets. A
            companion that does not render vision output may pull a narrower set.
          schema:
            type: string
            examples: ["time_spans,clients,projects,tickets"]
      responses:
        '200':
          description: A page of changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesResponse'
              examples:
                incremental:
                  summary: Small incremental page with one span and its auto-created project
                  value:
                    changes:
                      clients: []
                      projects:
                        - id: 5f2a9c11-4d3b-51e6-9a77-0b1c2d3e4f50
                          workspace_id: 0192f7a1-2b44-7000-8a10-9d3e4f5a6b7c
                          name: Redesign
                          canonical_name: redesign
                          client_id: 3a1b7d02-9e44-5c11-8f20-aabbccdd0011
                          notes: ""
                          auto_created: true
                          merged_into_id: null
                          review_state: needs_review
                          created_at: 2026-07-27T09:14:02Z
                          updated_at: 2026-07-27T09:14:02Z
                          server_revision: 1902
                          deleted_at: null
