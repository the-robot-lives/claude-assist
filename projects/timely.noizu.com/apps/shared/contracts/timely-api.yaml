openapi: 3.1.0

info:
  title: Timely Sync API
  version: 1.0.0-draft.1
  summary: Offline-first sync contract for the Timely capture agent and its companion apps.
  description: |
    Timely is an evidence-backed activity ledger for interrupt-driven knowledge work.
    This document is the normative wire contract shared by three independent
    implementations:

    | Consumer | Role |
    |----------|------|
    | Elixir/Phoenix backend | Server. Assigns `server_revision`, resolves names, flags reviews. |
    | Swift package (iOS + macOS) | macOS is the **only** capture agent. iOS is a companion. |
    | Kotlin/Compose Android app | Companion only. |

    Companions perform day review, idle prompts, interval correction
    (split / merge / reassign / retitle / rebill), manual entry, and reports.
    Companions never capture screenshots and never run background capture.

    ## Privacy invariant

    Screenshot **image bytes** default to never leaving the device. Screenshot
    **metadata** always syncs. Byte upload is opt-in and gated on BOTH
    `workspace_policy.screenshot_upload_allowed` AND
    `device.local_only_screenshots == false`. Every read surface in this API is
    designed so that a client which never uploads a single byte is still fully
    functional: the recall surface for a local-only screenshot is its metadata
    plus the `vision_analysis.status_update` / `evidence` text.

    `vision_analysis.raw_response` is a verbatim model transcription of the
    screen and is treated as image-equivalent: it is withheld under the same
    double gate (see `workspace_policy.sync_vision_raw_response`).

    ## Identity and ordering

    All primary keys are client-generatable UUIDs encoded as lowercase strings.
    Event-like entities use UUIDv7. Name-keyed taxonomy entities
    (`client`, `project`, `ticket`) use a deterministic UUIDv5 so that two
    devices which auto-create the same name while offline converge on the same
    id without a server round-trip. See `docs/SYNC-PROTOCOL.md` section 6.

    The sync cursor is the per-workspace `server_revision` watermark, never wall
    clock. Client clocks skew, drift, jump across time zones, and freeze across
    laptop sleep; `updated_at` is therefore informational and advisory only.

    ## Field presence convention

    A property marked `readOnly: true` is server-owned. It is **always present in
    responses** (and is therefore listed in `required`), and MUST NOT be sent in
    request payloads - the server ignores it if you do. Clients may decode
    `readOnly` fields as non-optional.

    ## Companion documents

    - `docs/SYNC-PROTOCOL.md` - normative prose spec, conflict matrix, worked example.
    - `apps/shared/contracts/canon-fixtures.json` - executable conformance suite for
      `canon()` and the deterministic UUIDv5 taxonomy ids. **Passing it is a hard gate
      before a platform may sync.** See SYNC-PROTOCOL section 14.
    - `apps/shared/contracts/README.md` - how each client consumes these files.

    ## Relationship to the scaffold

    Authentication is provided by the `hologram-start-app` scaffold and is
    **not redefined here**: `POST /api/v1/auth/register`, `POST /api/v1/auth/login`,
    `POST /api/v1/auth/refresh`, `GET /api/v1/auth/me`. Access tokens live 1 hour,
    refresh tokens 7 days, presented as `Authorization: Bearer <access_token>`.
    A Timely `workspace_id` is the scaffold's organization id.

  contact:
    name: Noizu Labs
    url: https://timely.noizu.com
  license:
    name: Proprietary

servers:
  - url: https://timely.noizu.com
    description: Production
  - url: http://localhost:4000
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: devices
    description: Device registration and per-device privacy flags.
  - name: sync
    description: The pull/push loop. All state replication happens here.
  - name: screenshots
    description: Opt-in binary blob transfer. Metadata moves through /sync.
  - name: reports
    description: Read-only rollups for the companion apps' report tab.

paths:

  /api/v1/devices:
    post:
      tags: [devices]
      operationId: registerDevice
      summary: Register or re-register a device
      description: |
        Idempotent by client-supplied `device_id`. A device that re-registers
        after reinstall SHOULD reuse its persisted `device_id` so that
        `origin_device_id` history stays intact; a device that cannot recover its
        id mints a fresh UUIDv7.

        `local_only_screenshots` defaults to `true`. A device MUST NOT be able to
        weaken the workspace policy: the effective upload gate is the logical AND
        of the workspace flag and the device flag.

        ## Re-registration is a full replace, not a partial merge

        Despite the name, calling this endpoint again for an existing
        `device_id` does **not** behave like `PATCH /api/v1/devices/{device_id}`.
        Every optional field omitted from the request is reset to its schema
        default - it is **not** left at its previously stored value. A client
        that re-registers sending only `device_id`, `workspace_id`, `platform`,
        `name`, and `app_version` will silently flip `is_capture_agent` back to
        `false` and clear `os_version` to `null`, even if a prior registration
        had set them.

        `created_at` and `origin_device_id` are the only things guaranteed to
        survive a re-registration unchanged - the row is reused, not recreated,
        specifically so LWW tie-breaks that depend on `origin_device_id` history
        keep working across a reinstall. Every other optional field must be
        resent on every call if it is to persist. This is the opposite
        convention from the presence-sensitive fields on `time_span` (`end`,
        `locked_at`, see `TimeSpan.end` below) and from `PATCH` on this same
        resource, where omission means "leave alone" - do not assume the same
        rule applies here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
            examples:
              macos_agent:
                summary: macOS capture agent, local-only screenshots
                value:
                  device_id: 019318a0-7f3c-7c21-9b4e-2f6a1c3d5e70
                  workspace_id: 0192f7a1-2b44-7000-8a10-9d3e4f5a6b7c
                  platform: macos
                  name: Keith's MacBook Pro
                  app_version: 1.0.0
                  os_version: "26.1"
                  local_only_screenshots: true
                  is_capture_agent: true
              android_companion:
                summary: Android companion
                value:
                  device_id: 019318a0-8b12-7f45-a003-11c9de4477aa
                  workspace_id: 0192f7a1-2b44-7000-8a10-9d3e4f5a6b7c
                  platform: android
                  name: Pixel 9
                  app_version: 1.0.0
                  local_only_screenshots: true
                  is_capture_agent: false
      responses:
        '200':
          description: Device registered (or re-registered; the row already existed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceEnvelope'
              examples:
                registered:
                  value:
                    device:
                      id: 019318a0-7f3c-7c21-9b4e-2f6a1c3d5e70
                      workspace_id: 0192f7a1-2b44-7000-8a10-9d3e4f5a6b7c
                      user_id: 0192f7a1-3c55-7000-b111-0011223344ff
                      platform: macos
                      name: Keith's MacBook Pro
                      app_version: 1.0.0
                      os_version: "26.1"
                      local_only_screenshots: true
                      is_capture_agent: true
                      last_seen_at: 2026-07-27T14:02:11Z
                      last_sync_revision: 0
                      revoked_at: null
                      created_at: 2026-07-27T14:02:11Z
                      updated_at: 2026-07-27T14:02:11Z
                      server_revision: 1841
                      deleted_at: null
                      origin_device_id: 019318a0-7f3c-7c21-9b4e-2f6a1c3d5e70
                    workspace_policy:
