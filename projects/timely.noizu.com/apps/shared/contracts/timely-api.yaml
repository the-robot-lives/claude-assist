  /api/v1/sync/mutations:
    post:
      tags: [sync]
      operationId: pushMutations
      summary: Push a batch of queued local mutations
      description: |
        The client push queue is **ordered, at-least-once, and batch-capped**:

        - FIFO, persisted across app restarts, one in-flight batch per device.
        - Max 200 mutations or 1 MiB serialized per batch (50 when `atomic` is true).
        - Every mutation carries a client-generated `mutation_id`. The server
          persists applied `mutation_id`s for at least 30 days; a replay returns
          the **original** recorded result with `replayed: true` and does not
          re-apply or re-bump `server_revision`.
        - The server applies mutations in array order. Clients SHOULD order
          creates before the rows that reference them, but MUST NOT depend on it:
          references are resolved lazily and reported via `unresolved_refs`.
        - Results are per-mutation. `applied`, `conflict`, and `rejected` are all
          terminal - dequeue them. Only transport failures, 5xx, and 429 are
          retried, with full-jitter exponential backoff (base 2s, cap 5m).
        - After a successful push the client MUST pull, because the server
          produces side effects the pusher did not ask for (auto-created
          projects, duplicate flags raised on *other* spans).

        `atomic: true` makes the batch all-or-nothing. Use it for split and merge,
        which are expressed as ordinary create/update/delete mutations sharing a
        `derived_from_span_ids` lineage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MutationRequest'
            examples:
              offline_create:
                summary: Device A pushes a span created offline against a project name it never synced
                value:
                  workspace_id: 0192f7a1-2b44-7000-8a10-9d3e4f5a6b7c
                  device_id: 019318a0-7f3c-7c21-9b4e-2f6a1c3d5e70
                  atomic: false
                  mutations:
                    - mutation_id: 019318c0-0001-7000-8000-000000000001
                      entity: time_span
                      op: create
                      base_revision: null
                      payload:
                        id: 019318b4-1a2b-7c3d-8e4f-506172839400
                        workspace_id: 0192f7a1-2b44-7000-8a10-9d3e4f5a6b7c
                        title: Timeline canvas keyboard pass
                        client_name: Acme
                        project_name: Redesign
                        ticket_name: ""
                        start: 2026-07-27T09:02:00Z
                        end: 2026-07-27T10:47:30Z
                        source: timer
                        is_billable: true
                        notes: ""
                        created_at: 2026-07-27T09:02:00Z
                        updated_at: 2026-07-27T10:47:30Z
