apiVersion: v1
kind: Service
metadata:
  name: {{ include "accords.fullname" . }}
  labels:
    {{- include "accords.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: http
    port: {{ .Values.port }}
    targetPort: {{ .Values.port }}
    protocol: TCP
  selector:
    {{- include "accords.selectorLabels" . | nindent 4 }}
