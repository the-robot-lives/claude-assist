databaseChangeLog:
  # ── US-069 OKR hierarchy — tree/rollup access paths ────────────────────────
  # idx_objectives_parent (parent_id) already exists from 030-okrs.yaml. These add
  # the org-scoped child lookup (tree/flat-list under an org) and the sibling
  # ordering path (parent_id, sort_order) used by drag-reorder + tree assembly.
  - changeSet:
      id: 042-okr-tree-indexes
      author: therobotplans
      changes:
        - sql:
            sql: |
              CREATE INDEX idx_objectives_org_parent
                ON objectives (organization_id, parent_id);
              CREATE INDEX idx_objectives_parent_sort
                ON objectives (parent_id, sort_order);
      rollback:
        - sql:
            sql: |
              DROP INDEX idx_objectives_org_parent;
              DROP INDEX idx_objectives_parent_sort;
