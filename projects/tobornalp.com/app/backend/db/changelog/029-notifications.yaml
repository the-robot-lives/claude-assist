databaseChangeLog:
  # ── Notifications inbox ────────────────────────────────────────────────────
  # Per-recipient notification feed. Every row is addressed to exactly ONE
  # concrete recipient (a user id); group/list sends fan out to one row per
  # member at notify time, so read/seen/ack state is genuinely per-recipient.
  #
  # Each row carries a monotonic `seq` from a dedicated sequence; a Monitor polls
  # with an opaque integer cursor and receives rows with seq > cursor, ordered
  # seq ASC. `dedup_key` collapses repeated items into one still-unread row that
  # resurfaces (fresh seq). `deliver_after` hides follow-ups/scheduled items until
  # due. Ported from NPL 064-notifications (npl_ prefix → trp_).

  - changeSet:
      id: 029-create-table-trp-notifications
      author: therobotplans
      changes:
        - sql:
            sql: |
              CREATE TABLE trp_notifications (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                organization_id uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
                project_id uuid REFERENCES projects(id) ON DELETE SET NULL,
                recipient varchar(255) NOT NULL,
                sender varchar(255),
                kind varchar(64) NOT NULL,
                subject_type varchar(64),
                subject_id varchar(255),
                body text,
                payload jsonb NOT NULL DEFAULT '{}'::jsonb,
                seen boolean NOT NULL DEFAULT false,
                seen_at timestamptz,
                read boolean NOT NULL DEFAULT false,
                read_at timestamptz,
                acked boolean NOT NULL DEFAULT false,
                acked_at timestamptz,
                deliver_after timestamptz,
                dedup_key varchar(255),
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: trp_notifications

  - changeSet:
      id: 029-create-sequence-trp-notifications-seq
      author: therobotplans
      changes:
        - sql:
            sql: |
              CREATE SEQUENCE trp_notifications_seq;
      rollback:
        - sql:
            sql: |
              DROP SEQUENCE IF EXISTS trp_notifications_seq;

  - changeSet:
      id: 029-add-seq-column-trp-notifications
      author: therobotplans
      changes:
        - sql:
            sql: |
              ALTER TABLE trp_notifications
                ADD COLUMN seq bigint NOT NULL DEFAULT nextval('trp_notifications_seq');
      rollback:
        - sql:
            sql: |
              ALTER TABLE trp_notifications DROP COLUMN seq;

  - changeSet:
      id: 029-create-indexes-trp-notifications
      author: therobotplans
      changes:
        # Cursor pulls: org + recipient + seq > cursor, ordered seq ASC.
        - sql:
            sql: |
              CREATE INDEX idx_trp_notifications_recipient_seq
                ON trp_notifications (organization_id, recipient, seq);
              CREATE INDEX idx_trp_notifications_recipient_read
                ON trp_notifications (organization_id, recipient, read);
              CREATE UNIQUE INDEX idx_trp_notifications_dedup
                ON trp_notifications (organization_id, recipient, dedup_key)
                WHERE read = false AND dedup_key IS NOT NULL;
      rollback:
        - sql:
            sql: |
              DROP INDEX IF EXISTS idx_trp_notifications_recipient_seq;
              DROP INDEX IF EXISTS idx_trp_notifications_recipient_read;
              DROP INDEX IF EXISTS idx_trp_notifications_dedup;
