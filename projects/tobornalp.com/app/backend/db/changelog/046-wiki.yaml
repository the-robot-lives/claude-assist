databaseChangeLog:
  # ── Wiki domain ───────────────────────────────────────────────────────────
  # Spaces are bound to an organization (required) with an optional project.
  # Pages live in a space and may nest (parent_id self-reference). Comments,
  # attachments, and reactions are NOT wiki-specific tables — they reuse the
  # polymorphic trp_comments / trp_attachments / trp_reactions tables (changelog
  # 027) keyed by (entity_type, entity_id). Wiki pages use entity_type =
  # 'wiki_page'; reactions on wiki comments use entity_type = 'wiki_comment'.
  # Ported from NPL changelog 036-wiki (dropped the 3 redundant tables).

  # ── wiki_spaces ───────────────────────────────────────────────────────────
  - changeSet:
      id: 046-create-table-wiki-spaces
      author: therobotplans
      changes:
        - sql:
            sql: |
              CREATE TABLE wiki_spaces (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                organization_id uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
                project_id uuid REFERENCES projects(id) ON DELETE SET NULL,
                slug varchar(255) NOT NULL,
                name varchar(255) NOT NULL,
                description text,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
              CREATE UNIQUE INDEX idx_wiki_spaces_org_slug ON wiki_spaces (organization_id, slug);
              CREATE INDEX idx_wiki_spaces_project_id ON wiki_spaces (project_id);
      rollback:
        - sql:
            sql: |
              DROP INDEX IF EXISTS idx_wiki_spaces_project_id;
              DROP INDEX IF EXISTS idx_wiki_spaces_org_slug;
              DROP TABLE IF EXISTS wiki_spaces;

  # ── wiki_pages ────────────────────────────────────────────────────────────
  - changeSet:
      id: 046-create-table-wiki-pages
      author: therobotplans
      changes:
        - sql:
            sql: |
              CREATE TABLE wiki_pages (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                space_id uuid NOT NULL REFERENCES wiki_spaces(id) ON DELETE CASCADE,
                parent_id uuid REFERENCES wiki_pages(id) ON DELETE SET NULL,
                slug varchar(255) NOT NULL,
                title varchar(255) NOT NULL,
                content text,
                position integer NOT NULL DEFAULT 0,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
              CREATE UNIQUE INDEX idx_wiki_pages_space_slug ON wiki_pages (space_id, slug);
              CREATE INDEX idx_wiki_pages_parent_id ON wiki_pages (parent_id);
      rollback:
        - sql:
            sql: |
              DROP INDEX IF EXISTS idx_wiki_pages_parent_id;
              DROP INDEX IF EXISTS idx_wiki_pages_space_slug;
              DROP TABLE IF EXISTS wiki_pages;
