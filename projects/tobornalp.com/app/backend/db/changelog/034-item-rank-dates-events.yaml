databaseChangeLog:
  # ── Item planning fields + append-only event log ───────────────────────────
  # Adds board-ordering (rank), scheduling (start_date/due_date), and sizing
  # (estimate) to items, plus item_events — an append-only audit trail written
  # best-effort on every item update (read path lands in M3). rank is a lexorank
  # string: the hot board query scans a single column, so the index is
  # (stage_id, rank), NOT (queue_id, rank).

  # ── items: rank / start_date / due_date / estimate ─────────────────────────
  - changeSet:
      id: 034-add-item-planning-fields
      author: therobotplans
      changes:
        - sql:
            sql: |
              ALTER TABLE items
                ADD COLUMN rank varchar(255),
                ADD COLUMN start_date date,
                ADD COLUMN due_date date,
                ADD COLUMN estimate numeric(8,2);

              -- Column-scoped board ordering (kanban/scrum columns are stages).
              CREATE INDEX idx_items_stage_rank ON items (stage_id, rank);
              -- Due-soon / calendar queries are org-scoped.
              CREATE INDEX idx_items_due ON items (organization_id, due_date);

              -- Backfill from the custom_fields JSON convention the Today view
              -- already reads. The regex match on ->> is NULL-safe (absent key
              -- yields NULL, excluded by WHERE) and guards the cast against
              -- malformed values, so no jsonb `?` key-exists operator is needed
              -- (JDBC would mis-parse `?` as a bind placeholder).
              UPDATE items
                SET due_date = (custom_fields->>'due_date')::date
                WHERE custom_fields->>'due_date' ~ '^\d{4}-\d{2}-\d{2}$';

              UPDATE items
                SET estimate = (custom_fields->>'estimate')::numeric
                WHERE custom_fields->>'estimate' ~ '^\s*[0-9]+(\.[0-9]+)?\s*$';

              -- Seed a spaced, per-stage lexorank so existing boards have a
              -- stable order with gaps for later midpoint inserts.
              WITH ranked AS (
                SELECT id,
                       lpad(
                         (row_number() OVER (PARTITION BY stage_id ORDER BY inserted_at, id) * 1000)::text,
                         10, '0'
                       ) AS r
                FROM items
              )
              UPDATE items i
                SET rank = ranked.r
                FROM ranked
                WHERE ranked.id = i.id AND i.rank IS NULL;
      rollback:
        - sql:
            sql: |
              DROP INDEX IF EXISTS idx_items_due;
              DROP INDEX IF EXISTS idx_items_stage_rank;
              ALTER TABLE items
                DROP COLUMN IF EXISTS estimate,
                DROP COLUMN IF EXISTS due_date,
                DROP COLUMN IF EXISTS start_date,
                DROP COLUMN IF EXISTS rank;

  # ── item_events (append-only audit trail) ──────────────────────────────────
  - changeSet:
      id: 034-create-table-item-events
      author: therobotplans
      changes:
        - sql:
            sql: |
              CREATE TABLE item_events (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                item_id uuid NOT NULL REFERENCES items(id) ON DELETE CASCADE,
                actor varchar,
                field varchar NOT NULL,
                old_value text,
                new_value text,
                occurred_at timestamptz NOT NULL DEFAULT now()
              );
              CREATE INDEX idx_item_events_item_time ON item_events (item_id, occurred_at);
              CREATE INDEX idx_item_events_item_field ON item_events (item_id, field);
      rollback:
        - dropTable:
            tableName: item_events
