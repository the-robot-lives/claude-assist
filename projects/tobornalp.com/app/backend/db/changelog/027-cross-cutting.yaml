databaseChangeLog:
  # ── Generic per-entity tables (comment / attach / watch / reactions) ────────
  # These are NOT item-specific — they are keyed by (entity_type, entity_id) so
  # any domain (items, OKRs, ...) can attach comments, files, watches, reactions.
  # The item domain uses entity_type = 'item'. Ported from NPL 030-cross-cutting
  # (npl_ prefix → trp_ prefix).

  # ── comments ───────────────────────────────────────────────────────────────
  - changeSet:
      id: 027-create-table-trp-comments
      author: therobotplans
      changes:
        - sql:
            sql: |
              CREATE TABLE trp_comments (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                entity_type varchar(255) NOT NULL,
                entity_id uuid NOT NULL,
                content text NOT NULL,
                author varchar(255),
                location varchar(255),
                reply_to_id uuid,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
              CREATE INDEX idx_trp_comments_entity ON trp_comments (entity_type, entity_id);
              CREATE INDEX idx_trp_comments_reply_to ON trp_comments (reply_to_id);
      rollback:
        - dropTable:
            tableName: trp_comments

  # ── attachments ────────────────────────────────────────────────────────────
  - changeSet:
      id: 027-create-table-trp-attachments
      author: therobotplans
      changes:
        - sql:
            sql: |
              CREATE TABLE trp_attachments (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                entity_type varchar(255) NOT NULL,
                entity_id uuid NOT NULL,
                artifact_type varchar(255) NOT NULL,
                url text,
                git_branch varchar(255),
                description text,
                created_by varchar(255),
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
              CREATE INDEX idx_trp_attachments_entity ON trp_attachments (entity_type, entity_id);
      rollback:
        - dropTable:
            tableName: trp_attachments

  # ── watches ────────────────────────────────────────────────────────────────
  - changeSet:
      id: 027-create-table-trp-watches
      author: therobotplans
      changes:
        - sql:
            sql: |
              CREATE TABLE trp_watches (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                entity_type varchar(255) NOT NULL,
                entity_id uuid NOT NULL,
                persona varchar(255) NOT NULL,
                filter jsonb,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
              CREATE UNIQUE INDEX idx_trp_watches_unique
                ON trp_watches (entity_type, entity_id, persona);
      rollback:
        - dropTable:
            tableName: trp_watches

  # ── reactions ──────────────────────────────────────────────────────────────
  - changeSet:
      id: 027-create-table-trp-reactions
      author: therobotplans
      changes:
        - sql:
            sql: |
              CREATE TABLE trp_reactions (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                entity_type varchar(255) NOT NULL,
                entity_id uuid NOT NULL,
                persona varchar(255) NOT NULL,
                emoji varchar(255) NOT NULL,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
              CREATE UNIQUE INDEX idx_trp_reactions_unique
                ON trp_reactions (entity_type, entity_id, persona, emoji);
      rollback:
        - dropTable:
            tableName: trp_reactions
