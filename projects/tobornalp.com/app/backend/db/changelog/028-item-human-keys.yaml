databaseChangeLog:
  # ── Human-readable item keys (e.g. NOZINF-023 / PROJECT-045) ────────────────
  # Per-scope sequential number + a scope prefix, IMMUTABLE, assigned race-safe
  # on insert. Two scopes: per-PROJECT (project items) and per-ORG (project_id
  # NULL / org-level items). Numbering is gap-free via a counter table with an
  # ATOMIC UPSERT in the item's txn. The NULL-project (org) bucket uses the same
  # two-partial-unique pattern as tri-scope tables — no NULLS-NOT-DISTINCT /
  # generated-sentinel needed. Ported from NPL 055-ticket-human-key.yaml.

  # 028a — prefix columns on organizations + projects (nullable; auto-derived
  # from slug, overridable. Format validated in the Ecto schema).
  - changeSet:
      id: 028a-add-key-prefix-columns
      author: therobotplans
      changes:
        - sql:
            sql: |
              ALTER TABLE projects ADD COLUMN key_prefix varchar(16);
              ALTER TABLE organizations ADD COLUMN key_prefix varchar(16);
      rollback:
        - sql:
            sql: |
              ALTER TABLE projects DROP COLUMN key_prefix;
              ALTER TABLE organizations DROP COLUMN key_prefix;

  # 028b — item number + immutable key columns (nullable; set on insert).
  - changeSet:
      id: 028b-add-item-number-key
      author: therobotplans
      changes:
        - sql:
            sql: |
              ALTER TABLE items ADD COLUMN number integer;
              ALTER TABLE items ADD COLUMN key varchar(64);
      rollback:
        - sql:
            sql: |
              ALTER TABLE items DROP COLUMN number;
              ALTER TABLE items DROP COLUMN key;

  # 028c — per-scope counter table. No PK on (org, project) because project_id is
  # nullable (org bucket); the two partial unique indexes below are the ON
  # CONFLICT targets and collapse the NULL-project bucket to ONE org counter.
  - changeSet:
      id: 028c-item-number-counters
      author: therobotplans
      changes:
        - sql:
            sql: |
              CREATE TABLE item_number_counters (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                organization_id uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
                project_id uuid REFERENCES projects(id) ON DELETE CASCADE,
                last_number integer NOT NULL DEFAULT 0,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
              CREATE UNIQUE INDEX idx_inc_proj ON item_number_counters (organization_id, project_id) WHERE project_id IS NOT NULL;
              CREATE UNIQUE INDEX idx_inc_org  ON item_number_counters (organization_id)             WHERE project_id IS NULL;
      rollback:
        - dropTable:
            tableName: item_number_counters

  # 028d — item number uniqueness, per scope. Partial (number set only once
  # assigned; org bucket vs project bucket distinct). items is a hot table.
  - changeSet:
      id: 028d-unique-item-number-proj
      author: therobotplans
      runInTransaction: false
      changes:
        - sql:
            splitStatements: true
            sql: |
              DROP INDEX IF EXISTS idx_items_proj_number;
              CREATE UNIQUE INDEX CONCURRENTLY idx_items_proj_number
              ON items (organization_id, project_id, number)
              WHERE project_id IS NOT NULL AND number IS NOT NULL;
      rollback:
        - sql:
            sql: DROP INDEX CONCURRENTLY IF EXISTS idx_items_proj_number;

  - changeSet:
      id: 028d-unique-item-number-org
      author: therobotplans
      runInTransaction: false
      changes:
        - sql:
            splitStatements: true
            sql: |
              DROP INDEX IF EXISTS idx_items_org_number;
              CREATE UNIQUE INDEX CONCURRENTLY idx_items_org_number
              ON items (organization_id, number)
              WHERE project_id IS NULL AND number IS NOT NULL;
      rollback:
        - sql:
            sql: DROP INDEX CONCURRENTLY IF EXISTS idx_items_org_number;

  # 028e — the real cross-scope key guard: a key string is unique within an org.
  - changeSet:
      id: 028e-unique-item-key
      author: therobotplans
      runInTransaction: false
      changes:
        - sql:
            splitStatements: true
            sql: |
              DROP INDEX IF EXISTS idx_items_org_key;
              CREATE UNIQUE INDEX CONCURRENTLY idx_items_org_key
              ON items (organization_id, key)
              WHERE key IS NOT NULL;
      rollback:
        - sql:
            sql: DROP INDEX CONCURRENTLY IF EXISTS idx_items_org_key;

  # 028f — prefix uniqueness. Project prefix unique per org; org prefix unique
  # globally. Both partial (NULL prefix allowed).
  - changeSet:
      id: 028f-unique-project-key-prefix
      author: therobotplans
      runInTransaction: false
      changes:
        - sql:
            splitStatements: true
            sql: |
              DROP INDEX IF EXISTS idx_projects_org_key_prefix;
              CREATE UNIQUE INDEX CONCURRENTLY idx_projects_org_key_prefix
              ON projects (organization_id, key_prefix)
              WHERE key_prefix IS NOT NULL;
      rollback:
        - sql:
            sql: DROP INDEX CONCURRENTLY IF EXISTS idx_projects_org_key_prefix;

  - changeSet:
      id: 028f-unique-org-key-prefix
      author: therobotplans
      runInTransaction: false
      changes:
        - sql:
            splitStatements: true
            sql: |
              DROP INDEX IF EXISTS idx_organizations_key_prefix;
              CREATE UNIQUE INDEX CONCURRENTLY idx_organizations_key_prefix
              ON organizations (key_prefix)
              WHERE key_prefix IS NOT NULL;
      rollback:
        - sql:
            sql: DROP INDEX CONCURRENTLY IF EXISTS idx_organizations_key_prefix;
