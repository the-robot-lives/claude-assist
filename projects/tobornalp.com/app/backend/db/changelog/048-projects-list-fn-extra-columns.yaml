databaseChangeLog:
  # ── list_user_accessible_projects: expose default_methodology + key_prefix ──
  # The projects list UI renders the project's methodology badge and its item-key
  # prefix, but the stored procedure (019) never returned those columns, so both
  # were always absent. Re-declare the function with the two extra columns added
  # to RETURNS TABLE and to the SELECT list; everything else is unchanged from 019.
  #
  # `CREATE OR REPLACE FUNCTION` cannot widen a RETURNS TABLE — Postgres rejects
  # it with "cannot change return type of existing function" — so the function is
  # dropped and recreated. Both statements run in one changeSet/transaction, so
  # concurrent callers block on the lock rather than seeing a missing function.
  # Adding trailing columns is backward compatible: the only caller
  # (Therobotplans.Projects.list_for_user/2) selects columns by name.
  - changeSet:
      id: 048-recreate-function-list-user-accessible-projects
      author: therobotplans
      changes:
        - sql:
            sql: DROP FUNCTION IF EXISTS list_user_accessible_projects(uuid, uuid);
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION list_user_accessible_projects(
                p_user_id uuid,
                p_organization_id uuid DEFAULT NULL
              )
              RETURNS TABLE (
                id uuid,
                organization_id uuid,
                name varchar,
                slug citext,
                description text,
                status varchar,
                created_at timestamptz,
                role_name role_name_enum,
                inherited_from_org boolean,
                default_methodology varchar,
                key_prefix varchar
              )
              LANGUAGE plpgsql
              STABLE
              AS $$
              BEGIN
                RETURN QUERY
                WITH user_org_memberships AS (
                  SELECT sm.resource_id AS org_id, g.name AS org_role
                  FROM scoped_memberships sm
                  JOIN groups g ON g.id = sm.group_id
                  WHERE sm.member_type = 'user'
                    AND sm.member_id = p_user_id
                    AND sm.resource_type = 'organization'
                    AND (sm.expires_at IS NULL OR sm.expires_at > NOW())
                ),
                user_project_memberships AS (
                  SELECT sm.resource_id AS project_id, g.name AS project_role
                  FROM scoped_memberships sm
                  JOIN groups g ON g.id = sm.group_id
                  WHERE sm.member_type = 'user'
                    AND sm.member_id = p_user_id
                    AND sm.resource_type = 'project'
                    AND (sm.expires_at IS NULL OR sm.expires_at > NOW())
                )
                SELECT
                  p.id,
                  p.organization_id,
                  p.name,
                  p.slug,
                  p.description,
                  p.status,
                  p.inserted_at AS created_at,
                  COALESCE(upm.project_role, uom.org_role) AS role_name,
                  (upm.project_role IS NULL AND uom.org_role IS NOT NULL) AS inherited_from_org,
                  p.default_methodology,
                  p.key_prefix
                FROM projects p
                LEFT JOIN user_org_memberships uom ON uom.org_id = p.organization_id
                LEFT JOIN user_project_memberships upm ON upm.project_id = p.id
                WHERE p.status = 'active'
                  AND (upm.project_role IS NOT NULL OR uom.org_role IS NOT NULL)
                  AND (p_organization_id IS NULL OR p.organization_id = p_organization_id)
                ORDER BY p.inserted_at DESC;
              END;
              $$;
      rollback:
        - sql:
            sql: DROP FUNCTION IF EXISTS list_user_accessible_projects(uuid, uuid);
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION list_user_accessible_projects(
                p_user_id uuid,
                p_organization_id uuid DEFAULT NULL
              )
              RETURNS TABLE (
                id uuid,
                organization_id uuid,
                name varchar,
                slug citext,
                description text,
                status varchar,
                created_at timestamptz,
                role_name role_name_enum,
                inherited_from_org boolean
              )
              LANGUAGE plpgsql
              STABLE
              AS $$
              BEGIN
                RETURN QUERY
                WITH user_org_memberships AS (
                  SELECT sm.resource_id AS org_id, g.name AS org_role
                  FROM scoped_memberships sm
                  JOIN groups g ON g.id = sm.group_id
                  WHERE sm.member_type = 'user'
                    AND sm.member_id = p_user_id
                    AND sm.resource_type = 'organization'
                    AND (sm.expires_at IS NULL OR sm.expires_at > NOW())
                ),
                user_project_memberships AS (
                  SELECT sm.resource_id AS project_id, g.name AS project_role
                  FROM scoped_memberships sm
                  JOIN groups g ON g.id = sm.group_id
                  WHERE sm.member_type = 'user'
                    AND sm.member_id = p_user_id
                    AND sm.resource_type = 'project'
                    AND (sm.expires_at IS NULL OR sm.expires_at > NOW())
                )
                SELECT
                  p.id,
                  p.organization_id,
                  p.name,
                  p.slug,
                  p.description,
                  p.status,
                  p.inserted_at AS created_at,
                  COALESCE(upm.project_role, uom.org_role) AS role_name,
                  (upm.project_role IS NULL AND uom.org_role IS NOT NULL) AS inherited_from_org
                FROM projects p
                LEFT JOIN user_org_memberships uom ON uom.org_id = p.organization_id
                LEFT JOIN user_project_memberships upm ON upm.project_id = p.id
                WHERE p.status = 'active'
                  AND (upm.project_role IS NOT NULL OR uom.org_role IS NOT NULL)
                  AND (p_organization_id IS NULL OR p.organization_id = p_organization_id)
                ORDER BY p.inserted_at DESC;
              END;
              $$;
