databaseChangeLog:
  # ── US-069 OKR hierarchy — key result weight ───────────────────────────────
  # A KR's contribution when its objective aggregates under weighted_avg. Weights
  # need not sum to 1; the rollup engine normalizes by the total present weight.
  - changeSet:
      id: 040-key-result-weight
      author: therobotplans
      changes:
        - sql:
            sql: |
              ALTER TABLE key_results
                ADD COLUMN weight numeric NOT NULL DEFAULT 1.0;
      rollback:
        - sql:
            sql: |
              ALTER TABLE key_results
                DROP COLUMN weight;
