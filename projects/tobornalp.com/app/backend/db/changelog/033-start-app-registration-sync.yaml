databaseChangeLog:
  - changeSet:
      id: 033-add-pending-user-status
      author: starter-scaffold
      changes:
        - sql:
            sql: ALTER TYPE user_status_enum ADD VALUE IF NOT EXISTS 'pending';
      rollback:
        - sql:
            sql: SELECT 1;

  - changeSet:
      id: 033-add-registration-profile-fields
      author: starter-scaffold
      changes:
        - sql:
            sql: |
              ALTER TABLE users
                ADD COLUMN IF NOT EXISTS mobile_phone varchar(32),
                ADD COLUMN IF NOT EXISTS invite_token_id uuid REFERENCES invite_tokens(id) ON DELETE SET NULL,
                ADD COLUMN IF NOT EXISTS profile_completed_at timestamptz,
                ADD COLUMN IF NOT EXISTS approved_at timestamptz,
                ADD COLUMN IF NOT EXISTS approved_by_user_id uuid REFERENCES users(id) ON DELETE SET NULL;
      rollback:
        - sql:
            sql: |
              ALTER TABLE users
                DROP COLUMN IF EXISTS approved_by_user_id,
                DROP COLUMN IF EXISTS approved_at,
                DROP COLUMN IF EXISTS profile_completed_at,
                DROP COLUMN IF EXISTS invite_token_id,
                DROP COLUMN IF EXISTS mobile_phone;

  - changeSet:
      id: 033-add-invite-token-window-and-redemptions
      author: starter-scaffold
      changes:
        - sql:
            sql: |
              ALTER TABLE invite_tokens
                ADD COLUMN IF NOT EXISTS starts_at timestamptz,
                ADD COLUMN IF NOT EXISTS redemption_count integer NOT NULL DEFAULT 0;

              CREATE TABLE IF NOT EXISTS invite_token_redemptions (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                invite_token_id uuid NOT NULL REFERENCES invite_tokens(id) ON DELETE CASCADE,
                user_id uuid NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                redeemed_at timestamptz NOT NULL DEFAULT now(),
                remote_ip text,
                user_agent text,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );

              CREATE INDEX IF NOT EXISTS idx_invite_token_redemptions_invite_token_id
                ON invite_token_redemptions(invite_token_id);
              CREATE INDEX IF NOT EXISTS idx_invite_token_redemptions_user_id
                ON invite_token_redemptions(user_id);
      rollback:
        - sql:
            sql: |
              DROP TABLE IF EXISTS invite_token_redemptions;
              ALTER TABLE invite_tokens
                DROP COLUMN IF EXISTS redemption_count,
                DROP COLUMN IF EXISTS starts_at;
