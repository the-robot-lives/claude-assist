databaseChangeLog:
  # Cookie-consent preferences persisted on the user account so they survive the
  # apex → app.tobornalp.com subdomain hop (localStorage is origin-scoped). The
  # account value is authoritative; see Therobotplans.Auth.SSO.maybe_set_consent.
  - changeSet:
      id: 032-users-consent
      author: starter
      changes:
        - sql:
            sql: |
              ALTER TABLE users ADD COLUMN IF NOT EXISTS consent_preferences jsonb;
              ALTER TABLE users ADD COLUMN IF NOT EXISTS consent_updated_at timestamptz;
      rollback:
        - sql:
            sql: |
              ALTER TABLE users DROP COLUMN IF EXISTS consent_preferences;
              ALTER TABLE users DROP COLUMN IF EXISTS consent_updated_at;
