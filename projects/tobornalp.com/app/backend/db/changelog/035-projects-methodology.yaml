databaseChangeLog:
  # ── projects: methodology + default board linkage ──────────────────────────
  # Turns project creation into a provisioning seam (US-021). `default_methodology`
  # is CHECK-constrained to the superset the wizard offers (adds `custom` over the
  # board's four); it drives provisioning + dashboards, so it's a real column, not
  # a settings-jsonb key. `default_queue_id` links the project to its provisioned
  # board (item_queues); ON DELETE SET NULL so deleting a board never orphan-blocks
  # a project. `board_stages` remains the workflow-states store — no new table.
  - changeSet:
      id: 035-projects-add-methodology
      author: therobotplans
      changes:
        - sql:
            sql: |
              ALTER TABLE projects
                ADD COLUMN default_methodology varchar(255) NOT NULL DEFAULT 'kanban'
                  CHECK (default_methodology IN ('kanban','scrum','waterfall','spiral','custom')),
                ADD COLUMN default_queue_id uuid
                  REFERENCES item_queues(id) ON DELETE SET NULL;

              CREATE INDEX idx_projects_default_queue_id
                ON projects (default_queue_id);
      rollback:
        - sql:
            sql: |
              DROP INDEX IF EXISTS idx_projects_default_queue_id;
              ALTER TABLE projects
                DROP COLUMN IF EXISTS default_queue_id,
                DROP COLUMN IF EXISTS default_methodology;
