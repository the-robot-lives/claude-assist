replicas: 0

domain: sandbox.tobornalp.com
appDomain: ""

sandbox:
  enabled: true
  image: ops.noizu.com/tobornalp.com/sandbox:v1.0.0
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    enabled: true
    size: 5Gi
  service:
    type: ClusterIP

backend:
  image: ops.noizu.com/tobornalp.com/backend:latest
  port: 4000

frontend:
  image: ops.noizu.com/tobornalp.com/frontend:latest
  port: 3000

migrate:
  enabled: false

database:
  host: app-postgres.apps.svc.cluster.local
  port: 5432
  name: therobotplans

secrets:
  name: tobornalp-secrets
  databaseUrlSecretName: therobotplans-secrets
  keys:
    dbUser: TOBORNALP_DB_USER
    dbPassword: TOBORNALP_DB_PASSWORD
    secretKeyBase: TOBORNALP_SECRET_KEY_BASE
    guardianSecretKey: TOBORNALP_GUARDIAN_SECRET_KEY
    redisUrl: TOBORNALP_REDIS_URL
    databaseUrl: THEROBOTPLANS_DATABASE_URL
    sendgridApiKey: TOBORNALP_SENDGRID_API_KEY
    oidcClientId: ""
    oidcClientSecret: ""
    googleClientId: ""
    googleClientSecret: ""
    facebookClientId: ""
    facebookClientSecret: ""
    githubClientId: ""
    githubClientSecret: ""
    linkedinClientId: ""
    linkedinClientSecret: ""
    samlSpCert: ""
    samlSpKey: ""

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  cloudflareOnly: true

tls:
  enabled: true
  secretName: tobornalp-tls
  infisical:
    enabled: false
