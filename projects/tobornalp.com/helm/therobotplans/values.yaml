replicas: 1
domain: therobotplans.com
appDomain: app.therobotplans.com
backend:
  image: ops.noizu.com/tobornalp.com/backend:v1.0.22
  port: 4000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
frontend:
  image: ops.noizu.com/tobornalp.com/frontend:v1.0.21
  port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
migrate:
  enabled: true
  # OTP app/module are still :therobotplans / Therobotplans.*; deploy identity is tobornalp.
  command: ["bin/therobotplans", "eval", "Therobotplans.Release.migrate()"]
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
database:
  host: app-postgres.apps.svc.cluster.local
  port: 5432
  name: therobotplans
redis:
  host: app-valkey.apps.svc.cluster.local
  port: 6379
  db: 12
secrets:
  name: tobornalp-secrets
  databaseUrlSecretName: therobotplans-secrets
  keys:
    dbUser: TOBORNALP_DB_USER
    dbPassword: TOBORNALP_DB_PASSWORD
    secretKeyBase: TOBORNALP_SECRET_KEY_BASE
    guardianSecretKey: TOBORNALP_GUARDIAN_SECRET_KEY
    redisUrl: TOBORNALP_REDIS_URL
    databaseUrl: THEROBOTPLANS_DATABASE_URL
    sendgridApiKey: TOBORNALP_SENDGRID_API_KEY
    oidcClientId: TOBORNALP_OIDC_CLIENT_ID
    oidcClientSecret: TOBORNALP_OIDC_CLIENT_SECRET
    googleClientId: ""
    googleClientSecret: ""
    facebookClientId: ""
    facebookClientSecret: ""
    githubClientId: ""
    githubClientSecret: ""
    linkedinClientId: ""
    linkedinClientSecret: ""
    samlSpCert: ""
    samlSpKey: ""
  infisical:
    enabled: true
    hostAPI: https://infisical.noizu.com/api
    resyncInterval: 120
    credentialsSecret: universal-auth-credentials
    credentialsNamespace: infra
    projectSlug: k8-infra
    envSlug: prod
    secretsPath: "/apps/tobornalp"
mail:
  fromName: ""
  fromAddress: "noreply@therobotplans.com"
sso:
  requireInvite: true
  # SSO availability by email domain. Format:
  # "example.com=oidc;corp.example=google,oidc"
  domains: "therobotplans.com=oidc;tobornalp.com=oidc;noizu.com=oidc;therobotlives.com=oidc;derobot.is=oidc;greatnonprofits.org=oidc;communityconnectlabs.com=oidc"
  # Domains whose SSO registrations are approved immediately. All other SSO
  # registrations remain pending unless an invite activates them. Format:
  # "example.com;corp.example" or "*" for every SSO-enabled domain.
  autoApproveDomains: "therobotplans.com;tobornalp.com;noizu.com;therobotlives.com;derobot.is;greatnonprofits.org;communityconnectlabs.com"
  oidc:
    # Default OIDC issuer for portfolio services (Authentik at auth.noizu.com)
    # Example: https://auth.noizu.com/application/o/{app-slug}/
    issuer: "https://auth.derobot.is/application/o/tobornalp"
  saml:
    idpMetadataUrl: ""
    spEntityId: ""
extraEnv: []
configMap:
  enabled: false
  data: {}
imagePullSecrets:
  - name: ops-registry-secret
analytics:
  ga:
    measurementId: ""
  posthog:
    key: ""
    host: "https://us.i.posthog.com"
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  cloudflareOnly: true
tls:
  enabled: true
  secretName: therobotplans-tls
  infisical:
    enabled: true
    resyncInterval: 300
    hostAPI: https://infisical.noizu.com/api
    credentialsSecret: universal-auth-credentials
    credentialsNamespace: infra
    projectSlug: k8-infra
    envSlug: prod
    secretsPath: "/apps/tls/therobotplans"
    crtKey: THEROBOTPLANS_TLS_CRT
    keyKey: THEROBOTPLANS_TLS_KEY
# Additional certificates served by the same ingress. Each entry gets its own
# ingress tls block + host rules and its own InfisicalSecret sync. The legacy
# tobornalp.com hosts stay live here so existing links keep resolving.
extraTls:
  - hosts:
      - tobornalp.com
      - app.tobornalp.com
    secretName: tobornalp-tls
    infisicalPath: "/apps/tls/tobornalp"
    crtKey: TOBORNALP_TLS_CRT
    keyKey: TOBORNALP_TLS_KEY
otel:
  enabled: false
  collectorEndpoint: "otel-collector.observability-ns.svc.cluster.local:4317"
  collectorHttpEndpoint: "http://otel-collector.observability-ns.svc.cluster.local:4318"
  serviceName: "tobornalp"
storage:
  enabled: false
  bucket: ""
  region: "us-east-1"
  endpoint: ""
  scheme: "https://"
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
podDisruptionBudget:
  enabled: false
  minAvailable: 1
sandbox:
  enabled: false
  image: ops.noizu.com/tobornalp.com/sandbox:v1.0.0
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    enabled: false
    size: 5Gi
    storageClass: ""
  service:
    type: ClusterIP
