replicas: 1
domain: therobotplans.com

backend:
  image: ops.noizu.com/therobotplans.com/backend:v1.0.edge
  port: 4000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  image: ops.noizu.com/therobotplans.com/frontend:v1.0.edge
  port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

migrate:
  enabled: true
  command: ["bin/therobotplans", "eval", "Therobotplans.Release.migrate()"]
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

database:
  host: shared-postgres.data-ns.svc.cluster.local
  port: 5432
  name: therobotplans

redis:
  host: shared-redis.data-ns.svc.cluster.local
  port: 6379
  db: 12

secrets:
  name: therobotplans-secrets
  keys:
    dbUser: THEROBOTPLANS_DB_USER
    dbPassword: THEROBOTPLANS_DB_PASSWORD
    secretKeyBase: THEROBOTPLANS_SECRET_KEY_BASE
    guardianSecretKey: THEROBOTPLANS_GUARDIAN_SECRET_KEY
    redisUrl: THEROBOTPLANS_REDIS_URL
    databaseUrl: THEROBOTPLANS_DATABASE_URL
    sendgridApiKey: ""
    oidcClientId: ""
    oidcClientSecret: ""
    googleClientId: ""
    googleClientSecret: ""
    facebookClientId: ""
    facebookClientSecret: ""
    githubClientId: ""
    githubClientSecret: ""
    linkedinClientId: ""
    linkedinClientSecret: ""
    samlSpCert: ""
    samlSpKey: ""

  infisical:
    enabled: true
    hostAPI: https://infisical.noizu.com/api
    resyncInterval: 120
    credentialsSecret: universal-auth-credentials
    credentialsNamespace: infra
    projectSlug: k8-infra
    envSlug: prod
    secretsPath: "/apps/therobotplans"

mail:
  fromName: ""
  fromAddress: "noreply@therobotplans.com"

sso:
  requireInvite: false
  oidc:
    issuer: ""
  saml:
    idpMetadataUrl: ""
    spEntityId: ""

extraEnv: []

configMap:
  enabled: false
  data: {}

imagePullSecrets:
  - name: ops-registry-secret

analytics:
  ga:
    measurementId: ""
  posthog:
    key: ""
    host: "https://us.i.posthog.com"

ingress:
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  cloudflareOnly: true

tls:
  secretName: therobotplans-com-tls
  infisical:
    enabled: true
    resyncInterval: 300
    credentialsSecret: universal-auth-credentials
    credentialsNamespace: infisical-operator-system
    projectSlug: k8-infra
    envSlug: prod
    secretsPath: "/apps/tls/therobotplans"
    crtKey: THEROBOTPLANS_TLS_CRT
    keyKey: THEROBOTPLANS_TLS_KEY

otel:
  enabled: false
  collectorEndpoint: "otel-collector.observability-ns.svc.cluster.local:4317"
  collectorHttpEndpoint: "http://otel-collector.observability-ns.svc.cluster.local:4318"
  serviceName: "therobotplans"

storage:
  enabled: false

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

sandbox:
  enabled: false
