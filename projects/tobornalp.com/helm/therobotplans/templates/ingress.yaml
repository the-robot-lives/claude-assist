{{- if .Values.ingress.enabled }}
{{- $svcName := ternary (printf "%s-sandbox" (include "start-app.fullname" .)) (include "start-app.fullname" .) (.Values.sandbox.enabled | default false) }}
{{- $appDomain := .Values.appDomain | default (printf "app.%s" .Values.domain) }}
{{- $hosts := list .Values.domain $appDomain }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "start-app.fullname" . }}
  labels:
    {{- include "start-app.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- if .Values.ingress.cloudflareOnly }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ include "start-app.cloudflareWhitelist" . | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
  - hosts:
    {{- range $hosts }}
    - {{ . }}
    {{- end }}
    secretName: {{ .Values.tls.secretName }}
  rules:
  {{- range $host := $hosts }}
  - host: {{ $host }}
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: {{ $svcName }}
            port:
              number: {{ $.Values.backend.port }}
      - path: /health
        pathType: Exact
        backend:
          service:
            name: {{ $svcName }}
            port:
              number: {{ $.Values.backend.port }}
      # Only the OIDC redirect flow (/auth/oidc, /auth/oidc/callback) is a backend
      # route. Frontend pages /auth/register and /auth/sso-callback live under
      # /auth/* too and must fall through to the frontend (/). All other backend
      # auth APIs are under /api/v1/auth/*. A broad `/auth` prefix here steals the
      # frontend pages → backend matches them on GET /auth/:provider → 500.
      - path: /auth/oidc
        pathType: Prefix
        backend:
          service:
            name: {{ $svcName }}
            port:
              number: {{ $.Values.backend.port }}
      - path: /sso
        pathType: Prefix
        backend:
          service:
            name: {{ $svcName }}
            port:
              number: {{ $.Values.backend.port }}
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $svcName }}
            port:
              number: {{ $.Values.frontend.port }}
  {{- end }}
{{- end }}
