# Signal — dark is the hero mode; light is a stark high-contrast inverse.
color-modes:
  dark:
    surface: "#0a0a0f"
    surface-alt: "#13131c"
    surface-inverse: "#f5f5ff"
    surface-accent: "rgba(255,31,142,0.16)"
    surface-warning: "var(--warning-tint)"
    surface-danger: "var(--error-tint)"
    text: "#f5f5ff"
    text-secondary: "#b4b4c8"
    text-muted: "#7a7a93"
    text-inverse: "#0a0a0f"
    text-link: "#00e5ff"
    border: "#26263a"
    border-strong: "#3a3a55"
    border-accent: "#ff1f8e"
    shadow-color: "rgba(255,31,142,0.25)"
    focus-ring: "rgba(255,31,142,0.5)"
  light:
    surface: "#ffffff"
    surface-alt: "#f3f3f7"
    surface-inverse: "#0a0a0f"
    surface-accent: "rgba(255,31,142,0.10)"
    surface-warning: "var(--warning-tint)"
    surface-danger: "var(--error-tint)"
    text: "#0a0a0f"
    text-secondary: "#3a3a4d"
    text-muted: "#6a6a80"
    text-inverse: "#ffffff"
    text-link: "#c40e6e"
    border: "#1a1a26"
    border-strong: "#0a0a0f"
    border-accent: "#ff1f8e"
    shadow-color: "rgba(10,10,15,0.18)"
    focus-ring: "rgba(196,14,110,0.4)"
