# Trust — light is the hero mode; dark is a deep navy "after-hours" mode.
color-modes:
  light:
    surface: "var(--white)"
    surface-alt: "#f4f6fb"
    surface-inverse: "#0f1b35"
    surface-accent: "rgba(29,78,216,0.08)"
    surface-warning: "var(--warning-tint)"
    surface-danger: "var(--error-tint)"
    text: "#0f1b35"
    text-secondary: "#42506b"
    text-muted: "#6b7790"
    text-inverse: "var(--white)"
    text-link: "#1d4ed8"
    border: "#dde3ef"
    border-strong: "#c3cce0"
    border-accent: "#1d4ed8"
    shadow-color: "rgba(15,27,53,0.08)"
    focus-ring: "rgba(29,78,216,0.3)"
  dark:
    surface: "#0f1b35"
    surface-alt: "#16244a"
    surface-inverse: "#eaf0fb"
    surface-accent: "rgba(96,140,246,0.18)"
    surface-warning: "var(--warning-tint)"
    surface-danger: "var(--error-tint)"
    text: "#eaf0fb"
    text-secondary: "#aab8d6"
    text-muted: "#7585a6"
    text-inverse: "#0f1b35"
    text-link: "#7aa2f7"
    border: "#26345c"
    border-strong: "#374670"
    border-accent: "#7aa2f7"
    shadow-color: "rgba(0,0,0,0.4)"
    focus-ring: "rgba(122,162,247,0.4)"
