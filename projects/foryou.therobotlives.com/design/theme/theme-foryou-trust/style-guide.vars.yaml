# Trust seeds — primary corporate blue, secondary teal, tertiary gold.
# Serif display + restrained radius signal institutional stability.
vars:
  groups:
    - name: "Accent Primaries"
      vars:
        red: "#1d4ed8"            # PRIMARY — corporate blue
        red-light: "rgba(29,78,216,0.08)"
        red-mid: "rgba(29,78,216,0.16)"
        blue: "#0f766e"           # SECONDARY — teal
        blue-light: "rgba(15,118,110,0.08)"
        blue-mid: "rgba(15,118,110,0.16)"
        yellow: "#b7791f"         # TERTIARY — restrained gold
        yellow-light: "rgba(183,121,31,0.10)"
        yellow-mid: "rgba(183,121,31,0.20)"
        brand-red: "#1d4ed8"
        brand-blue: "#0f766e"
        brand-yellow: "#b7791f"

    - name: Semantic
      vars:
        success: "#15803d"
        success-tint: "rgba(21,128,61,0.10)"
        warning: "#b7791f"
        warning-tint: "rgba(183,121,31,0.10)"
        error: "#b91c1c"
        error-tint: "rgba(185,28,28,0.10)"
        info: "#1d4ed8"
        info-tint: "rgba(29,78,216,0.10)"

    - name: Typography
      vars:
        font-sans: "'Inter', -apple-system, sans-serif"
        font-mono: "'IBM Plex Mono', 'Menlo', monospace"
        font-display: "'Source Serif 4', Georgia, serif"
        font-body: "'Inter', sans-serif"
        font-decorative: "'Source Serif 4', serif"

    - name: Radius
      vars:
        radius: "4px"
        radius-sm: "2px"
        radius-md: "4px"
        radius-lg: "6px"

    - name: Buttons
      vars:
        btn-font-family: "var(--font-sans)"
        btn-font-weight: "600"
        btn-font-size: "13px"
        btn-letter-spacing: "0.01em"
        btn-background: "var(--red)"
        btn-color: "var(--white)"
        btn-border-color: "transparent"
        btn-hover-background: "#1e40af"
        btn-outline-background: "transparent"
        btn-outline-color: "var(--red)"

    - name: Branding
      vars:
        branding-logo-font-family: "var(--font-display)"
        branding-logo-font-size: "26px"
        branding-logo-font-weight: "700"
        branding-logo-letter-spacing: "-0.01em"
        branding-logo-text-transform: "none"
        branding-border: "1px solid var(--border)"

    - name: Cards
      vars:
        card-accent-side: "top"
        card-border-color: "var(--gray-200)"

    - name: "HUI: Focus & Interaction"
      vars:
        hui-focus-ring-color: "rgba(29,78,216,0.35)"
        hui-focus-ring-width: "2px"

    - name: "HUI: Showcase Grid"
      vars:
        hui-showcase-accent: "var(--red)"
