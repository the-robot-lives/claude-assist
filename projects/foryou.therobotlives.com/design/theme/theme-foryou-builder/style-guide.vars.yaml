# Builder seeds — primary cyan, secondary indigo, tertiary lime.
# primary → red seed (base wires --red as the brand accent everywhere).
vars:
  groups:
    - name: "Accent Primaries"
      vars:
        red: "#22d3ee"            # PRIMARY — electric cyan
        red-light: "rgba(34,211,238,0.10)"
        red-mid: "rgba(34,211,238,0.20)"
        blue: "#818cf8"           # SECONDARY — indigo
        blue-light: "rgba(129,140,248,0.10)"
        blue-mid: "rgba(129,140,248,0.20)"
        yellow: "#a3e635"         # TERTIARY — lime
        yellow-light: "rgba(163,230,53,0.10)"
        yellow-mid: "rgba(163,230,53,0.20)"
        brand-red: "#22d3ee"
        brand-blue: "#818cf8"
        brand-yellow: "#a3e635"

    - name: Semantic
      vars:
        success: "#34d399"
        success-tint: "rgba(52,211,153,0.12)"
        warning: "#fbbf24"
        warning-tint: "rgba(251,191,36,0.12)"
        error: "#f87171"
        error-tint: "rgba(248,113,113,0.12)"
        info: "#38bdf8"
        info-tint: "rgba(56,189,248,0.12)"

    - name: Typography
      vars:
        font-sans: "'Inter', -apple-system, sans-serif"
        font-mono: "'JetBrains Mono', 'Menlo', monospace"
        font-display: "'Inter', sans-serif"
        font-body: "'Inter', sans-serif"
        font-decorative: "'JetBrains Mono', monospace"

    - name: Radius
      vars:
        radius: "6px"
        radius-sm: "4px"
        radius-md: "6px"
        radius-lg: "10px"

    - name: Buttons
      vars:
        btn-font-family: "var(--font-sans)"
        btn-font-weight: "600"
        btn-font-size: "13px"
        btn-letter-spacing: "0"
        btn-background: "var(--red)"
        btn-color: "#0b1220"
        btn-border-color: "transparent"
        btn-hover-background: "#67e8f9"
        btn-outline-background: "transparent"
        btn-outline-color: "var(--red)"

    - name: Branding
      vars:
        branding-logo-font-size: "24px"
        branding-logo-font-weight: "700"
        branding-logo-letter-spacing: "-0.02em"
        branding-logo-text-transform: "lowercase"
        branding-border: "1px solid var(--border)"

    - name: Cards
      vars:
        card-accent-side: "left"
        card-border-color: "var(--border)"

    - name: "HUI: Focus & Interaction"
      vars:
        hui-focus-ring-color: "rgba(34,211,238,0.4)"
        hui-focus-ring-width: "2px"

    - name: "HUI: Showcase Grid"
      vars:
        hui-showcase-accent: "var(--red)"
