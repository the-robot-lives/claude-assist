# Builder — dark is the hero mode; light provided for embeds on light hosts.
color-modes:
  dark:
    surface: "#0d1117"
    surface-alt: "#161b22"
    surface-inverse: "#e6edf3"
    surface-accent: "rgba(34,211,238,0.14)"
    surface-warning: "var(--warning-tint)"
    surface-danger: "var(--error-tint)"
    text: "#e6edf3"
    text-secondary: "#9da7b3"
    text-muted: "#6e7681"
    text-inverse: "#0d1117"
    text-link: "#22d3ee"
    border: "#272d36"
    border-strong: "#3a424d"
    border-accent: "#22d3ee"
    shadow-color: "rgba(0,0,0,0.5)"
    focus-ring: "rgba(34,211,238,0.4)"
  light:
    surface: "var(--white)"
    surface-alt: "var(--gray-50)"
    surface-inverse: "#0d1117"
    surface-accent: "rgba(34,211,238,0.10)"
    surface-warning: "var(--warning-tint)"
    surface-danger: "var(--error-tint)"
    text: "#0d1117"
    text-secondary: "var(--gray-700)"
    text-muted: "var(--gray-500)"
    text-inverse: "var(--white)"
    text-link: "#0e7490"
    border: "var(--gray-200)"
    border-strong: "var(--gray-300)"
    border-accent: "#0e7490"
    shadow-color: "rgba(0,0,0,0.08)"
    focus-ring: "rgba(14,116,144,0.3)"
