# Bright — light is the hero mode; dark provided as a soft, warm night mode.
color-modes:
  light:
    surface: "var(--white)"
    surface-alt: "#fff5f8"
    surface-inverse: "#2a1f2e"
    surface-accent: "rgba(255,92,138,0.10)"
    surface-warning: "var(--warning-tint)"
    surface-danger: "var(--error-tint)"
    text: "#2a1f2e"
    text-secondary: "#6b5a66"
    text-muted: "#9b8a96"
    text-inverse: "var(--white)"
    text-link: "#d6336c"
    border: "#f0e3e9"
    border-strong: "#e2cdd7"
    border-accent: "#ff5c8a"
    shadow-color: "rgba(124,92,255,0.10)"
    focus-ring: "rgba(255,92,138,0.35)"
  dark:
    surface: "#241b29"
    surface-alt: "#2e2334"
    surface-inverse: "#fff5f8"
    surface-accent: "rgba(255,92,138,0.18)"
    surface-warning: "var(--warning-tint)"
    surface-danger: "var(--error-tint)"
    text: "#f7eef3"
    text-secondary: "#c9b8c4"
    text-muted: "#9b8a96"
    text-inverse: "#241b29"
    text-link: "#ff8fb0"
    border: "#3d2f44"
    border-strong: "#4f3d57"
    border-accent: "#ff5c8a"
    shadow-color: "rgba(0,0,0,0.35)"
    focus-ring: "rgba(255,143,176,0.4)"
