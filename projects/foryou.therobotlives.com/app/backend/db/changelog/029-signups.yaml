databaseChangeLog:
  - changeSet:
      id: 029-create-table-signups
      author: foryou
      changes:
        - sql:
            sql: |
              -- signups: a person on a list. email is citext, so the unique
              -- (list_id, email) constraint is case-insensitive (== unique on
              -- (list_id, lower(email))). user_id is null until reconcile-on-login
              -- links the anonymous signup to an account.
              --
              -- contact_prefs (jsonb) + pause_until (timestamptz) are per-signup
              -- contact-preference storage (D10) — created here in Chunk B; Chunk E
              -- (Preference Center) only reads/edits them, adds no changelog. The
              -- effective preference = list.settings.contact_prefs (baseline)
              -- overridden by this row's contact_prefs.
              CREATE TABLE signups (
                id              uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                list_id         uuid NOT NULL REFERENCES lists(id) ON DELETE CASCADE,
                email           citext NOT NULL,
                user_id         uuid REFERENCES users(id) ON DELETE SET NULL,
                attribs         jsonb NOT NULL DEFAULT '{}',
                contact_prefs   jsonb NOT NULL DEFAULT '{}',
                pause_until     timestamptz,
                status          varchar(16) NOT NULL DEFAULT 'pending_optin'
                                  CHECK (status IN ('pending_optin','subscribed','unsubscribed','bounced')),
                confirm_token   varchar(64),
                confirm_sent_at timestamptz,
                unsub_token     varchar(64) NOT NULL,
                source          varchar(120),
                submitter_ip    varchar(64),
                inserted_at     timestamptz NOT NULL DEFAULT now(),
                updated_at      timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT uq_signups_list_email UNIQUE (list_id, email)
              );
              CREATE INDEX idx_signups_user_id       ON signups (user_id) WHERE user_id IS NOT NULL;
              CREATE INDEX idx_signups_list_status   ON signups (list_id, status);
              CREATE INDEX idx_signups_unsub_token   ON signups (unsub_token);
              CREATE INDEX idx_signups_confirm_token ON signups (confirm_token) WHERE confirm_token IS NOT NULL;
              CREATE INDEX idx_signups_email         ON signups (email);
              -- GIN index for attribute-value search in the admin console (D4).
              CREATE INDEX idx_signups_attribs_gin   ON signups USING GIN (attribs);
      rollback:
        - dropTable:
            tableName: signups
