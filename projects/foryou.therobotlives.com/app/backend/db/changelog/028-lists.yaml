databaseChangeLog:
  - changeSet:
      id: 028-create-table-lists
      author: foryou
      changes:
        - sql:
            sql: |
              -- lists: a named signup collection within a Service (project).
              -- public_slug is globally unique (D13) — the canonical key the
              -- public signup endpoint + embeddable widget resolve by, avoiding
              -- cross-org (project.slug, list.slug) collisions.
              CREATE TABLE lists (
                id           uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                project_id   uuid NOT NULL REFERENCES projects(id) ON DELETE CASCADE,
                slug         citext NOT NULL,
                public_slug  citext NOT NULL,
                name         varchar(255) NOT NULL,
                description  text,
                kind         varchar(16) NOT NULL DEFAULT 'newsletter'
                               CHECK (kind IN ('newsletter','waitlist','inquiry','contact','mixed')),
                settings     jsonb NOT NULL DEFAULT '{}',
                status       varchar(16) NOT NULL DEFAULT 'active'
                               CHECK (status IN ('active','archived')),
                inserted_at  timestamptz NOT NULL DEFAULT now(),
                updated_at   timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT uq_lists_project_slug UNIQUE (project_id, slug),
                CONSTRAINT uq_lists_public_slug  UNIQUE (public_slug)
              );
              CREATE INDEX idx_lists_project_id ON lists (project_id);

              -- list_attributes: typed, no-migration field model. Each list has
              -- at most one is_identity=true email attribute (the value backing
              -- signups.email + membership identity). Enforced by the partial
              -- unique index below — a plain UNIQUE (list_id, is_identity) would
              -- wrongly cap the list at a single non-identity attribute.
              CREATE TABLE list_attributes (
                id           uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                list_id      uuid NOT NULL REFERENCES lists(id) ON DELETE CASCADE,
                slug         citext NOT NULL,
                name         varchar(120) NOT NULL,
                type         varchar(16) NOT NULL
                               CHECK (type IN ('email','string','text','int','float','date','guid','select','multiselect')),
                required     boolean NOT NULL DEFAULT false,
                is_identity  boolean NOT NULL DEFAULT false,
                options      jsonb,
                validation   jsonb,
                sort_order   integer NOT NULL DEFAULT 0,
                status       varchar(16) NOT NULL DEFAULT 'active'
                               CHECK (status IN ('active','deprecated')),
                inserted_at  timestamptz NOT NULL DEFAULT now(),
                updated_at   timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT uq_list_attributes_list_slug UNIQUE (list_id, slug)
              );
              CREATE UNIQUE INDEX uq_list_attributes_identity_per_list
                ON list_attributes (list_id) WHERE is_identity = true;
              CREATE INDEX idx_list_attributes_list_order ON list_attributes (list_id, sort_order);
      rollback:
        - dropTable:
            tableName: list_attributes
        - dropTable:
            tableName: lists
