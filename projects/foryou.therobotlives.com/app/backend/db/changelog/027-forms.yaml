databaseChangeLog:
  - changeSet:
      id: 027-create-table-forms
      author: foryou
      changes:
        - sql:
            sql: |
              -- form definitions (current `definition` denormalized for reads;
              -- form_versions keeps immutable history; current_version_id
              -- points at the latest published version).
              CREATE TABLE forms (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                organization_id uuid REFERENCES organizations(id) ON DELETE CASCADE,
                slug citext NOT NULL,
                name varchar(255) NOT NULL,
                status varchar(20) NOT NULL DEFAULT 'draft'
                  CHECK (status IN ('draft', 'published', 'archived')),
                definition jsonb NOT NULL DEFAULT '{}',
                current_version_id uuid,
                settings jsonb DEFAULT '{}',
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now(),
                deleted_at timestamptz,
                CONSTRAINT uq_forms_org_slug UNIQUE (organization_id, slug)
              );
              CREATE INDEX idx_forms_organization_id ON forms (organization_id);

              CREATE TABLE form_versions (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                form_id uuid NOT NULL REFERENCES forms(id) ON DELETE CASCADE,
                version integer NOT NULL DEFAULT 1,
                definition jsonb NOT NULL,
                published_by uuid REFERENCES users(id) ON DELETE SET NULL,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT uq_form_versions_form_version UNIQUE (form_id, version)
              );
              CREATE INDEX idx_form_versions_form_id ON form_versions (form_id);

              CREATE TABLE form_submissions (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                form_id uuid NOT NULL REFERENCES forms(id) ON DELETE CASCADE,
                form_version_id uuid REFERENCES form_versions(id) ON DELETE SET NULL,
                payload jsonb NOT NULL DEFAULT '{}',
                source varchar(120),
                submitter_email citext,
                submitter_ip varchar(64),
                status varchar(20) NOT NULL DEFAULT 'new'
                  CHECK (status IN ('new', 'reviewed', 'closed', 'spam')),
                inserted_at timestamptz NOT NULL DEFAULT now()
              );
              CREATE INDEX idx_form_submissions_form_id ON form_submissions (form_id);
      rollback:
        - dropTable:
            tableName: form_submissions
        - dropTable:
            tableName: form_versions
        - dropTable:
            tableName: forms
