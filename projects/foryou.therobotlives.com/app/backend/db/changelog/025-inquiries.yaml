databaseChangeLog:
  - changeSet:
      id: 025-create-inquiries
      author: foryou
      changes:
        - createTable:
            tableName: inquiries
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(320)
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: source
                  type: varchar(120)
                  defaultValue: unknown
                  constraints:
                    nullable: false
              - column:
                  name: page_url
                  type: varchar(2048)
              - column:
                  name: metadata
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: new
                  constraints:
                    nullable: false
              - column:
                  name: inserted_at
                  type: timestamp with time zone
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
        # plain SQL: addCheckConstraint is Liquibase Pro-only
        - sql:
            sql: >-
              ALTER TABLE inquiries ADD CONSTRAINT chk_inquiries_status
              CHECK (status IN ('new', 'reviewed', 'closed', 'spam'))
        - createIndex:
            tableName: inquiries
            indexName: idx_inquiries_source_inserted_at
            columns:
              - column:
                  name: source
              - column:
                  name: inserted_at
        - createIndex:
            tableName: inquiries
            indexName: idx_inquiries_email
            columns:
              - column:
                  name: email
        - createIndex:
            tableName: inquiries
            indexName: idx_inquiries_status
            columns:
              - column:
                  name: status
      rollback:
        - dropTable:
            tableName: inquiries
