replicas: 1
domain: foryou.therobotlives.com

backend:
  image: ops.noizu.com/foryou.therobotlives.com/backend:v1.0.2
  port: 4000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  image: ops.noizu.com/foryou.therobotlives.com/frontend:v1.0.0
  port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

migrate:
  enabled: true
  command: ["bin/foryou", "eval", "Foryou.Release.migrate()"]
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

database:
  host: app-timescaledb.apps.svc.cluster.local
  port: 5432
  name: foryou

redis:
  host: app-valkey.apps.svc.cluster.local
  port: 6379
  db: 0

secrets:
  name: foryou-secrets
  infisical:
    enabled: true
    resyncInterval: 120
    hostAPI: "https://infisical.noizu.com/api"
    credentialsSecret: universal-auth-credentials
    credentialsNamespace: infra
    projectSlug: k8-infra
    envSlug: prod
    secretsPath: "/apps/foryou"
  keys:
    dbUser: FORYOU_DB_USER
    dbPassword: FORYOU_DB_PASSWORD
    databaseUrl: FORYOU_DATABASE_URL
    secretKeyBase: FORYOU_SECRET_KEY_BASE
    guardianSecretKey: FORYOU_GUARDIAN_SECRET_KEY
    redisUrl: FORYOU_REDIS_URL
    sendgridApiKey: ""
    oidcClientId: FORYOU_OIDC_CLIENT_ID
    oidcClientSecret: FORYOU_OIDC_CLIENT_SECRET
    googleClientId: ""
    googleClientSecret: ""
    facebookClientId: ""
    facebookClientSecret: ""
    githubClientId: ""
    githubClientSecret: ""
    linkedinClientId: ""
    linkedinClientSecret: ""
    samlSpCert: ""
    samlSpKey: ""

mail:
  fromName: ""
  fromAddress: ""

sso:
  requireInvite: false
  oidc:
    # Default OIDC issuer for portfolio services (Authentik at auth.noizu.com)
    # Example: https://auth.noizu.com/application/o/{app-slug}/
    issuer: "https://auth.derobot.is/application/o/foryou"
  saml:
    idpMetadataUrl: ""
    spEntityId: ""

extraEnv: []

configMap:
  enabled: false
  data: {}

imagePullSecrets:
  - name: ops-registry-secret

analytics:
  ga:
    measurementId: ""
  posthog:
    key: ""
    host: "https://us.i.posthog.com"

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  cloudflareOnly: true

tls:
  enabled: true
  secretName: foryou-tls
  infisical:
    enabled: true
    resyncInterval: 120
    hostAPI: "https://infisical.noizu.com/api"
    credentialsSecret: universal-auth-credentials
    credentialsNamespace: infra
    projectSlug: k8-infra
    envSlug: prod
    secretsPath: "/apps/tls/foryou"
    crtKey: FORYOU_TLS_CRT
    keyKey: FORYOU_TLS_KEY

otel:
  enabled: false
  collectorEndpoint: "otel-collector.observability-ns.svc.cluster.local:4317"
  collectorHttpEndpoint: "http://otel-collector.observability-ns.svc.cluster.local:4318"
  serviceName: "foryou"

storage:
  enabled: false
  bucket: ""
  region: "us-east-1"
  endpoint: ""
  scheme: "https://"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

sandbox:
  enabled: false
  image: ops.noizu.com/foryou.therobotlives.com/sandbox:latest
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    enabled: false
    size: 5Gi
    storageClass: ""
  service:
    type: ClusterIP
