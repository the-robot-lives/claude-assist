databaseChangeLog:
  - changeSet:
      id: 025-create-tables-directory
      author: starter-scaffold
      changes:
        - sql:
            sql: |
              CREATE TABLE directory_categories (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                slug citext NOT NULL UNIQUE,
                name varchar(80) NOT NULL,
                display_order int NOT NULL DEFAULT 0,
                inserted_at timestamptz NOT NULL,
                updated_at timestamptz NOT NULL
              );

              CREATE TABLE directory_sites (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                slug citext NOT NULL UNIQUE,
                name varchar(160) NOT NULL,
                url text NOT NULL,
                domain citext NOT NULL,
                summary text NOT NULL,
                category_id uuid NOT NULL REFERENCES directory_categories(id) ON DELETE RESTRICT,
                tags text[] NOT NULL DEFAULT '{}',
                originality int NOT NULL CHECK (originality BETWEEN 0 AND 100),
                human_authorship int NOT NULL CHECK (human_authorship BETWEEN 0 AND 100),
                depth int NOT NULL CHECK (depth BETWEEN 0 AND 100),
                freshness int NOT NULL CHECK (freshness BETWEEN 0 AND 100),
                design_quality int NOT NULL CHECK (design_quality BETWEEN 0 AND 100),
                overall_score numeric(5,2) GENERATED ALWAYS AS (
                  originality * 0.30
                  + human_authorship * 0.25
                  + depth * 0.20
                  + freshness * 0.15
                  + design_quality * 0.10
                ) STORED,
                featured boolean NOT NULL DEFAULT false,
                status varchar(20) NOT NULL DEFAULT 'published'
                  CHECK (status IN ('published', 'draft', 'hidden')),
                search_vector tsvector GENERATED ALWAYS AS (
                  setweight(to_tsvector('english', coalesce(name, '')), 'A')
                  || setweight(to_tsvector('english', coalesce(array_to_string(tags, ' '), '')), 'B')
                  || setweight(to_tsvector('english', coalesce(summary, '')), 'C')
                ) STORED,
                inserted_at timestamptz NOT NULL,
                updated_at timestamptz NOT NULL
              );

              CREATE INDEX idx_directory_sites_category
                ON directory_sites (category_id) WHERE status = 'published';
              CREATE INDEX idx_directory_sites_featured
                ON directory_sites (overall_score DESC) WHERE featured AND status = 'published';
              CREATE INDEX idx_directory_sites_overall
                ON directory_sites (overall_score DESC) WHERE status = 'published';
              CREATE INDEX idx_directory_sites_search
                ON directory_sites USING gin (search_vector) WHERE status = 'published';
              CREATE INDEX idx_directory_sites_tags
                ON directory_sites USING gin (tags) WHERE status = 'published';
              CREATE INDEX idx_directory_sites_domain_trgm
                ON directory_sites USING gin (domain gin_trgm_ops);
      rollback:
        - dropTable:
            tableName: directory_sites
        - dropTable:
            tableName: directory_categories
