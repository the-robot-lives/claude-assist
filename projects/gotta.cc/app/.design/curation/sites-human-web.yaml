# gotta.cc — The Yahoo Directory for the post-slop web.
# Curated human-web seed dataset: personal sites, blogs, indie publications,
# zines, small creative projects, tiny communities. Made by humans, not companies.
# If a VC could buy it, it doesn't belong here.
#
# Schema per site:
#   name, url, category, tags, summary (≤120 chars, editorial voice),
#   scores: {originality, human_authorship, depth, freshness, design} (0-100 each),
#   featured (bool), optional collection (string).
# Score weighting: Originality 30%, Human Authorship 25%, Depth 20%, Freshness 15%, Design 10%.

