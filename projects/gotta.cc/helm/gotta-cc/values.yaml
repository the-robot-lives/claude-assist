replicas: 1
domain: gotta.cc
backend:
  image: ops.noizu.com/gotta.cc/backend:v1.0.4
  port: 4000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
frontend:
  image: ops.noizu.com/gotta.cc/frontend:v1.0.9
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
migrate:
  enabled: true
  command: ["bin/gotta_cc", "eval", "GottaCc.Release.migrate()"]
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
database:
  host: app-timescaledb.apps.svc.cluster.local
  port: 5432
  name: gotta_cc
redis:
  host: shared-redis.data-ns.svc.cluster.local
  port: 6379
  db: 4
secrets:
  name: gotta-cc-secrets
  keys:
    dbUser: GOTTA_CC_DB_USER
    dbPassword: GOTTA_CC_DB_PASSWORD
    secretKeyBase: GOTTA_CC_SECRET_KEY_BASE
    guardianSecretKey: GOTTA_CC_GUARDIAN_SECRET_KEY
    redisUrl: GOTTA_CC_REDIS_URL
    databaseUrl: GOTTA_CC_DATABASE_URL
    sendgridApiKey: ""
    oidcClientId: ""
    oidcClientSecret: ""
    googleClientId: ""
    googleClientSecret: ""
    facebookClientId: ""
    facebookClientSecret: ""
    githubClientId: ""
    githubClientSecret: ""
    linkedinClientId: ""
    linkedinClientSecret: ""
    samlSpCert: ""
    samlSpKey: ""
  infisical:
    enabled: true
    hostAPI: https://infisical.noizu.com/api
    resyncInterval: 120
    credentialsSecret: universal-auth-credentials
    credentialsNamespace: infra
    projectSlug: k8-infra
    envSlug: prod
    secretsPath: "/apps/gotta-cc"
mail:
  fromName: ""
  fromAddress: "noreply@gotta.cc"
sso:
  requireInvite: false
  oidc:
    issuer: ""
  saml:
    idpMetadataUrl: ""
    spEntityId: ""
extraEnv: []
configMap:
  enabled: false
  data: {}
imagePullSecrets:
  - name: ops-registry-secret
analytics:
  ga:
    measurementId: ""
  posthog:
    key: ""
    host: "https://us.i.posthog.com"
adsense:
  # AdSense publisher ID, e.g. "ca-pub-1234567890123456". Empty means no ad
  # script is loaded and every ad slot renders nothing. Also drives the
  # generated /ads.txt. Per-placement slot IDs live in
  # app/frontend/src/components/ad-slot.tsx (AD_SLOTS).
  client: ""
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  cloudflareOnly: true
tls:
  enabled: true
  secretName: gotta-cc-tls
  infisical:
    enabled: true
    resyncInterval: 300
    hostAPI: https://infisical.noizu.com/api
    credentialsSecret: universal-auth-credentials
    credentialsNamespace: infra
    projectSlug: k8-infra
    envSlug: prod
    secretsPath: "/apps/tls/gottacc"
    crtKey: GOTTACC_TLS_CRT
    keyKey: GOTTACC_TLS_KEY
otel:
  enabled: false
  collectorEndpoint: "otel-collector.observability-ns.svc.cluster.local:4317"
  collectorHttpEndpoint: "http://otel-collector.observability-ns.svc.cluster.local:4318"
  serviceName: "gotta-cc"
storage:
  enabled: false
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
podDisruptionBudget:
  enabled: false
  minAvailable: 1
sandbox:
  enabled: false
