name: lets-go

services:
  db:
    image: noizu/timescaledb-ha-with-age:pg17.9-ts2.25.2-all-age1.7.0
    ports:
      - "${PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${PG_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:-postgres_dev}
      POSTGRES_DB: postgres
    command:
      - postgres
      - -c
      - max_worker_processes=64
      - -c
      - timescaledb.max_background_workers=32
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
      - ./docker/redis/users.acl:/etc/redis/users.acl:ro
    command: >
      redis-server
      --aclfile /etc/redis/users.acl
      --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "admin", "--pass", "admin_dev", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
