[package]
name = "robot-tui"
version = "0.1.0"
edition = "2021"
description = "Ratatui front-end for therobot models: chat on the left, live extension state (modulator / probes / episodic memory / delta) on the right, over FFI to libllama + robot-ffi."

[[bin]]
name = "robot-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"

[build-dependencies]
bindgen = "0.70"

[profile.release]
opt-level = 3
