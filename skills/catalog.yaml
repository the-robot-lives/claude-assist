# skill-manage catalog for monorepo skills/
# Point skill-manage config at this file:
#   catalog: /path/to/Noizu/skills/catalog.yaml
# Keys match skill directory names (trl-*).
version: 1

skills:
  # ── Passive income & strategy ──────────────────────────────────────────────
  trl-monetization-strategy:
    tags: [business, strategy, monetization, passive-income]
    work_types: [planning, business]
    providers: [claude, codex, grok]
    notes: "Choose and sequence income streams first"
    category: passive-income

  trl-market-intelligence:
    tags: [business, research, niches, validation]
    work_types: [planning, business, research]
    providers: [claude, codex, grok]
