# Editor profiles (paths are references; skill-manage audits existence only)
editor_profiles:
  vscode-web:
    description: Web / frontend workspaces
    files:
      - path: ~/.config/Code/User/settings.json
        role: settings
      - path: ~/dotfiles/vscode/web.code-workspace
        role: workspace

  vscode-infra:
    description: Infra / k8s / terraform
    files:
      - path: ~/dotfiles/vscode/infra.code-workspace
        role: workspace

  vscode-docs:
    description: Markdown and docs writing
    files:
      - path: ~/dotfiles/vscode/docs.code-workspace
        role: workspace

  vscode-agents:
    description: Agent / MCP development
    files:
      - path: ~/dotfiles/vscode/agents.code-workspace
        role: workspace

  vscode-mobile:
    description: iOS / Android mobile
    files:
      - path: ~/dotfiles/vscode/mobile.code-workspace
        role: workspace

  vscode-desktop:
    description: macOS / TUI / Unity
    files:
      - path: ~/dotfiles/vscode/desktop.code-workspace
        role: workspace
