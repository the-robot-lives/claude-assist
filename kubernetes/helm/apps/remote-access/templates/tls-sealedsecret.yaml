{{- if .Values.tls.manageSealedSecret }}
# Origin CA cert for *.remote-access.noizu.com (Cloudflare Origin CA), sealed for
# apps/remote-access-tls-synced. Encrypted with the cluster's sealed-secrets
# controller pubkey — safe to commit. Sealed-secrets is namespace+name strict:
# re-seal if the release namespace or secret name changes.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: remote-access-tls-synced
  namespace: {{ .Release.Namespace }}
spec:
  encryptedData:
    tls.crt: 
    tls.key: 
  template:
    metadata:
      name: remote-access-tls-synced
      namespace: {{ .Release.Namespace }}
    type: kubernetes.io/tls
{{- end }}
