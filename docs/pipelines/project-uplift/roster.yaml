# docs/pipelines/project-uplift/roster.yaml
# Frozen 46-target roster for the project-uplift pipeline. Generated during pipeline
# setup (2026-07-16) from a scripted census over projects/*. Do not hand-edit target
# census fields without re-running the census; quirks/notes may be appended.
version: 1
generated: 2026-07-16

policy:
  theme_target: 7                    # effective theme count target per project
  count_existing_themes: true         # existing named theme-{slug}/ dirs count toward the 7
  similitude_weighted: true            # Stage B formula: E = sum_i[sum_{j!=i}(1-s(i,j))]/(n-1), n=1 => E=1
  wave_size: 3                         # projects in flight per wave after the pilot
  pilot:
    - NoizuPromptLingo
    - aifighter.com
  pilot_order: sequential               # NoizuPromptLingo fully, THEN aifighter.com fully, THEN user review gate
  stub_readme_test: "lines < 50 OR first_heading == '# start-app'"
  personas_target_min: 5
  stories_target_min: 100               # over-target (e.g. thesocialflywheel.com's 1000) is a PASS, never trimmed
  screens_components_count_excludes: [README.md]
  theme_dir_glob: "design/theme*/theme-*"  # singular+plural design/theme(s)/, excluding theme-style-guide
  app_config_theme_dir_glob: "**/config/theme-*"  # e.g. app/frontend/src/config/, web/src/config/ — excluding theme-style-guide

excluded:
  - path: projects/backburner
    reason: parked stubs — out of scope, revisit if unparked
  - path: projects/NoizuPromptLingo.old
    reason: reference/historical copy, not a live product
  - path: projects/NoizuPromptLingo.deprecated
    reason: reference/historical copy, not a live product
  - path: projects/tobarnalp.com
    reason: byte-identical typo-mirror of tobornalp.com — never uplift both; flagged to user post-run for delete-vs-resync decision
  - path: projects/game-workshop
    reason: user decision 2026-07-16 — skipped for now

