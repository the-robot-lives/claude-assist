[package]
name = "repo-lock"
version = "0.1.0"
edition = "2021"
description = "Advisory file/dir locks + commit-ritual mutex for the Noizu monorepo"
license = "MIT"
authors = ["Keith Brings <keith.brings@noizu.com>"]

[[bin]]
name = "repo-lock"
path = "src/main.rs"

[dependencies]
libc = "0.2"
# uuid: v4 only — session identity comes from the harness via REPO_LOCK_SESSION,
# so no v5 deterministic derivation is needed (see PROJ-ARCH Key Decisions).
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
# chrono / anyhow are additive to the ARCH dependency table (see README "Deviations
# from spec"): chrono handles RFC3339 timestamps + TTL math the record schema requires;
# anyhow mirrors direnv-config's store/lock.rs error style this tool's flock guard copies.
chrono = "0.4"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
