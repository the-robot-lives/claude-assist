# queue-populator virtual microphones.
# Installed to ~/.config/pipewire/pipewire.conf.d/ by install.sh.
#
# Creates four persistent virtual sources (Recording / Claude / Codex / Llama)
# that appear as microphones in GNOME Settings and app device pickers. The
# queue-populator daemon feeds them from the real mic; when it isn't running
# (or a target is muted) they produce silence.

context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "robot_recording"
            node.description = "Recording"
            media.class      = Audio/Source/Virtual
            audio.position   = [ MONO ]
            audio.rate       = 48000
            object.linger    = true
            monitor.channel-volumes = true
        }
    }
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "robot_claude"
            node.description = "Claude"
            media.class      = Audio/Source/Virtual
            audio.position   = [ MONO ]
            audio.rate       = 48000
            object.linger    = true
            monitor.channel-volumes = true
        }
    }
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "robot_codex"
            node.description = "Codex"
            media.class      = Audio/Source/Virtual
            audio.position   = [ MONO ]
            audio.rate       = 48000
            object.linger    = true
            monitor.channel-volumes = true
        }
    }
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "robot_llama"
            node.description = "Llama"
            media.class      = Audio/Source/Virtual
            audio.position   = [ MONO ]
            audio.rate       = 48000
            object.linger    = true
            monitor.channel-volumes = true
        }
    }
]
