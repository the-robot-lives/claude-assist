[package]
name = "queue-populator"
version = "0.1.0"
edition = "2021"
description = "Voice-driven queue populator: wake-word memo capture, LLM classification, JSONL queues, and PipeWire virtual mic routing"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = "0.4"
crossbeam-channel = "0.5"
dirs = "5"
ureq = { version = "2", features = ["json"] }
rand = "0.8"
pipewire = { version = "0.10", features = ["v0_3_77"] }
libspa = "0.10"
sherpa-onnx = "1.13"
hound = "3"
ringbuf = "0.4"
ksni = { version = "0.3", features = ["blocking"] }
notify-rust = "4"
eframe = { version = "0.35", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }

[profile.release]
lto = "thin"

[dev-dependencies]
tempfile = "3"
