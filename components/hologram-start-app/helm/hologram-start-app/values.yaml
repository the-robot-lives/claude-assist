replicas: 1
domain: starter.therobotlives.com
appDomain: appstarter.therobotlives.com
# appDomain is a sibling subdomain (not a child of domain), so the auth cookie
# must be scoped to the shared parent zone for the OIDC/session flow to work
# across both hosts. Defaults to ".{domain}" when unset.
cookieDomain: ".therobotlives.com"

backend:
  image: ops.noizu.com/hologram-start-app/backend:latest
  port: 4000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Frontend is served by the Phoenix+Hologram backend (no separate Next.js
# container/image). The `frontend` stanza below exists only because
# service.yaml/ingress.yaml unconditionally reference `.Values.frontend.port`
# for a second named Service port -- it points at the same single backend
# process/port, not a second container. No `image` key: nothing in this
# chart's templates consumes `.Values.frontend.image`.
frontend:
  port: 4000

migrate:
  enabled: true
  command: ["bin/starter", "eval", "Starter.Release.migrate()"]
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

database:
  host: app-timescaledb.apps.svc.cluster.local
  port: 5432
  name: start_app

redis:
  host: app-valkey.apps.svc.cluster.local
  port: 6379
  db: 7

secrets:
  name: startapp-secrets
  keys:
    dbUser: START_APP_DB_USER
    dbPassword: START_APP_DB_PASSWORD
    databaseUrl: START_APP_DATABASE_URL
    secretKeyBase: START_APP_SECRET_KEY_BASE
    guardianSecretKey: START_APP_GUARDIAN_SECRET_KEY
    redisUrl: START_APP_REDIS_URL
    sendgridApiKey: START_APP_SENDGRID_API_KEY
    oidcClientId: START_APP_OIDC_CLIENT_ID
    oidcClientSecret: START_APP_OIDC_CLIENT_SECRET
    googleClientId: ""
    googleClientSecret: ""
    facebookClientId: ""
    facebookClientSecret: ""
    githubClientId: ""
    githubClientSecret: ""
    linkedinClientId: ""
    linkedinClientSecret: ""
    samlSpCert: ""
    samlSpKey: ""

mail:
  fromName: ""
  fromAddress: ""

sso:
  requireInvite: false
  # SSO availability by email domain. Format:
  # "example.com=oidc;corp.example=google,oidc"
  domains: ""
  # Domains whose SSO registrations are approved immediately. All other SSO
  # registrations remain pending unless an invite activates them. Format:
  # "example.com;corp.example" or "*" for every SSO-enabled domain.
  autoApproveDomains: ""
  oidc:
    # Default OIDC issuer for portfolio services (Authentik at auth.noizu.com)
    # Example: https://auth.noizu.com/application/o/{app-slug}/
    issuer: ""
  saml:
    # Samly 1.4 expects raw metadata XML or a local metadata file path; it does
    # not fetch metadata URLs at runtime.
    idpMetadata: ""
    idpMetadataFile: ""
    # Deprecated. Kept for existing values files that used this as a file path.
    idpMetadataUrl: ""
    spEntityId: ""

extraEnv: []

configMap:
  enabled: false
  data: {}

imagePullSecrets:
  - name: ops-registry-secret

analytics:
  ga:
    measurementId: ""
  posthog:
    key: ""
    host: "https://us.i.posthog.com"

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  cloudflareOnly: true

tls:
  enabled: true
  secretName: therobotlives-tls
  infisical:
    enabled: true
    resyncInterval: 300
    hostAPI: https://infisical.noizu.com/api
    credentialsSecret: universal-auth-credentials
    credentialsNamespace: infra
    projectSlug: k8-infra
    envSlug: prod
    secretsPath: "/apps/tls/therobotlives"
    crtKey: THEROBOTLIVES_TLS_CRT
    keyKey: THEROBOTLIVES_TLS_KEY

otel:
  enabled: false
  collectorEndpoint: "otel-collector.observability-ns.svc.cluster.local:4317"
  collectorHttpEndpoint: "http://otel-collector.observability-ns.svc.cluster.local:4318"
  serviceName: "hologram-start-app"

storage:
  enabled: false
  bucket: ""
  region: "us-east-1"
  endpoint: ""
  scheme: "https://"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

sandbox:
  enabled: false
  image: ops.noizu.com/hologram-start-app/sandbox:latest
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    enabled: false
    size: 5Gi
    storageClass: ""
  service:
    type: ClusterIP
