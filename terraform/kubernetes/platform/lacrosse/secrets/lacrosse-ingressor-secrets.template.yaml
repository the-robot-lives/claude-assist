# =============================================================================
# TEMPLATE — lacrosse-ingressor-secrets  (namespace: lacrosse)
# =============================================================================
# PLACEHOLDER VALUES. This file is intentionally NOT a SealedSecret and is NOT
# applied by Terraform (secrets.tf only globs *.sealedsecret.yaml). The Lacrosse
# ingressor app's external integrations (Twilio, SendGrid, Firebase, GCP
# Pub/Sub) WILL NOT WORK until you fill in real values and seal them.
#
# To produce the real sealed secret:
#   1. Copy this file to unsealed/lacrosse-ingressor-secrets.plain.yaml (gitignored)
#      and replace every REPLACE_ME / PLACEHOLDER value with real credentials.
#      For stage-pub-sub.json, paste the GCP service-account JSON as the value.
#   2. Seal it into a committed file:
#        KUBECONFIG=~/.kube/noizu/config kubeseal \
#          --controller-name sealed-secrets-controller \
#          --controller-namespace kube-system \
#          --format yaml \
#          < unsealed/lacrosse-ingressor-secrets.plain.yaml \
#          > lacrosse-ingressor-secrets.sealedsecret.yaml
#   3. Commit lacrosse-ingressor-secrets.sealedsecret.yaml. On the next apply,
#      secrets.tf will unseal it into ns `lacrosse` as `lacrosse-ingressor-secrets`.
#
# The app Helm chart (authored separately) mounts/reads these keys.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: lacrosse-ingressor-secrets
  namespace: lacrosse
type: Opaque
stringData:
  # --- Phoenix / app ---
  SECRET_KEY_BASE: "REPLACE_ME_secret_key_base_64_bytes"
  JWT_SECRET: "REPLACE_ME_jwt_signing_secret"

  # --- Twilio ---
  TWILIO_ACCOUNT_SID: "REPLACE_ME_ACxxxxxxxxxxxxxxxx"
  TWILIO_AUTH_TOKEN: "REPLACE_ME_twilio_auth_token"
  TWILIO_FROM_NUMBER: "REPLACE_ME_+15555555555"

  # --- SendGrid ---
  SENDGRID_API_KEY: "REPLACE_ME_SG.xxxxxxxx"

  # --- Firebase (server key / service account) ---
  FIREBASE_API_KEY: "REPLACE_ME_firebase_api_key"
  FIREBASE_PROJECT_ID: "REPLACE_ME_firebase_project_id"

  # --- GCP Pub/Sub service-account JSON (staging) ---
  # Paste the full service-account JSON as this value (indented block scalar).
  stage-pub-sub.json: |
    {
      "type": "service_account",
      "project_id": "REPLACE_ME",
      "private_key_id": "REPLACE_ME",
      "private_key": "REPLACE_ME",
      "client_email": "REPLACE_ME",
      "client_id": "REPLACE_ME",
      "token_uri": "https://oauth2.googleapis.com/token"
    }
