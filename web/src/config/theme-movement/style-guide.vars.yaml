vars:
  groups:
    - name: "Seed Colors"
      vars:
        white: "#F5F5F5"
        black: "#0A0A0A"
        red: "#FF3B30"
        blue: "#FFD700"
        yellow: "#FFD700"

    - name: "Semantic Colors"
      vars:
        success: "#34C759"
        warning: "#FFD700"
        error: "#FF3B30"
        info: "#5AC8FA"

    - name: "Typography"
      vars:
        font-sans: "'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif"
        font-mono: "'Space Mono', 'Menlo', monospace"

    - name: "Shape"
      vars:
        radius: "0px"
