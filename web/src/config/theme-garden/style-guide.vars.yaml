vars:
  groups:
    - name: "Seed Colors"
      vars:
        white: "#FAFDF7"
        black: "#1E2D1E"
        red: "#2D9C6F"
        blue: "#4A8FBF"
        yellow: "#E8A849"

    - name: "Semantic Colors"
      vars:
        success: "#2D9C6F"
        warning: "#E8A849"
        error: "#D14F4F"
        info: "#4A8FBF"

    - name: "Typography"
      vars:
        font-sans: "'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif"
        font-serif: "'DM Serif Display', 'Georgia', serif"
        font-mono: "'DM Mono', 'Menlo', monospace"

    - name: "Shape"
      vars:
        radius: "12px"
