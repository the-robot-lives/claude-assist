color-palette:
  - group: Brand
    description: Core brand colors from Bauhaus primary theory. These brighten automatically in dark mode for visibility.
    notes:
      - label: Brand Red
        text: "Brand accent. CTAs, active states, logo mark, error reinforcement."
        cssClass: brand-red
      - label: Brand Blue
        text: "Primary actions, links, focus rings, info states."
        cssClass: brand-blue
      - label: Brand Yellow
        text: "Highlights, selection, featured content, warnings."
        cssClass: brand-yellow
    colors:
      - name: Brand Red
        value: "var(--brand-red)"
      - name: Brand Red Light
        value: "var(--brand-red-light)"
      - name: Brand Red Mid
        value: "var(--brand-red-mid)"
      - name: Brand Blue
        value: "var(--brand-blue)"
      - name: Brand Blue Light
        value: "var(--brand-blue-light)"
      - name: Brand Blue Mid
        value: "var(--brand-blue-mid)"
      - name: Brand Yellow
        value: "var(--brand-yellow)"
      - name: Brand Yellow Light
        value: "var(--brand-yellow-light)"
      - name: Brand Yellow Mid
        value: "var(--brand-yellow-mid)"

  - group: Semantic Surfaces
    description: Mode-aware surface and text colors — these flip automatically in dark mode.
    colors:
      - name: Surface
        value: "var(--surface)"
      - name: Surface Alt
        value: "var(--surface-alt)"
      - name: Surface Inverse
        value: "var(--surface-inverse)"
      - name: Text
        value: "var(--text)"
      - name: Text Secondary
        value: "var(--text-secondary)"
      - name: Text Muted
        value: "var(--text-muted)"
      - name: Text Inverse
        value: "var(--text-inverse)"
      - name: Border
        value: "var(--border)"
      - name: Border Strong
        value: "var(--border-strong)"

  - group: Palette
    description: Non-branded utility colors for data visualization, tags, categories, and decorative use. Brighten in dark mode.
    colors:
      - name: Rose
        value: "var(--rose)"
      - name: Orange
        value: "var(--orange)"
      - name: Amber
        value: "var(--amber)"
      - name: Lime
        value: "var(--lime)"
      - name: Emerald
        value: "var(--emerald)"
      - name: Teal
        value: "var(--teal)"
      - name: Cyan
        value: "var(--cyan)"
      - name: Sky
        value: "var(--sky)"
      - name: Indigo
        value: "var(--indigo)"
      - name: Violet
        value: "var(--violet)"
      - name: Purple
        value: "var(--purple)"
      - name: Fuchsia
        value: "var(--fuchsia)"
      - name: Pink
        value: "var(--pink)"

  - group: Gray
    description: Neutral backgrounds, surfaces, borders, and text values. Foundation for all UI layers.
    colors:
      - name: White
        value: "#ffffff"
      - name: Off-White
        value: "#fafafa"
      - name: Gray 50
        value: "#f5f5f5"
      - name: Gray 100
        value: "#eeeeee"
      - name: Gray 200
        value: "#e0e0e0"
      - name: Gray 300
        value: "#bdbdbd"
      - name: Gray 400
        value: "#9e9e9e"
      - name: Gray 500
        value: "#757575"
      - name: Gray 600
        value: "#616161"
      - name: Gray 700
        value: "#424242"
      - name: Gray 800
        value: "#212121"
      - name: Gray 900
        value: "#121212"
      - name: Black
        value: "#000000"

  - group: Slate
    description: Blue-tinted neutrals for surfaces and backgrounds. Used by the semantic surface layer — flips in dark mode.
    colors:
      - name: Slate 50
        value: "var(--slate-50)"
      - name: Slate 100
        value: "var(--slate-100)"
      - name: Slate 200
        value: "var(--slate-200)"
      - name: Slate 300
        value: "var(--slate-300)"
      - name: Slate 400
        value: "var(--slate-400)"
      - name: Slate 500
        value: "var(--slate-500)"
      - name: Slate 600
        value: "var(--slate-600)"
      - name: Slate 700
        value: "var(--slate-700)"
      - name: Slate 800
        value: "var(--slate-800)"
      - name: Slate 900
        value: "var(--slate-900)"
      - name: Slate 950
        value: "var(--slate-950)"

  - group: Semantic States
    description: Functional state colors — success, warning, error, info. Brighten in dark mode. Use these to construct semantic classes.
    colors:
      - name: Success
        value: "var(--success)"
      - name: Success Tint
        value: "var(--success-tint)"
        cssClass: success-tint
      - name: Warning
        value: "var(--warning)"
      - name: Warning Tint
        value: "var(--warning-tint)"
        cssClass: warning-tint
      - name: Error
        value: "var(--error)"
      - name: Error Tint
        value: "var(--error-tint)"
        cssClass: error-tint
      - name: Info
        value: "var(--info)"
      - name: Info Tint
        value: "var(--info-tint)"
        cssClass: info-tint
    notes:
      - label: Success
        text: "Confirmations, published states, positive actions."
        cssClass: success
      - label: Warning
        text: "Cautions, pending states, attention required."
        cssClass: warning
      - label: Error
        text: "Failures, danger states, destructive actions."
        cssClass: error
      - label: Info
        text: "Guidance, links, informational states."
        cssClass: info
