name: therobotknows CI

on:
  push:
    paths:
      - "projects/therobotknows.com/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "projects/therobotknows.com/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: projects/therobotknows.com/app

jobs:
  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/therobotknows.com/app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: projects/therobotknows.com/app/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
        env:
          NEXT_PUBLIC_API_MODE: mock
      - run: npm run build
        env:
          NEXT_PUBLIC_API_MODE: mock

  backend:
    name: Backend mix test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: starter_ci
          POSTGRES_DB: starter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starter"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: projects/therobotknows.com/app/backend
    env:
      MIX_ENV: test
      DB_HOST: localhost
      DB_USER: starter
      DB_PASS: starter_ci
      DB_NAME: starter_test
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY_BASE: ci-secret-key-base-must-be-at-least-64-bytes-long-for-phoenix-framework!!
      GUARDIAN_SECRET_KEY: ci-guardian-secret-key-for-testing-only
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            projects/therobotknows.com/app/backend/deps
            projects/therobotknows.com/app/backend/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('projects/therobotknows.com/app/backend/mix.lock') }}
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test
