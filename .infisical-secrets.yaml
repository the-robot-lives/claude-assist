        dc: auto qdrant_api_key
        override: QDRANT_API_KEY
      <<: *ops_registry

  # ===========================================================================
  # populate_mail — /mail/mailu
  # ===========================================================================
  - id: mailu
    title: "Mailu Mail Server"
    path: /mail/mailu
    secrets:
      # --- Mailu Core ---
      MAILU_SECRET_KEY:
        dc: services mail.mailu_secret_key
        override: MAILU_SECRET_KEY
      MAILU_ADMIN_PASSWORD:
        dc: services mail.mailu_admin_password
        override: MAILU_ADMIN_PASSWORD
        optional: true
      # --- PostgreSQL ---
      POSTGRES_PASSWORD:
        dc: services mail.postgres_password
        override: MAILU_PG_PASSWORD
      MAILU_DB_USER:
        dc: services mail.mailu_db_user
        override: MAILU_DB_USER
        default: mailu
      MAILU_DB_PASSWORD:
        dc: services mail.mailu_db_password
        override: MAILU_DB_PASSWORD
      ROUNDCUBE_DB_USER:
        dc: services mail.roundcube_db_user
        override: ROUNDCUBE_DB_USER
        default: roundcube
      ROUNDCUBE_DB_PASSWORD:
        dc: services mail.roundcube_db_password
        override: ROUNDCUBE_DB_PASSWORD
      # --- Redis ---
      REDIS_PASSWORD:
        dc: services mail.redis_password
        override: MAILU_REDIS_PASSWORD
      # --- SendGrid relay (outbound SMTP) ---
      SENDGRID_API_KEY:
        dc: secrets sendgrid.mailu
        override: SENDGRID_TRL
      # --- TLS (*.therobotlives.com) ---
      TRL_TLS_CERT:
        file: .secrets/tls/therobotlives.com/cert.pem
        override: TRL_TLS_CERT
        decode: base64
      TRL_TLS_KEY:
        file: .secrets/tls/therobotlives.com/key.pem
        override: TRL_TLS_KEY
        decode: base64
      # --- Registry ---
      OPS_REGISTRY_USER:
        dc: secrets registry.ops_user
        override: OPS_REGISTRY_USER
      OPS_REGISTRY_PASSWORD:
        dc: secrets registry.ops_password
        override: OPS_REGISTRY_PASSWORD

