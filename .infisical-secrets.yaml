      TOBORWIKI_TLS_CRT:
        file: .secrets/tls/toborwiki/cert.pem
        override: TOBORWIKI_TLS_CRT
        decode: base64
      TOBORWIKI_TLS_KEY:
        file: .secrets/tls/toborwiki/key.pem
        override: TOBORWIKI_TLS_KEY
        decode: base64

  # --- Apps-ns infrastructure (shared Postgres/Redis/GitHub + Codefresh) ---
  - id: apps-infra
    title: "Apps — apps-ns infrastructure"
    path: /apps
    secrets:
      GITHUB_TOKEN:
        dc: secrets github.token
        override: GITHUB_TOKEN
      POSTGRES_USER:
        dc: services apps.postgres_user
        override: APPS_POSTGRES_USER
        default: postgres
      POSTGRES_PASSWORD:
        dc: services apps.postgres_password
        override: APPS_POSTGRES_PASSWORD
      REDIS_PASSWORD:
        dc: services apps.redis_password
        override: APPS_REDIS_PASSWORD
      CODEFRESH_DB_USER:
        dc: services apps.codefresh_db_user
        override: CODEFRESH_DB_USER
        default: codefresh
      CODEFRESH_DB_PASSWORD:
        dc: services apps.codefresh_db_password
        override: CODEFRESH_DB_PASSWORD
      CODEFRESH_REDIS_USER:
        dc: services apps.codefresh_redis_user
        override: CODEFRESH_REDIS_USER
        optional: true
      CODEFRESH_REDIS_PASSWORD:
        dc: services apps.codefresh_redis_password
        override: CODEFRESH_REDIS_PASSWORD
        optional: true
      CODEFRESH_SECRET_KEY_BASE:
        dc: services apps.codefresh_secret_key_base
        override: CODEFRESH_SECRET_KEY_BASE
      CODEFRESH_GUARDIAN_SECRET_KEY:
        dc: services apps.codefresh_guardian_secret_key
        override: CODEFRESH_GUARDIAN_SECRET_KEY
