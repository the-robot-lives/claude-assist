      #   optional: true
      POSTGRES_HOST:
        dc: services livebook.postgres_host
        override: LIVEBOOK_POSTGRES_HOST
        default: postgresql.apps-ns.svc.cluster.local
      POSTGRES_PORT:
        dc: services livebook.postgres_port
        override: LIVEBOOK_POSTGRES_PORT
        default: "5432"
      POSTGRES_USER:
        dc: services livebook.postgres_user
        override: LIVEBOOK_POSTGRES_USER
        default: livebook
      POSTGRES_PASSWORD:
        dc: services livebook.postgres_password
        override: LIVEBOOK_POSTGRES_PASSWORD
        optional: true
      POSTGRES_DB:
        dc: services livebook.postgres_db
        override: LIVEBOOK_POSTGRES_DB
        default: noizu_lab
      REDIS_HOST:
        dc: services livebook.redis_host
        override: LIVEBOOK_REDIS_HOST
        default: redis.apps-ns.svc.cluster.local
      REDIS_PORT:
        dc: services livebook.redis_port
        override: LIVEBOOK_REDIS_PORT
        default: "6379"
      REDIS_USERNAME:
        dc: services livebook.redis_username
        override: LIVEBOOK_REDIS_USERNAME
        default: admin
      REDIS_PASSWORD:
        ref: _lb_redis_pass
      WEAVIATE_URL:
        dc: services livebook.weaviate_url
        override: LIVEBOOK_WEAVIATE_URL
        default: "http://weaviate.weaviate-ns.svc:8080"
      WEAVIATE_API_KEY:
        ref: _lb_weaviate_key
      GITHUB_API_KEY:
        env: LIVEBOOK_GITHUB_API_KEY
        fallback: GITHUB_API_KEY
        optional: true

  # --- JupyterHub ---
  - id: jupyterhub
    title: "JupyterHub"
    path: /ai/jupyterhub
    secrets:
      JUPYTERHUB_PROXY_TOKEN:
        dc: auto jupyterhub_proxy_token
        override: JUPYTERHUB_PROXY_TOKEN
      GOOGLE_CLIENT_ID:
        dc: secrets google.client_id
        override: GOOGLE_CLIENT_ID
      GOOGLE_CLIENT_SECRET:
        dc: secrets google.client_secret
        override: GOOGLE_CLIENT_SECRET
      GITHUB_CLIENT_ID:
        env: GITHUB_CLIENT_ID
        optional: true
      GITHUB_CLIENT_SECRET:
        env: GITHUB_CLIENT_SECRET
        optional: true
      SMTP_HOST:
        dc: secrets smtp.host
        override: SMTP_HOST
      SMTP_PORT:
        dc: secrets smtp.port
        override: SMTP_PORT
      SMTP_USER:
        dc: secrets smtp.user
        override: SMTP_USER
      SMTP_PASS:
        dc: secrets sendgrid.jupyterhub
        override: SMTP_PASSWORD
      SMTP_FROM:
        dc: secrets smtp.from
        override: SMTP_FROM

  # --- Weaviate ---
  - id: weaviate
    title: "Weaviate"
    path: /ai/weaviate
    secrets:
      AUTHENTICATION_APIKEY_ALLOWED_KEYS:
        dc: services weaviate.authentication_apikey_allowed_keys
        override: WEAVIATE_API_KEY
      OPENAI_APIKEY:
        env: OPENAI_API_KEY
        optional: true
      <<: *ops_registry
      DOCKERHUB_USER:
        dc: secrets registry.dockerhub_user
        override: DOCKERHUB_USER
        optional: true
      DOCKERHUB_PASSWORD:
        dc: secrets registry.dockerhub_password
        override: DOCKERHUB_PASSWORD
        optional: true

  # --- Qdrant ---
  - id: qdrant
