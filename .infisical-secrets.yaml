  # --- NoizuPromptLingo (npl-mcp / tobor.locker) ---
  # Phoenix backend + Next.js frontend. Secret name: npl-mcp-secrets (apps-ns).
  #
  # IMPORTANT — key naming: the npl-mcp Deployment (helm/npl-mcp) reads the K8s
  # secret via secretKeyRef using BARE key names (DATABASE_URL, SECRET_KEY_BASE,
  # GUARDIAN_SECRET_KEY, AUTHENTIK_CLIENT_ID/SECRET/ISSUER, AUTH_SECRET). The
  # app-secrets.yaml InfisicalSecret template uses includeAllSecrets: true, which
  # copies Infisical key names VERBATIM. So the `secrets:` keys below MUST be the
  # BARE names (NOT NPL_MCP_*). The NPL_MCP_* names live only in `vars` (override
  # env names for dc/hydrate-envrc namespacing).
  #
  # These values are PINNED to match the live terraform-managed npl-mcp-secrets so
  # a future cut-over to the InfisicalSecret CRD will not change running values.
  - id: npl-mcp
    title: "NoizuPromptLingo (npl-mcp)"
    path: /apps/npl-mcp
    vars:
      _npl_db_user:
        dc: services apps.npl_mcp_db_user
        override: NPL_MCP_DB_USER
        default: tobor_locker
      _npl_db_pass:
        dc: services apps.npl_mcp_db_password
        override: NPL_MCP_DB_PASSWORD
    secrets:
      DB_PASSWORD:
        ref: _npl_db_pass
      # TODO(db-split): live host is app-timescaledb.apps.svc.cluster.local; once
      # the manual DB-split migration lands, move this DB to its target instance
      # (e.g. platform-timescaledb / app-postgres) and update this host + the live
      # secret together. Do NOT change the host independently — it will break the
      # running app, which currently connects to app-timescaledb / db tobor_locker.
      DATABASE_URL:
        template: "ecto://{{_npl_db_user}}:{{_npl_db_pass|urlencode}}@app-timescaledb.apps.svc.cluster.local:5432/tobor_locker"
      SECRET_KEY_BASE:
        dc: services apps.npl_mcp_secret_key_base
        override: NPL_MCP_SECRET_KEY_BASE
      GUARDIAN_SECRET_KEY:
        dc: services apps.npl_mcp_guardian_secret_key
        override: NPL_MCP_GUARDIAN_SECRET_KEY
      # Authentik OIDC (backend SSOController + frontend NextAuth/AuthJS). The
      # deployment maps AUTHENTIK_CLIENT_ID/SECRET to OIDC_CLIENT_ID/SECRET for the
      # backend and passes AUTHENTIK_* + AUTH_SECRET to the frontend.
      AUTHENTIK_CLIENT_ID:
        dc: services apps.npl_mcp_oidc_client_id
        override: NPL_MCP_OIDC_CLIENT_ID
      AUTHENTIK_CLIENT_SECRET:
        dc: services apps.npl_mcp_oidc_client_secret
        override: NPL_MCP_OIDC_CLIENT_SECRET
      AUTHENTIK_ISSUER:
        dc: services apps.npl_mcp_oidc_issuer
        override: NPL_MCP_OIDC_ISSUER
        default: "https://auth.derobot.is/application/o/tobor-locker/"
      AUTH_SECRET:
        dc: services apps.npl_mcp_auth_secret
        override: NPL_MCP_AUTH_SECRET
      # --- Media / LLM provider API keys (genai media framework, ADR-016) ---
      # Bare names so includeAllSecrets exposes them to the pod verbatim as the env vars
      # the genai providers read via System.get_env (OPENAI_API_KEY, GEMINI_API_KEY, ...).
      # Values sourced from the operator env (override) and/or the pinned dc store; the
      # dc paths follow the npl_mcp_* convention. Added 2026-06-25 for asset generation.
      OPENAI_API_KEY:
        dc: services apps.npl_mcp_openai_api_key
        override: OPENAI_API_KEY
      ANTHROPIC_API_KEY:
        dc: services apps.npl_mcp_anthropic_api_key
        override: ANTHROPIC_API_KEY
      GEMINI_API_KEY:
        dc: services apps.npl_mcp_gemini_api_key
        override: GEMINI_API_KEY
      CEREBRAS_API_KEY:
        dc: services apps.npl_mcp_cerebras_api_key
        override: CEREBRAS_API_KEY
      ZAI_API_KEY:
        dc: services apps.npl_mcp_zai_api_key
        override: ZAI_API_KEY
      SUNO_API_KEY:
        dc: services apps.npl_mcp_suno_api_key
        override: SUNO_API_KEY
      GROQ_API_KEY:
        dc: services apps.npl_mcp_groq_api_key
        override: GROQ_API_KEY
      MISTRAL_API_KEY:
        dc: services apps.npl_mcp_mistral_api_key
        override: MISTRAL_API_KEY
      DEEPSEEK_API_KEY:
        dc: services apps.npl_mcp_deepseek_api_key
        override: DEEPSEEK_API_KEY
      XAI_API_KEY:
        dc: services apps.npl_mcp_xai_api_key
        override: XAI_API_KEY
