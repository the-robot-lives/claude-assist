# =============================================================================
# Infisical Secret Definitions — Noizu K8s Infrastructure
# =============================================================================
# Declarative YAML translation of utils/infisical-populate-secrets.
# Each section maps to one populate_* function in the legacy script.
# =============================================================================

apiVersion: secrets-tools/v1
project:
  slug: k8-infra

# =============================================================================
# Reusable templates
# =============================================================================
templates:
  smtp: &smtp
    SMTP_HOST: { dc: secrets smtp.host, override: SMTP_HOST }
    SMTP_PORT: { dc: secrets smtp.port, override: SMTP_PORT }
    SMTP_USER: { dc: secrets smtp.user, override: SMTP_USER }
    SMTP_FROM: { dc: secrets smtp.from, override: SMTP_FROM }

  smtp_tls: &smtp_tls
    <<: *smtp
    SMTP_USE_TLS: { dc: secrets smtp.use_tls, override: SMTP_USE_TLS }
    SMTP_USE_SSL: { dc: secrets smtp.use_ssl, override: SMTP_USE_SSL }

  ops_registry: &ops_registry
    OPS_REGISTRY_USER: { dc: secrets registry.ops_user, override: OPS_REGISTRY_USER }
    OPS_REGISTRY_PASSWORD: { dc: secrets registry.ops_password, override: OPS_REGISTRY_PASSWORD }

  ghcr_registry: &ghcr_registry
    GHCR_USER: { dc: secrets ghcr.user, override: GHCR_USER, default: the-robot-lives }
    GHCR_TOKEN: { dc: secrets ghcr.token, override: GHCR_TOKEN }

  npm_verdaccio: &npm_verdaccio
    NPM_TOKEN: { dc: secrets npm.verdaccio_token, override: NPM_TOKEN }

# =============================================================================
# Groups — maps legacy ALL_SECTIONS / run_section dispatch
# =============================================================================
groups:
  shared-tls: [shared-tls]
  data-postgres: [data-postgres]
  data-mysql: [data-mysql]
  data-redis: [data-redis]
  data-valkey: [data-valkey]
  data-clickhouse: [data-clickhouse]
  platform-registry: [platform-registry]
  platform-minio: [platform-minio]
  platform-verdaccio: [platform-verdaccio]
  platform-authentik: [platform-authentik]
  mermaid-auth: [platform-authentik, mermaid]
  start-app-auth: [platform-authentik, start-app]
  foryou-auth: [platform-authentik, foryou]
  platform-keygen: [platform-keygen]
  analytics: [analytics]
  content: [content]
  crm: [crm]
  devtools: [devtools]
  marketing: [marketing]
  seo: [seo]
  observability: [signoz, phoenix, posthog, oneuptime]
  creative: [penpot, webstudio, excalidraw, drawio, mermaid]
  apps: [docmost, taiga, plane, nextcloud, ghost, matomo, mautic, espocrm, seonaut, listmonk, postiz, bottlecrm, growthbook, label-studio, serpbear, hakatime, code-server, n8n, codefresh, derobotis, start-app, foryou, tobornalp, chatterbox-tts, kitten-tts, livecodes, portal, coming-soon, ddi]
  ai: [open-webui, vllm, langfuse, livebook, jupyterhub, weaviate, qdrant]
  mail: [mailu]
  infisical: [infisical]
  incubator-apps: [apps-tls-codefresh, apps-tls-derobotis, apps-tls-aifighter, apps-tls-foryou, apps-tls-gottacc, apps-tls-iotgo, apps-tls-jailbreakingsite, apps-tls-noizuink, apps-tls-noizurpg, apps-tls-robotsunite, apps-tls-therobotlives, apps-tls-therobotknows, apps-tls-therobotmakes, apps-tls-therobotsrise, apps-tls-therobotstates, apps-tls-artificialbeingsanonymous, apps-tls-bewarethetobor, apps-tls-therobotbond, apps-tls-therobotcodes, apps-tls-therobotcourses, apps-tls-therobotinstitute, apps-tls-therobotlive, apps-tls-therobotstudy, apps-tls-therobotsupport, apps-tls-therobotventures, apps-tls-therobotwork, apps-tls-therobotedoesitall, apps-tls-therobotlearns, apps-tls-therobotplans, apps-tls-tobornalp, apps-tls-toborhelp, apps-tls-toborlocker, apps-tls-toborwiki, apps-infra]

# =============================================================================
# Sections
# =============================================================================
sections:

  # ===========================================================================
  # populate_shared_tls — /shared/tls
  # Cloudflare wildcard TLS certificate (*.noizu.com), synced to all namespaces
  # ===========================================================================
  - id: shared-tls
    title: "Shared TLS (*.noizu.com)"
    path: /shared/tls
    secrets:
      TLS_CRT:
        file: .secrets/tls/noizu.com/cert.pem
        override: TLS_CRT
        decode: base64
      TLS_KEY:
        file: .secrets/tls/noizu.com/key.pem
        override: TLS_KEY
        decode: base64
      CLOUDFLARE_CA_CRT:
        file: .secrets/tls/cloudflare/origin-pull-ca.pem
        override: CLOUDFLARE_CA_CRT
        decode: base64

  # ===========================================================================
  # populate_data_postgres — /data/postgres
  # Infra-tier PostgreSQL: superuser + infra-services apps only.
  # Apps: authentik, infisical, phoenix, posthog.
  # ===========================================================================
  - id: data-postgres
    title: "Infra PostgreSQL (infra-postgres)"
    path: /data/postgres
    secrets:
      # --- Superuser ---
      POSTGRES_PASSWORD:
        dc: auto pg_superuser_password
        override: PG_SUPERUSER_PASSWORD
      # --- Authentik ---
      AUTHENTIK_DB_USER:
        dc: auto authentik_db_user
        override: AUTHENTIK_DB_USER
        default: authentik
      AUTHENTIK_DB_PASSWORD:
        dc: auto authentik_db_password
        override: AUTHENTIK_DB_PASSWORD
      # --- Infisical ---
      INFISICAL_DB_USER:
        dc: auto infisical_db_user
        override: INFISICAL_DB_USER
        default: infisical
      INFISICAL_DB_PASSWORD:
        dc: auto infisical_db_password
        override: INFISICAL_DB_PASSWORD
      # --- Phoenix ---
      PHOENIX_DB_USER:
        dc: auto phoenix_db_user
        override: PHOENIX_DB_USER
        default: phoenix
      PHOENIX_DB_PASSWORD:
        dc: auto phoenix_db_password
        override: PHOENIX_DB_PASSWORD
      # --- PostHog ---
      POSTHOG_DB_USER:
        dc: auto posthog_db_user
        override: POSTHOG_DB_USER
        default: posthog
      POSTHOG_DB_PASSWORD:
        dc: auto posthog_db_password
        override: POSTHOG_DB_PASSWORD

  # ===========================================================================
  # populate_data_mysql — /data/mysql
  # Shared MySQL root password + per-app passwords
  # ===========================================================================
  - id: data-mysql
    title: "Shared MySQL"
    path: /data/mysql
    secrets:
      MYSQL_ROOT_PASSWORD:
        dc: services svc.services_mysql_root_password
        override: SERVICES_MYSQL_ROOT_PASSWORD
      GHOST_DB_PASSWORD:
        dc: auto ghost_mysql_db_password
        override: GHOST_MYSQL_DB_PASSWORD
      MATOMO_DB_PASSWORD:
        dc: services svc.matomo_db_password
        override: MATOMO_DB_PASSWORD
      MAUTIC_DB_PASSWORD:
        dc: services svc.mautic_db_password
        override: MAUTIC_DB_PASSWORD
      ESPOCRM_DB_PASSWORD:
        dc: services svc.espocrm_db_password
        override: ESPOCRM_DB_PASSWORD
      SEONAUT_DB_PASSWORD:
        dc: services svc.seonaut_db_password
        override: SEONAUT_DB_PASSWORD

  # ===========================================================================
  # populate_data_redis — /data/redis
  # ===========================================================================
  - id: data-redis
    title: "Shared Redis"
    path: /data/redis
    secrets:
      REDIS_PASSWORD:
        dc: services apps.redis_password
        override: APPS_REDIS_PASSWORD

  # ===========================================================================
  # populate_data_valkey — /data/valkey
  # ===========================================================================
  - id: data-valkey
    title: "Infra Valkey (infra-valkey)"
    path: /data/valkey
    secrets:
      VALKEY_PASSWORD:
        dc: auto valkey_password
        override: VALKEY_PASSWORD

# ==========================================================================
# populate_apps_postgres — /apps/postgres
# Consumed by apps/init -> modules/timescaledb (app-postgres-secrets).
# Root + per-app role/password keys for the initdb.d apps.
# Apps: aifighter, codefresh, derobotis, gotta_cc, iotgo, jailbreaking,
#       noizu_site, startapp, therobotknows, therobotlives, therobotplans,
#       foryou, tobornalp.
  # ===========================================================================
  - id: apps-postgres
    title: "Apps PostgreSQL (app-postgres)"
    path: /apps/postgres
    secrets:
      POSTGRES_USER: { override: APPS_POSTGRES_USER, default: postgres }
      POSTGRES_PASSWORD:
        dc: auto apps_postgres_password
        override: APPS_POSTGRES_PASSWORD
      AIFIGHTER_DB_USER: { override: AIFIGHTER_DB_USER, default: aifighter }
      AIFIGHTER_DB_PASSWORD:
        dc: services apps.aifighter_db_password
        override: AIFIGHTER_DB_PASSWORD
      CODEFRESH_DB_USER: { override: CODEFRESH_DB_USER, default: codefresh }
      CODEFRESH_DB_PASSWORD:
        dc: services apps.codefresh_db_password
        override: CODEFRESH_DB_PASSWORD
      DEROBOTIS_DB_USER: { override: DEROBOTIS_DB_USER, default: derobotis }
      DEROBOTIS_DB_PASSWORD:
        dc: services apps.derobotis_db_password
        override: DEROBOTIS_DB_PASSWORD
      # Designing.deRobot.is (ddi) — role provisioned via `provision-db ddi`.
      # Consumed by modules/timescaledb; the ddi env ref points at the managed
      # app-timescaledb-secrets. Sourced from the same dc values the ddi app
      # secret uses so the bootstrap role and the app agree on user/password.
      DDI_DB_USER:
        dc: services apps.ddi_db_user
        override: DDI_DB_USER
      DDI_DB_PASSWORD:
        dc: services apps.ddi_db_password
        override: DDI_DB_PASSWORD
      GOTTA_CC_DB_USER: { override: GOTTA_CC_DB_USER, default: gotta_cc }
      GOTTA_CC_DB_PASSWORD:
        dc: services apps.gotta_cc_db_password
        override: GOTTA_CC_DB_PASSWORD
      IOTGO_DB_USER: { override: IOTGO_DB_USER, default: iotgo }
      IOTGO_DB_PASSWORD:
        dc: services apps.iotgo_db_password
        override: IOTGO_DB_PASSWORD
      JAILBREAKING_DB_USER: { override: JAILBREAKING_DB_USER, default: jailbreaking }
      JAILBREAKING_DB_PASSWORD:
        dc: services apps.jailbreaking_db_password
        override: JAILBREAKING_DB_PASSWORD
      NOIZU_SITE_DB_USER: { override: NOIZU_SITE_DB_USER, default: noizu_site }
      NOIZU_SITE_DB_PASSWORD:
        dc: services apps.noizu_site_db_password
        override: NOIZU_SITE_DB_PASSWORD
      START_APP_DB_USER: { override: START_APP_DB_USER, default: startapp }
      START_APP_DB_PASSWORD:
        dc: services apps.startapp_db_password
        override: START_APP_DB_PASSWORD
      THEROBOTKNOWS_DB_USER: { override: THEROBOTKNOWS_DB_USER, default: therobotknows }
      THEROBOTKNOWS_DB_PASSWORD:
        dc: services apps.therobotknows_db_password
        override: THEROBOTKNOWS_DB_PASSWORD
      THEROBOTLIVES_DB_USER: { override: THEROBOTLIVES_DB_USER, default: therobotlives }
      THEROBOTLIVES_DB_PASSWORD:
        dc: services apps.therobotlives_db_password
        override: THEROBOTLIVES_DB_PASSWORD
      THEROBOTPLANS_DB_USER: { override: THEROBOTPLANS_DB_USER, default: therobotplans }
      THEROBOTPLANS_DB_PASSWORD:
        dc: services apps.therobotplans_db_password
        override: THEROBOTPLANS_DB_PASSWORD
      FORYOU_DB_USER: { override: FORYOU_DB_USER, default: foryou }
      FORYOU_DB_PASSWORD:
        dc: services apps.foryou_db_password
        override: FORYOU_DB_PASSWORD
      TOBORNALP_DB_USER: { override: TOBORNALP_DB_USER, default: tobornalp }
      TOBORNALP_DB_PASSWORD:
        dc: services apps.tobornalp_db_password
        override: TOBORNALP_DB_PASSWORD

  # ===========================================================================
  # populate_apps_valkey — /apps/valkey
  # Consumed by apps/init -> modules/valkey (app-valkey-secrets).
  # ===========================================================================
  - id: apps-valkey
    title: "Apps Valkey (app-valkey)"
    path: /apps/valkey
    secrets:
      VALKEY_PASSWORD:
        dc: auto apps_valkey_password
        override: APPS_VALKEY_PASSWORD
      # ACL user password — NoizuPromptLingo connects to app-valkey as "npl".
      NPL_VALKEY_PASSWORD:
        dc: auto npl_valkey_password
        override: NPL_VALKEY_PASSWORD
      # ACL user password — Designing.deRobot.is connects to app-valkey as "ddi".
      DDI_VALKEY_PASSWORD:
        dc: services apps.ddi_valkey_password
        override: DDI_VALKEY_PASSWORD
      # ACL user password — tobornalp connects to app-valkey as "tobornalp" (db 12).
      TOBORNALP_VALKEY_PASSWORD:
        dc: services apps.tobornalp_valkey_password
        override: TOBORNALP_VALKEY_PASSWORD
      # ACL user password — start-app connects to app-valkey as "startapp" (db 7).
      START_APP_VALKEY_PASSWORD:
        dc: services apps.startapp_valkey_password
        override: START_APP_VALKEY_PASSWORD
      # ACL user password — foryou connects to app-valkey as "foryou" (db 15).
      FORYOU_VALKEY_PASSWORD:
        dc: services apps.foryou_valkey_password
        override: FORYOU_VALKEY_PASSWORD

  # ===========================================================================
  # populate_data_clickhouse — /data/clickhouse
  # ===========================================================================
  - id: data-clickhouse
    title: "ClickHouse"
    path: /data/clickhouse
    secrets:
      SIGNOZ_TOKENIZER_JWT_SECRET:
        dc: services telemetry.signoz_tokenizer_jwt_secret
        override: SIGNOZ_TOKENIZER_JWT_SECRET

  # ===========================================================================
  # populate_platform_valkey — /platform/valkey
  # Consumed by platform/init -> modules/valkey (platform-valkey-secrets).
  # ===========================================================================
  - id: platform-valkey
    title: "Platform Valkey (shared)"
    path: /platform/valkey
    secrets:
      VALKEY_PASSWORD:
        dc: auto platform_valkey_password
        override: PLATFORM_VALKEY_PASSWORD

  # ===========================================================================
  # populate_platform_mongodb — /platform/mongodb
  # Consumed by platform/init -> modules/mongodb (platform-mongodb-secrets).
  # Per-app user keys must exist (module injects them as required env refs);
  # initdb create_db is a no-op when a user value is empty. Apps: growthbook.
  # ===========================================================================
  - id: platform-mongodb
    title: "Platform MongoDB (shared)"
    path: /platform/mongodb
    secrets:
      MONGO_ROOT_USERNAME: { override: MONGO_ROOT_USERNAME, default: root }
      MONGO_ROOT_PASSWORD:
        dc: auto platform_mongodb_root_password
        override: PLATFORM_MONGODB_ROOT_PASSWORD
      GROWTHBOOK_DB_USER: { override: GROWTHBOOK_DB_USER, default: growthbook }
      GROWTHBOOK_DB_PASSWORD:
        dc: auto growthbook_mongodb_db_password
        override: GROWTHBOOK_DB_PASSWORD

  # ===========================================================================
  # populate_platform_mariadb — /platform/mariadb
  # Consumed by platform/init -> modules/mariadb (platform-mariadb-secrets).
  # Root + per-app user/password keys for the initdb.d apps (module injects all
  # <APP>_DB_USER/<APP>_DB_PASSWORD as required env refs). Passwords/root mirror
  # the shared /data/mysql dc sources so values stay consistent across paths.
  # ===========================================================================
  - id: platform-mariadb
    title: "Platform MariaDB (shared)"
    path: /platform/mariadb
    secrets:
      MARIADB_ROOT_PASSWORD:
        dc: services svc.services_mysql_root_password
        override: SERVICES_MYSQL_ROOT_PASSWORD
      ESPOCRM_DB_USER: { override: ESPOCRM_DB_USER, default: espocrm }
      ESPOCRM_DB_PASSWORD:
        dc: services svc.espocrm_db_password
        override: ESPOCRM_DB_PASSWORD
      GHOST_DB_USER: { override: GHOST_DB_USER, default: ghost }
      GHOST_DB_PASSWORD:
        dc: auto ghost_mysql_db_password
        override: GHOST_MYSQL_DB_PASSWORD
      MATOMO_DB_USER: { override: MATOMO_DB_USER, default: matomo }
      MATOMO_DB_PASSWORD:
        dc: services svc.matomo_db_password
        override: MATOMO_DB_PASSWORD
      MAUTIC_DB_USER: { override: MAUTIC_DB_USER, default: mautic }
      MAUTIC_DB_PASSWORD:
        dc: services svc.mautic_db_password
        override: MAUTIC_DB_PASSWORD
      SEONAUT_DB_USER: { override: SEONAUT_DB_USER, default: seonaut }
      SEONAUT_DB_PASSWORD:
        dc: services svc.seonaut_db_password
        override: SEONAUT_DB_PASSWORD

  # ===========================================================================
  # populate_platform_postgres — /platform/postgres
  # Consumed by platform/init -> modules/timescaledb (platform-postgres-secrets).
  # Root + per-app role/password keys for the initdb.d apps (module injects all
  # <APP>_DB_USER/<APP>_DB_PASSWORD as required env refs).
  # Apps: bottlecrm, docmost, ghost, keygen, langfuse, listmonk, mermaid,
  #       n8n, nextcloud, penpot, plane, postiz, taiga, webstudio.
  # ===========================================================================
  - id: platform-postgres
    title: "Platform PostgreSQL (platform-postgres)"
    path: /platform/postgres
    secrets:
      POSTGRES_USER: { override: PLATFORM_POSTGRES_USER, default: postgres }
      POSTGRES_PASSWORD:
        dc: auto platform_postgres_password
        override: PLATFORM_POSTGRES_PASSWORD
      BOTTLECRM_DB_USER: { override: BOTTLECRM_DB_USER, default: bottlecrm }
      BOTTLECRM_DB_PASSWORD:
        dc: auto bottlecrm_pg_db_password
        override: BOTTLECRM_DB_PASSWORD
      DOCMOST_DB_USER: { override: DOCMOST_DB_USER, default: docmost }
      DOCMOST_DB_PASSWORD:
        dc: auto docmost_pg_db_password
        override: DOCMOST_DB_PASSWORD
      GHOST_DB_USER: { override: GHOST_PG_DB_USER, default: ghost }
      GHOST_DB_PASSWORD:
        dc: auto ghost_pg_db_password
        override: GHOST_PG_DB_PASSWORD
      KEYGEN_DB_USER: { override: KEYGEN_DB_USER, default: keygen }
      KEYGEN_DB_PASSWORD:
        dc: platform keygen.db_password
        override: KEYGEN_DB_PASSWORD
      LANGFUSE_DB_USER: { override: LANGFUSE_DB_USER, default: langfuse }
      LANGFUSE_DB_PASSWORD:
        dc: services design.langfuse_db_password
        override: LANGFUSE_DB_PASSWORD
      LISTMONK_DB_USER: { override: LISTMONK_DB_USER, default: listmonk }
      LISTMONK_DB_PASSWORD:
        dc: auto listmonk_pg_db_password
        override: LISTMONK_DB_PASSWORD
      MERMAID_DB_USER: { override: MERMAID_DB_USER, default: mermaid }
      MERMAID_DB_PASSWORD:
        dc: auto mermaid_pg_db_password
        override: MERMAID_DB_PASSWORD
      N8N_DB_USER: { override: N8N_DB_USER, default: n8n }
      N8N_DB_PASSWORD:
        dc: services design.n8n_db_password
        override: N8N_DB_PASSWORD
      NEXTCLOUD_DB_USER: { override: NEXTCLOUD_DB_USER, default: nextcloud }
      NEXTCLOUD_DB_PASSWORD:
        dc: auto nextcloud_pg_db_password
        override: NEXTCLOUD_DB_PASSWORD
      PENPOT_DB_USER: { override: PENPOT_DB_USER, default: penpot }
      PENPOT_DB_PASSWORD:
        dc: services design.penpot_db_password
        override: PENPOT_DB_PASSWORD
      PLANE_DB_USER: { override: PLANE_DB_USER, default: plane }
      PLANE_DB_PASSWORD:
        dc: auto plane_db_password
        override: PLANE_DB_PASSWORD
      POSTIZ_DB_USER: { override: POSTIZ_DB_USER, default: postiz }
      POSTIZ_DB_PASSWORD:
        dc: services design.postiz_db_password
        override: POSTIZ_DB_PASSWORD
      TAIGA_DB_USER: { override: TAIGA_DB_USER, default: taiga }
      TAIGA_DB_PASSWORD:
        dc: auto taiga_db_password
        override: TAIGA_DB_PASSWORD
      WEBSTUDIO_DB_USER: { override: WEBSTUDIO_DB_USER, default: webstudio }
      WEBSTUDIO_DB_PASSWORD:
        dc: services design.webstudio_db_password
        override: WEBSTUDIO_DB_PASSWORD

  # ===========================================================================
  # populate_accounting — /accounting
  # Consumed by platform/accounting (ERPNext + Kimai), managed Secret
  # accounting-app-secrets (includeAllSecrets + KIMAI_DATABASE_URL template).
  # ===========================================================================
  - id: accounting
    title: "Accounting (ERPNext + Kimai)"
    path: /accounting
    secrets:
      <<: *smtp
      MARIADB_ROOT_PASSWORD:
        dc: auto accounting_erpnext_mariadb_root_password
        override: ACCOUNTING_ERPNEXT_MARIADB_ROOT_PASSWORD
      ERPNEXT_ADMIN_PASSWORD:
        dc: auto accounting_erpnext_admin_password
        override: ERPNEXT_ADMIN_PASSWORD
      KIMAI_MARIADB_ROOT_PASSWORD:
        dc: auto accounting_kimai_mariadb_root_password
        override: KIMAI_MARIADB_ROOT_PASSWORD
      KIMAI_DATABASE_PASSWORD:
        dc: auto accounting_kimai_database_password
        override: KIMAI_DATABASE_PASSWORD
      KIMAI_ADMIN_EMAIL: { override: KIMAI_ADMIN_EMAIL, default: admin@noizu.com }
      KIMAI_ADMIN_PASSWORD:
        dc: auto accounting_kimai_admin_password
        override: KIMAI_ADMIN_PASSWORD
      KIMAI_APP_SECRET:
        dc: auto accounting_kimai_app_secret
        override: KIMAI_APP_SECRET

  # ===========================================================================
  # populate_analytics — /analytics
  # Consumed by platform/analytics (Matomo + GrowthBook), managed Secret
  # analytics-app-secrets (includeAllSecrets).
  # ===========================================================================
  - id: analytics
    title: "Analytics (Matomo + GrowthBook)"
    path: /analytics
    vars:
      _growthbook_db_user:
        dc: auto growthbook_db_user
        override: GROWTHBOOK_DB_USER
        default: growthbook
      _growthbook_db_pass:
        dc: auto growthbook_db_password
        override: GROWTHBOOK_DB_PASSWORD
    secrets:
      MATOMO_DB_PASSWORD:
        dc: services svc.matomo_db_password
        override: MATOMO_DB_PASSWORD
      GROWTHBOOK_JWT_SECRET:
        dc: services svc.growthbook_jwt_secret
        override: GROWTHBOOK_JWT_SECRET
      GROWTHBOOK_MONGODB_URI:
        template: "mongodb://{{_growthbook_db_user}}:{{_growthbook_db_pass|urlencode}}@platform-mongodb.platform.svc.cluster.local:27017/growthbook?authSource=growthbook"
      GROWTHBOOK_ENCRYPTION_KEY:
        dc: services svc.growthbook_encryption_key
        override: GROWTHBOOK_ENCRYPTION_KEY

  # ===========================================================================
  # populate_content — /content
  # Consumed by platform/content (Docmost + Ghost + Nextcloud), managed Secret
  # content-app-secrets (includeAllSecrets).
  # ===========================================================================
  - id: content
    title: "Content (Docmost + Ghost + Nextcloud)"
    path: /content
    vars:
      _docmost_db_user:
        dc: auto docmost_db_user
        override: DOCMOST_DB_USER
        default: docmost
      _docmost_db_pass:
        dc: auto docmost_db_password
        override: DOCMOST_DB_PASSWORD
      _apps_redis:
        dc: services apps.redis_password
        override: APPS_REDIS_PASSWORD
        optional: true
      _platform_valkey:
        dc: auto platform_valkey_password
        override: PLATFORM_VALKEY_PASSWORD
      _nextcloud_db_user:
        dc: auto nextcloud_db_user
        override: NEXTCLOUD_DB_USER
        default: nextcloud
      _nextcloud_db_pass:
        dc: auto nextcloud_db_password
        override: NEXTCLOUD_DB_PASSWORD
    secrets:
      <<: *smtp
      DOCMOST_JWT_SECRET:
        dc: services bob.docmost_jwt_secret
        override: DOCMOST_JWT_SECRET
      DOCMOST_DB_USER:
        ref: _docmost_db_user
      DOCMOST_DB_PASSWORD:
        ref: _docmost_db_pass
      DOCMOST_DATABASE_URL:
        template: "postgresql://{{_docmost_db_user}}:{{_docmost_db_pass|urlencode}}@platform-postgres.platform.svc.cluster.local:5432/docmost"
      DOCMOST_REDIS_URL:
        template: "redis://:{{_platform_valkey|urlencode}}@platform-valkey.platform.svc.cluster.local:6379/0"
      SMTP_PASSWORD:
        dc: secrets sendgrid.docmost
