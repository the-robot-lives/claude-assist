# =============================================================================
# Project Registry — build/deploy metadata for portfolio projects
# =============================================================================
project:
  # Empty name keeps composite Docker targets rooted at this checkout instead of
  # adding the historical "incubator" path segment.
  name: ""
  status: active
  type: composite

  projects:
    - domain: codefre.sh
      services:
        - name: backend
          dockerfile: app/backend/Dockerfile
          context: app/backend
          registry_path: codefre.sh/backend
          auto_detect: false
          helm:
            chart_path: kubernetes/helm/apps/codefresh
            values_path: .codefresh.backend.image
            format: image
        - name: frontend
          dockerfile: app/frontend/Dockerfile
          context: app/frontend
          registry_path: codefre.sh/frontend
          build_args:
            NEXT_PUBLIC_API_URL: https://api.codefre.sh
          auto_detect: false
          helm:
            chart_path: kubernetes/helm/apps/codefresh
            values_path: .codefresh.frontend.image
            format: image
        - name: web-landing
          dockerfile: web/Dockerfile
          context: web
          registry_path: codefre.sh/web-landing
          auto_detect: false
          helm:
            chart_path: projects/codefre.sh/helm/codefresh-landing
            values_path: .static-site.image
            format: image
      helm:
        charts:
          - name: codefresh
            path: kubernetes/helm/apps/codefresh
    - domain: start-app
      base_path: components/start-app
      services:
        - name: backend
          dockerfile: backend/Dockerfile
          context: backend
          registry_path: start-app/backend
          platform: linux/amd64
          auto_detect: false
          helm:
            chart_path: kubernetes/helm/apps/start-app
            values_path: .start-app.backend.image
            format: image
        - name: frontend
          dockerfile: frontend/Dockerfile
          context: frontend
          registry_path: start-app/frontend
          platform: linux/amd64
          build_args:
            NEXT_PUBLIC_API_URL: https://start-app.noizu.com
          auto_detect: false
          helm:
            chart_path: kubernetes/helm/apps/start-app
            values_path: .start-app.frontend.image
            format: image
      helm:
        charts:
          - name: start-app
            path: kubernetes/helm/apps/start-app
    - domain: noizu.com
      services:
        - name: backend
          dockerfile: app/backend/Dockerfile
          context: app/backend
          registry_path: noizu.com/backend
          auto_detect: false
          helm:
            chart_path: projects/noizu.com/helm/noizu-site
            values_path: .backend.image
            format: image
        - name: frontend
          dockerfile: app/frontend/Dockerfile
          context: app/frontend
          registry_path: noizu.com/frontend
          build_args:
            NEXT_PUBLIC_API_URL: https://api.noizu.com
          auto_detect: false
          helm:
            chart_path: projects/noizu.com/helm/noizu-site
            values_path: .frontend.image
            format: image
      helm:
        charts:
          - name: noizu-site
            path: projects/noizu.com/helm/noizu-site
    - domain: infra.noizu.com
      base_path: projects/infra.noizu.com
      services:
        - name: web
          dockerfile: Dockerfile
          context: .
          registry_path: infra.noizu.com/web
          platform: linux/amd64
          auto_detect: false
          helm:
            chart_path: projects/infra.noizu.com/helm/infra-portal
            values_path: .static-site.image
            format: image
    - domain: aifighter.com
      services:
        - name: backend
          dockerfile: app/backend/Dockerfile
          context: app/backend
          registry_path: aifighter.com/backend
          auto_detect: false
          helm:
            chart_path: projects/aifighter.com/helm/aifighter
            values_path: .backend.image
            format: image
        - name: frontend
          dockerfile: app/frontend/Dockerfile
          context: app/frontend
          registry_path: aifighter.com/frontend
          build_args:
            NEXT_PUBLIC_API_URL: https://api.aifighter.com
          auto_detect: false
          helm:
            chart_path: projects/aifighter.com/helm/aifighter
            values_path: .frontend.image
            format: image
      helm:
        charts:
          - name: aifighter
            path: projects/aifighter.com/helm/aifighter
    - domain: bladeofeternity.com
      services:
        - name: backend
          dockerfile: backend/Dockerfile
          context: backend
        - name: web
          dockerfile: web/Dockerfile
          context: web
    - domain: derobot.is
      services:
        - name: teaser
          dockerfile: app/teaser/Dockerfile
          context: app/teaser
          helm:
            chart_path: kubernetes/helm/apps/derobotis
            values_path: .derobotis.teaser.image
            format: image
      helm:
