# infra-config.yaml — Unified infrastructure config for k8-lib devops tools
#
# Scalar config (AWS, Docker, Helm, Infisical, etc.) lives in .envrc.k8.dc
# via direnv-config. This file contains structural/topology data and project
# build/deploy metadata.
#
# PATHS: All path values are resolved relative to this file's npl-directory.

apiVersion: k8-lib/v1

# --- Paths (relative to this file) ------------------------------------------
paths:
  helm_dir: kubernetes/helm
  terraform_dir: terraform
  projects_dir: .

# --- Cluster Status Patterns (grep -E regex) ---------------------------------
status_patterns: {}

# --- Cluster Layout -----------------------------------------------------------
nodepool_labels: {}

# --- Deploy One-Off -----------------------------------------------------------
placement_exclude_pattern: ""

# --- Deployment Tiers ---------------------------------------------------------
# Tier N completes before tier N+1 begins. Charts within a tier run in parallel.
tiers:
  - name: "Secrets Management"
    tier: 0
    charts:
      - infisical

  - name: "Data & Observability"
    tier: 1
    charts:
      - shared-zookeeper
      - shared-postgres
      - shared-mysql
      - shared-redis
      - shared-valkey
      - shared-mongodb
      - shared-clickhouse
      - signoz
      - otel-collector
      - phoenix
      - posthog
      - oneuptime
      - metabase

  - name: "Platform & Admin"
    tier: 2
    charts:
      - cockpit
      - headlamp
      - argocd
      - docker-registry
      - verdaccio
      - keygen
      - authentik
      - minio

  - name: "Core Applications"
    tier: 3
    charts:
      - codefresh
      - docmost
      - taiga
      - plane
      - nextcloud
      - ghost
      - espocrm
      - mautic
      - listmonk
      - postiz
      - bottlecrm
      - growthbook
      - matomo
      - seonaut
      - hakatime
      - n8n
      - portal
      - infra-portal
      - coming-soon
      - aifighter
      - bladeofeternity
      - derobotis
      - gotta-cc
      - iotgo
      - jailbreakingsite
      - mcphost
      - npl-mcp
      - noizu
      - noizurpg
      - robotsunite
      - therobotknows
      - therobotlearns
      - therobotlives
      - therobotmakes
      - start-app
      - therobotplans
      - tobornalp
      - ddi

  - name: "User-Facing & Creative"
    tier: 4
    charts:
      - penpot
      - webstudio
      - excalidraw
      - drawio
      - mermaid
      - chartdb
      - mydraft
      - kroki
      - plantuml
      - open-webui
      - langfuse
      - livebook
      - jupyterhub
      - label-studio
      - code-server
      - livecodes
      - serpbear

  - name: "Auxiliary & AI Infrastructure"
    tier: 5
    charts:
      - accounting-infra
      - mailu
      - vllm
      - weaviate
      - qdrant
      - chatterbox-tts
      - kitten-tts

  - name: "Health Tests"
    tier: 9
    charts:
      - health-tests

# --- Namespace Overrides ------------------------------------------------------
namespace_overrides:
  # Tier 0
  infisical: infisical
  # Tier 1 — Data
  shared-postgres: data-ns
  shared-mysql: data-ns
  shared-redis: data-ns
  shared-valkey: data-ns
  shared-mongodb: data-ns
  shared-clickhouse: data-ns
  shared-zookeeper: data-ns
  # Tier 1 — Observability
  signoz: observability-ns
  otel-collector: observability-ns
  phoenix: observability-ns
  posthog: observability-ns
  oneuptime: platform-observability
  metabase: observability-ns
  # Tier 2 — Platform
  cockpit: platform-ns
  headlamp: platform-ns
  argocd: platform-ns
  docker-registry: platform-ns
  verdaccio: platform-ns
  keygen: platform-ns
  authentik: platform-ns
  minio: platform-ns
  infra-portal: apps
  health-tests: platform-ns
  # Tier 3-4 — Apps
  codefresh: apps
  docmost: apps
  taiga: apps
  plane: apps
  nextcloud: apps
  ghost: apps
  espocrm: apps
  mautic: apps
  listmonk: apps
  postiz: apps
  bottlecrm: apps
  growthbook: apps
  label-studio: apps
  matomo: apps
  serpbear: apps
  seonaut: apps
  hakatime: apps
  code-server: apps
  livecodes: apps
  n8n: apps
  portal: apps
  coming-soon: apps
  chatterbox-tts: apps
  kitten-tts: apps
  aifighter: apps
  bladeofeternity: apps
  derobotis: apps
  gotta-cc: apps
  iotgo: apps
  jailbreakingsite: apps
  mcphost: apps
  npl-mcp: apps
  noizu: apps
  noizurpg: apps
  robotsunite: apps
  therobotknows: apps
  therobotlearns: apps
  therobotlives: apps
  therobotmakes: apps
  start-app: apps
  therobotplans: apps
  tobornalp: apps
  ddi: apps
  noizu-site: apps
  remote-access: apps
  # Tier 4 — Creative
  penpot: creative-ns
  webstudio: creative-ns
  excalidraw: creative-ns
  drawio: creative-ns
  mermaid: creative-ns
  chartdb: creative-ns
  mydraft: creative-ns
  kroki: creative-ns
  plantuml: creative-ns
  # Tier 4-5 — AI/ML
  open-webui: ai-ns
  vllm: ai-ns
  langfuse: ai-ns
  livebook: ai-ns
  jupyterhub: ai-ns
  weaviate: ai-ns
  qdrant: ai-ns
  # Tier 5 — Accounting
  accounting-infra: accounting-ns
  # Tier 5 — Mail
  mailu: mail-ns

# --- Helm Scan Directories ----------------------------------------------------
helm_scan_dirs:
  - kubernetes/helm/platform
  - kubernetes/helm/apps
  - kubernetes/helm/data
  - kubernetes/helm/observability
  - kubernetes/helm/ai
  - kubernetes/helm/creative
  - kubernetes/helm/mail

# --- Chart Path Overrides -----------------------------------------------------
chart_path_overrides:
  infra-portal: projects/infra.noizu.com/helm/infra-portal
  aifighter: projects/aifighter.com/helm/aifighter
  therobotknows: projects/therobotknows.com/helm/therobotknows
  codefresh-landing: projects/codefre.sh/helm/codefresh-landing
  gotta-cc: projects/gotta.cc/helm/gotta-cc
  derobotis: projects/derobot.is/helm/derobotis
  iotgo: projects/iotgo.io/helm/iotgo
  jailbreakingsite: projects/jailbreakingsite.com/helm/jailbreakingsite
  noizu-site: projects/noizu.com/helm/noizu-site
  npl-mcp: projects/NoizuPromptLingo/helm/npl-mcp
  therobotlives: projects/therobotlives.com/helm/therobotlives
  therobotplans: projects/therobotplans.com/helm/therobotplans
  tobornalp: projects/tobornalp.com/helm/therobotplans
  ddi: projects/designing.derobot.is/helm/ddi

# --- Helm Preserve Values -----------------------------------------------------
# helm-upgrade passes --reset-values by default so a chart's values.yaml is the
# source of truth (prevents stale reused values silently ignoring new image tags
# / config). Charts listed here keep --reuse-values instead — use for stateful
# charts whose effective values include runtime --set or generated data NOT
# captured in values.yaml (e.g. timescaledb/postgres instances, vector DBs with
# generated auth). Add a chart here only if a reset would drop required runtime
# state.
helm_preserve_values:
  - weaviate
  - qdrant

# --- Timeout Overrides --------------------------------------------------------
timeout_overrides:
  infisical: 10m
  cockpit: 10m
  jupyterhub: 15m
  weaviate: 10m
  vllm: 120m
  mailu: 10m
  chatterbox-tts: 10m
  oneuptime: 10m
  penpot: 10m
  plane: 10m

# --- Liquibase Shell Targets --------------------------------------------------
# Used by incubator/utilities/devops/database-tools/bin/liquibase-shell.
# Paths are relative to this config file.
liquibase_targets:
  # Instance-level TimescaleDB targets. These are connection targets; add a
  # Liquibase --changelog-file argument or use an app-specific target below
  # when running migrations.
  shared-postgres:
    description: "Shared TimescaleDB instance in data-ns"
    namespace: data-ns
    service: svc/shared-postgres
    remote_port: 5432
    local_port: 54322
    db_type: postgresql
    db_name: postgres
    schema: public
    secret_name: data-postgres-secrets
    username: postgres
    secret_key: POSTGRES_PASSWORD
    safety: destructive

  hakatime:
    description: "Hakatime TimescaleDB instance in apps"
    namespace: apps
    service: svc/haka-db
    remote_port: 5432
    local_port: 54323
    db_type: postgresql
    db_name: haka
    schema: public
    secret_name: hakatime-secrets
    username: haka
    secret_key: HAKA_POSTGRES_PASSWORD
    safety: destructive

  hakatime-legacy:
    description: "Legacy Hakatime TimescaleDB instance in haka-ns"
    namespace: haka-ns
    service: svc/haka-db
    remote_port: 5432
    local_port: 54324
    db_type: postgresql
    db_name_key: POSTGRES_DB
    schema: public
    secret_name: haka-secrets
    username_key: POSTGRES_USER
    secret_key: POSTGRES_PASSWORD
    safety: destructive

  mailu-postgresql:
    description: "Mailu TimescaleDB instance in mail-ns"
    namespace: mail-ns
    service: svc/postgresql
    remote_port: 5432
    local_port: 54325
    db_type: postgresql
    db_name: postgres
    schema: public
    secret_name: mail-app-secrets
    username: postgres
    secret_key: POSTGRES_PASSWORD
    safety: destructive

  npl-mcp:
    description: "NPL MCP database on app-timescaledb"
    namespace: apps
    service: svc/app-timescaledb
    remote_port: 5432
    local_port: 54326
    db_type: postgresql
    db_name: tobor_locker
    schema: public
    secret_name: npl-mcp-secrets
    secret_namespace: apps
    username: tobor_locker
    secret_key: DB_PASSWORD
    safety: destructive
    # provision-db: role creds from dc, superuser from the live instance secret
    role_password_dc: "services apps.npl_mcp_db_password"
    admin_secret: app-timescaledb-secrets
    # Valkey/Redis ACL user on app-valkey (NoizuPromptLingo connects as "npl")
    redis_password_dc: "auto npl_valkey_password"
    redis_service: svc/app-valkey
    redis_user: npl
    redis_admin_secret: app-valkey-secrets
    # superuser-only extensions the changelog needs pre-created (pgvector et al.)
    extensions: [citext, uuid-ossp, vector, cube, pg_trgm, earthdistance]
    changelog_dir: projects/NoizuPromptLingo/backend/db
    changelog_file: changelog/db.changelog-master.yaml

  # App-level targets with concrete Liquibase changelogs.
  ddi:
    description: "Designing.deRobot.is app database on app-timescaledb"
    namespace: apps
    service: svc/app-timescaledb
    remote_port: 5432
    local_port: 54338
    db_type: postgresql
    db_name: designing_derobot_is
    schema: public
    secret_name: ddi-secrets
    secret_namespace: apps
    username: ddi
    secret_key: DDI_DB_PASSWORD
    safety: destructive
    # provision-db: role creds from dc, superuser from the live instance secret
    role_password_dc: "services apps.ddi_db_password"
    admin_secret: app-timescaledb-secrets
    # Valkey/Redis ACL user on app-valkey (provision: `provision-db ddi --redis-only`)
    redis_password_dc: "services apps.ddi_valkey_password"
    redis_service: svc/app-valkey
    redis_user: ddi
    redis_admin_secret: app-valkey-secrets
    # superuser-only extensions the changelog needs pre-created (pgvector et al.)
    extensions: [citext, uuid-ossp, vector, cube, pg_trgm, earthdistance]
    changelog_dir: projects/designing.derobot.is/app/backend/db
    changelog_file: changelog/db.changelog-master.yaml

  start-app:
    description: "Start App PostgreSQL on shared-postgres"
    namespace: data-ns
    service: svc/shared-postgres
    remote_port: 5432
    local_port: 54320
    db_type: postgresql
    db_name: startapp
    schema: public
    secret_name: data-postgres-secrets
    username_key: STARTAPP_DB_USER
    username_key_fallbacks:
      - START_APP_DB_USER
    secret_key: STARTAPP_DB_PASSWORD
    secret_key_fallbacks:
      - START_APP_DB_PASSWORD
    safety: destructive
    changelog_dir: incubator/start-app/backend/db
    changelog_file: changelog/db.changelog-master.yaml

  mermaid:
    description: "Mermaid Live Editor PostgreSQL on shared-postgres"
    namespace: data-ns
    service: svc/shared-postgres
    remote_port: 5432
    local_port: 54321
    db_type: postgresql
    db_name: mermaid
    schema: public
    secret_name: data-postgres-secrets
    username_key: MERMAID_DB_USER
    secret_key: MERMAID_DB_PASSWORD
    safety: destructive
    changelog_dir: repos/3rd/mermaid-live-editor/db
    changelog_file: changelog/db.changelog-master.yaml

  # --- Portfolio app databases (shared-postgres via ExternalName) ---
  aifighter:
    description: "AiFighter app database"
    namespace: data-ns
    service: svc/shared-postgres
    remote_port: 5432
    local_port: 54330
    db_type: postgresql
    db_name: aifighter
    schema: public
    secret_name: aifighter-secrets
    secret_namespace: apps
    username_key: AIFIGHTER_DB_USER
    secret_key: AIFIGHTER_DB_PASSWORD
    changelog_dir: projects/aifighter.com/app/backend/priv/repo/migrations

  gotta-cc:
    description: "GottaCC app database"
    namespace: data-ns
    service: svc/shared-postgres
    remote_port: 5432
    local_port: 54331
    db_type: postgresql
    db_name: gotta_cc
    schema: public
    secret_name: gotta-cc-secrets
    secret_namespace: apps
    username_key: GOTTA_CC_DB_USER
    secret_key: GOTTA_CC_DB_PASSWORD
    changelog_dir: projects/gotta.cc/app/backend/priv/repo/migrations

  iotgo:
    description: "IoTGo app database"
    namespace: data-ns
    service: svc/shared-postgres
    remote_port: 5432
    local_port: 54332
    db_type: postgresql
    db_name: iotgo
    schema: public
    secret_name: iotgo-secrets
    secret_namespace: apps
    username_key: IOTGO_DB_USER
    secret_key: IOTGO_DB_PASSWORD
    changelog_dir: projects/iotgo.io/app/backend/priv/repo/migrations

  jailbreaking:
    description: "JailbreakingSite app database"
    namespace: data-ns
    service: svc/shared-postgres
    remote_port: 5432
    local_port: 54333
    db_type: postgresql
    db_name: jailbreaking
    schema: public
    secret_name: jailbreakingsite-secrets
    secret_namespace: apps
    username_key: JAILBREAKING_DB_USER
    secret_key: JAILBREAKING_DB_PASSWORD
    changelog_dir: projects/jailbreakingsite.com/app/backend/priv/repo/migrations

  therobotknows:
    description: "TheRobotKnows app database"
    namespace: data-ns
    service: svc/shared-postgres
    remote_port: 5432
    local_port: 54334
    db_type: postgresql
    db_name: therobotknows
    schema: public
    secret_name: therobotknows-secrets
    secret_namespace: apps
    username_key: THEROBOTKNOWS_DB_USER
    secret_key: THEROBOTKNOWS_DB_PASSWORD
    changelog_dir: projects/therobotknows.com/app/backend/priv/repo/migrations

  therobotlives:
    description: "TheRobotLives app database"
    namespace: data-ns
    service: svc/shared-postgres
    remote_port: 5432
    local_port: 54335
    db_type: postgresql
    db_name: therobotlives
    schema: public
    secret_name: therobotlives-secrets
    secret_namespace: apps
    username_key: THEROBOTLIVES_DB_USER
    secret_key: THEROBOTLIVES_DB_PASSWORD
    changelog_dir: projects/therobotlives.com/app/backend/priv/repo/migrations

  noizu-site:
    description: "NoizuSite app database"
    namespace: data-ns
    service: svc/shared-postgres
    remote_port: 5432
