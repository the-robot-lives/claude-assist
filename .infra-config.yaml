# infra-config.yaml — Unified infrastructure config for k8-lib devops tools
#
# Scalar config (AWS, Docker, Helm, Infisical, etc.) lives in .envrc.k8.dc
# via direnv-config. This file contains structural/topology data and project
# build/deploy metadata.
#
# PATHS: All path values are resolved relative to this file's npl-directory.

apiVersion: k8-lib/v1

# --- Paths (relative to this file) ------------------------------------------
paths:
  helm_dir: kubernetes/helm
  terraform_dir: terraform
  projects_dir: .

# --- Cluster Status Patterns (grep -E regex) ---------------------------------
status_patterns: {}

# --- Cluster Layout -----------------------------------------------------------
nodepool_labels: {}

# --- Deploy One-Off -----------------------------------------------------------
placement_exclude_pattern: ""

# --- Deployment Tiers ---------------------------------------------------------
# Tier N completes before tier N+1 begins. Charts within a tier run in parallel.
tiers:
  - name: "Secrets Management"
    tier: 0
    charts:
      - infisical

  - name: "Data & Observability"
    tier: 1
    charts:
      - shared-zookeeper
      - shared-postgres
      - shared-mysql
      - shared-redis
      - shared-valkey
      - shared-mongodb
      - shared-clickhouse
      - signoz
      - otel-collector
      - phoenix
      - posthog
      - oneuptime
      - metabase
      # Lacrosse staging data + observability stack (terragrunt-managed, like
      # oneuptime — no Helm chart). One terragrunt module (terraform/kubernetes/
      # platform/lacrosse) stands up 2x TimescaleDB + Valkey + Manticore + a
      # dedicated SigNoz/OTel in the lacrosse-infra namespace.
      - lacrosse-infra

  - name: "Platform & Admin"
    tier: 2
    charts:
      - cockpit
      - headlamp
      - argocd
      - docker-registry
      - verdaccio
      - keygen
      - authentik
      - minio

  - name: "Core Applications"
    tier: 3
    charts:
      - codefresh
      - docmost
      - taiga
      - plane
      - nextcloud
      - ghost
      - espocrm
      - mautic
      - postiz
      - bottlecrm
      - growthbook
      - matomo
      - seonaut
      - hakatime
      - n8n
      - portal
      - infra-portal
      - coming-soon
      - aifighter
      - bladeofeternity
      - derobotis
      - accords
      - gotta-cc
      - iotgo
      - jailbreakingsite
      - mcphost
      - npl-mcp
      - noizu
      - noizurpg
      - robotsunite
      - therobotdrafts
      - therobotknows
      - therobotlearns
      - therobotlives
      - therobotmakes
      - start-app
      - therobotplans
      - foryou
      - tobornalp
      - ddi
      - timely

  - name: "User-Facing & Creative"
    tier: 4
    charts:
      - penpot
      - webstudio
      - excalidraw
      - drawio
      - mermaid
      - chartdb
      - mydraft
      - kroki
      - plantuml
      - open-webui
      - langfuse
      - livebook
      - jupyterhub
      - label-studio
      - code-server
      - livecodes
      - serpbear

  - name: "Auxiliary & AI Infrastructure"
    tier: 5
    charts:
      - accounting-infra
      - mailu
      - vllm
      - weaviate
      - qdrant
      - chatterbox-tts
      - kitten-tts

  - name: "Health Tests"
    tier: 9
    charts:
      - health-tests

# --- Namespace Overrides ------------------------------------------------------
namespace_overrides:
  # Tier 0
  infisical: infisical
  # Tier 1 — Data
  shared-postgres: data-ns
  shared-mysql: data-ns
  shared-redis: data-ns
