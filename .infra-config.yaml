        # Liquibase changelog image (apps/backend/db). Schema lives in these
        # changelogs, not in Ecto migrations - see migrate.liquibase in
        # values.yaml. Helm stanza wired and migrate.liquibase.enabled: true,
        # so this build target is load-bearing: without it the pre-upgrade
        # Liquibase Job (hook weight -10) has no image and a deploy either
        # fails the `required` check or, if left disabled, comes up green
