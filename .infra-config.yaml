    - domain: iotgo.io
      services:
        - name: backend
          dockerfile: app/backend/Dockerfile
          context: app/backend
          registry_path: iotgo.io/backend
          auto_detect: false
          helm:
            chart_path: projects/iotgo.io/helm/iotgo
            values_path: .backend.image
            format: image
        - name: frontend
          dockerfile: app/frontend/Dockerfile
          context: app/frontend
          registry_path: iotgo.io/frontend
          build_args:
            NEXT_PUBLIC_API_URL: https://api.iotgo.io
          auto_detect: false
          helm:
            chart_path: projects/iotgo.io/helm/iotgo
            values_path: .frontend.image
            format: image
      helm:
        charts:
          - name: iotgo
            path: projects/iotgo.io/helm/iotgo
    - domain: jailbreakingsite.com
      services:
        - name: backend
          dockerfile: app/backend/Dockerfile
          context: app/backend
          registry_path: jailbreakingsite.com/backend
