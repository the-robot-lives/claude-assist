color-palette:
  - group: "Garden Neutrals"
    colors:
      - name: "Garden White"
        hex: "#FAFDF7"
      - name: "Soft Moss"
        hex: "#F0F5EB"
      - name: "Clean White"
        hex: "#FFFFFF"
      - name: "Green Border"
        hex: "#D4E0CC"
      - name: "Sage"
        hex: "#5A6B5A"
      - name: "Deep Forest"
        hex: "#1E2D1E"
    notes:
      - "Barely-green-tinted neutrals — warmth without overt color"
      - "Organic tones that read as natural, not clinical"

  - group: "Life Colors"
    colors:
      - name: "Living Green"
        hex: "#2D9C6F"
      - name: "Sky Blue"
        hex: "#4A8FBF"
      - name: "Sunlight Amber"
        hex: "#E8A849"
    notes:
      - "Green: primary accent — growth, vitality, the sprout"
      - "Blue: openness, sky, possibility, trust"
      - "Amber: warmth, sunlight, epoch markers, energy"

  - group: "Night Garden (Dark Mode)"
    colors:
      - name: "Deep Night"
        hex: "#0D1A14"
      - name: "Dark Canopy"
        hex: "#152A1E"
      - name: "Night Glow Green"
        hex: "#3DC48A"
      - name: "Night Glow Blue"
        hex: "#6AAFDF"
    notes:
      - "Navy-green dark mode — like a garden at night, bioluminescent accents"

  - group: "Semantic"
    colors:
      - name: "Success"
        hex: "#2D9C6F"
      - name: "Warning"
        hex: "#E8A849"
      - name: "Error"
        hex: "#D14F4F"
      - name: "Info"
        hex: "#4A8FBF"
