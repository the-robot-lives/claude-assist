semantic-groups:
  - name: "Action"
    description: "Movement calls to action and urgency levels"
  - name: "Feedback"
    description: "User feedback and messaging"

semantic-classes:
  - name: "Urgent"
    class: "urgent"
    group: "Action"
    vars:
      accent: "#FF3B30"
      accent-bg: "rgba(255, 59, 48, 0.15)"
      accent-text: "#FF3B30"

  - name: "Highlight"
    class: "highlight"
    group: "Action"
    vars:
      accent: "#FFD700"
      accent-bg: "rgba(255, 215, 0, 0.15)"
      accent-text: "#FFD700"

  - name: "Danger"
    class: "danger"
    group: "Feedback"
    vars:
      accent: "#FF3B30"
      accent-bg: "rgba(255, 59, 48, 0.15)"
      accent-text: "#FF3B30"

  - name: "Success"
    class: "success"
    group: "Feedback"
    vars:
      accent: "#34C759"
      accent-bg: "rgba(52, 199, 89, 0.15)"
      accent-text: "#34C759"

  - name: "Warning"
    class: "warning"
    group: "Feedback"
    vars:
      accent: "#FFD700"
      accent-bg: "rgba(255, 215, 0, 0.15)"
      accent-text: "#FFD700"

  - name: "Info"
    class: "info"
    group: "Feedback"
    vars:
      accent: "#5AC8FA"
      accent-bg: "rgba(90, 200, 250, 0.12)"
      accent-text: "#5AC8FA"
