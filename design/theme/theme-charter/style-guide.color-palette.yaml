color-palette:
  - group: "Parchment Scale"
    colors:
      - name: "Parchment White"
        hex: "#FFFCF7"
      - name: "Aged Paper"
        hex: "#F5F0E8"
      - name: "Parchment Edge"
        hex: "#D4C9B8"
      - name: "Warm Gray"
        hex: "#8A8070"
      - name: "Dark Ink"
        hex: "#5C5546"
      - name: "Near Black"
        hex: "#1A1A1A"
    notes:
      - "Paper-toned neutrals evoke constitutional documents and legal texts"
      - "High contrast between text and background for reading comfort"

  - group: "Accent Colors"
    colors:
      - name: "Seal Red"
        hex: "#8B2500"
      - name: "Institutional Navy"
        hex: "#1B3A5C"
      - name: "Gold"
        hex: "#C4991A"
    notes:
      - "Seal Red: article numbers, key terms, emphasis — used very sparingly"
      - "Navy: links, interactive elements, secondary headers"
      - "Gold: epoch markers, progress indicators, special callouts"

  - group: "Semantic"
    colors:
      - name: "Success"
        hex: "#2D6A4F"
      - name: "Warning"
        hex: "#C4991A"
      - name: "Error"
        hex: "#8B2500"
      - name: "Info"
        hex: "#1B3A5C"
    notes:
      - "Semantic colors are muted to match the restrained editorial palette"
